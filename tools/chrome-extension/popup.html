<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.45 system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; background: #1f1410; color: #f3e6c8; }
  h1 { font-size: 15px; margin: 0 0 8px; color: #f0c26b; }
  .row { margin: 6px 0; }
  .ok { color: #7fd17f; } .bad { color: #ff8a7a; }
  ul { margin: 4px 0 0; padding-left: 16px; max-height: 150px; overflow: auto; }
  li { margin: 2px 0; word-break: break-word; }
  button { margin-top: 8px; width: 100%; padding: 7px; border: 0; border-radius: 6px; background: #b8862b; color: #1f1410; font-weight: 600; cursor: pointer; }
  small { color: #b9a582; }
</style>
</head>
<body>
  <h1>🪷 Chùa Online</h1>
  <div class="row" id="server"></div>
  <div class="row" id="scan"></div>
  <div class="row" id="sent"></div>
  <div class="row"><small>Bình luận vừa gửi:</small><ul id="last"></ul></div>
  <button id="test">Gửi thử 1 bình luận</button>
  <script src="popup.js"></script>
</body>
</html>
