<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="google" content="notranslate">
<title>Bia Hơi Đảo Thần Tiên</title>
<meta name="viewport" content="width=720">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Be+Vietnam+Pro:ital,wght@0,500;0,700;0,800;1,600&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
  #tap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);
       color:#7ff3ff;font:bold 26px "Be Vietnam Pro",Arial,sans-serif;cursor:pointer;text-align:center}
</style></head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<div id="tap">Bấm để bật âm thanh 🎵<br><small style="font-size:15px">(trong OBS sẽ tự bật)</small></div>
<script>
'use strict';
// Bia Hơi Đảo Thần Tiên (game/bia-hoi): quán bar đảo đêm. Bình luận = vào bàn (8 bàn × 4 ghế), quà = gọi món cho bàn mình,
// "dzô" = cả bàn cụng ly, minigame luân phiên ở giữa, vũ công Ngân nhảy theo nhạc trên sân khấu riêng.
// Hướng C đã duyệt: cốc bia chỉ trang trí, không cảnh uống / thử thách uống; dòng "uống có trách nhiệm" luôn hiện.
// Tham số link nguồn: ?cam=1 ô camera chủ quán · ?music=synth|off ép nhạc · ?scale=2 ép độ nét
const W = 720, H = 1280, CX = 360;
const Q = new URLSearchParams(location.search);
const c = document.getElementById('c'); let x = c.getContext('2d');
let SC = 1;
function pickScale(){ const q = +Q.get('scale'); const v = q || Math.min(innerWidth / 720, innerHeight / 1280) * (window.devicePixelRatio || 1);
  return Math.min(2, Math.max(1, Math.ceil(v * 4) / 4)); }
function applyScale(){ SC = pickScale(); c.width = 720 * SC; c.height = 1280 * SC; }
applyScale();
const PLATFORM = location.pathname.split('/').filter(Boolean)[0] || 'tiktok';
const SANS = '"Be Vietnam Pro","DejaVu Sans",Arial,sans-serif', SIGN = '"Lobster","Be Vietnam Pro",serif';
const PINK='#ff3fa4', CYAN='#2fe6ff', VIO='#9b5cff', LIME='#7dff8a', GOLD='#ffd84a';
const AV = ['#e57373','#64b5f6','#81c784','#ffb74d','#ba68c8','#4db6ac','#f06292','#a1887f'];
const now = () => performance.now();
const hash = s => { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return h >>> 0; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const ease = k => k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;

// ---------------- vẽ cơ bản ----------------
function rr(a,b,w,h,q){x.beginPath();x.moveTo(a+q,b);x.arcTo(a+w,b,a+w,b+h,q);x.arcTo(a+w,b+h,a,b+h,q);x.arcTo(a,b+h,a,b,q);x.arcTo(a,b,a+w,b,q);x.closePath();}
function lg(x0,y0,x1,y1,st){const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function rg(cx,cy,r0,r1,st){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function glow(cx,cy,r,a,b){x.fillStyle=rg(cx,cy,0,r,[[0,a],[1,b]]);x.beginPath();x.arc(cx,cy,r,0,7);x.fill();}
function txt(t,X,Y,font,fill,align='center',stroke,o={}){x.save();x.font=font;x.textAlign=align;if(o.sp&&'letterSpacing' in x)x.letterSpacing=o.sp+'px';if(o.sh){x.shadowColor=o.sh[0];x.shadowBlur=o.sh[1];}
  if(o.a!=null)x.globalAlpha=o.a;if(stroke){x.lineJoin='round';x.lineWidth=stroke[1];x.strokeStyle=stroke[0];x.strokeText(t,X,Y);}x.fillStyle=fill;x.fillText(t,X,Y);x.restore();}
function fit(t,max,size,fam,wt='800'){let s=size;do{x.font=`${wt} ${s}px ${fam}`;}while(x.measureText(t).width>max&&--s>8);return x.font;}
const YEL=(y0,y1)=>lg(0,y0,0,y1,[[0,'#fff7c2'],[.5,GOLD],[1,'#ffb21e']]);
const short = (n,k=9) => [...String(n)].length>k ? [...String(n)].slice(0,k-1).join('')+'…' : String(n);
function layer(){ const cv=document.createElement('canvas'); cv.width=720*SC; cv.height=1280*SC; return cv; }
function paint(cv, fn){ const old=x; x=cv.getContext('2d'); x.setTransform(SC,0,0,SC,0,0); x.clearRect(0,0,W,H); fn(); x=old; }
function blit(cv){ x.drawImage(cv,0,0,W,H); }

// ảnh đại diện (TikTok trả link ảnh); chưa tải xong thì vẽ chữ cái đầu
const AVC = new Map();
function avatarImg(url){ if (!url) return null; let a = AVC.get(url);
  if (!a) { a = { img: new Image(), ok: false }; a.img.onload = () => a.ok = true; a.img.src = url; AVC.set(url, a); if (AVC.size > 300) AVC.delete(AVC.keys().next().value); }
  return a.ok ? a.img : null; }
function head(X,Y,r,u,ring='#fff3d6'){
  const im=avatarImg(u.avatar), h=hash(u.id||u.name);
  if (im) { x.save(); x.beginPath(); x.arc(X,Y,r,0,7); x.clip(); x.drawImage(im,X-r,Y-r,2*r,2*r); x.restore(); }
  else { x.fillStyle=AV[h%AV.length]; x.beginPath(); x.arc(X,Y,r,0,7); x.fill(); txt(([...(u.name||'?')][0]||'?').toUpperCase(),X,Y+r*.38,`800 ${Math.round(r*1.05)}px ${SANS}`,'#fff'); }
  x.lineWidth=Math.max(1.5,r*.14); x.strokeStyle=ring; x.beginPath(); x.arc(X,Y,r,0,7); x.stroke();
}

// ---------------- trạng thái ----------------
const S = { seats: new Array(32).fill(null), top: [], dzoTop: [], likes: 0, dzo: 0, goal: { n: 0, target: 300 },
  seg: { key: 'vui', name: '', sub: '', end: Date.now(), next: '' }, mg: { k: 'vui', rows: [] }, orders: [], vip: -1,
  nganX: 360, bubbles: new Map(), cheer: new Map(), tcheer: new Map(), floats: [], hearts: [], toasts: [], bigQ: [], big: null,
  combo: { n: 0, t: -1e9, name: '' }, anchor: new Map(), tdish: new Map(), sing: 0, hype: 0, ticker: '',
  act: new Map(), nudge: new Map(), poll: null, dancer: null, spot: null, spotLast: -1e9 };
// khách đã tương tác trong 10 phút thì sáng, ngồi im thì mờ (đang được gọi tên thì sáng)
const lit = (u, t) => Math.max(S.act.get(u.id) || 0, u.act || 0) > Date.now() - 600000 || (S.nudge.get(u.id) || 0) > t;
// 8 bàn: hàng sau 2 bàn (2 bên sân khấu), 2 hàng trước 3 bàn
const ROWS = [{ y: 822, s: .74, xs: [140, 580] }, { y: 968, s: .88, xs: [132, 360, 588] }, { y: 1122, s: 1.02, xs: [112, 360, 608] }];
const TBL = []; ROWS.forEach(r => r.xs.forEach(tx => TBL.push({ x: tx, y: r.y, s: r.s })));
const SEATS = [[-30,-46],[30,-46],[-64,-6],[64,-6]], RIM = [CYAN, PINK, VIO];
const HOME = { thu: { x: 250, y: 950, s: .9 }, mai: { x: 482, y: 1100, s: .98 } };
const STAFF = { thu: { ...HOME.thu, task: null, q: [] }, mai: { ...HOME.mai, task: null, q: [] } };

// ---------------- nhịp nhạc (vũ công nhảy theo) ----------------
let BPM = 124, beat0 = 0;
function beatNow(){ const t = AC && AC.state === 'running' ? AC.currentTime : now() / 1000; return (t - beat0) * BPM / 60; }

// ---------------- nền đảo (vẽ 1 lần) ----------------
function palm(bx,by,h,lean,s=1){
  x.strokeStyle='#120a24';x.lineWidth=14*s;x.lineCap='round';x.beginPath();x.moveTo(bx,by);x.quadraticCurveTo(bx+lean*.2,by-h*.6,bx+lean,by-h);x.stroke();
  x.strokeStyle='rgba(255,63,164,.35)';x.lineWidth=2;x.beginPath();x.moveTo(bx+6*s,by);x.quadraticCurveTo(bx+lean*.2+6*s,by-h*.6,bx+lean+5*s,by-h);x.stroke();
  const tx=bx+lean,ty=by-h;x.fillStyle='#0e1a2c';
  [-2.7,-2.2,-1.6,-1.0,-.45,.1].forEach((a,i)=>{const L=(70+(i%2)*18)*s,ex=tx+Math.cos(a)*L,ey=ty+Math.sin(a)*L*.55+L*.35;
    x.beginPath();x.moveTo(tx,ty);x.quadraticCurveTo(tx+Math.cos(a)*L*.5,ty-20*s,ex,ey);x.quadraticCurveTo(tx+Math.cos(a)*L*.45,ty-4*s,tx,ty);x.fill();});
  x.fillStyle='#3a2a1a';[[-5,6],[5,7],[0,12]].forEach(([dx,dy])=>{x.beginPath();x.arc(tx+dx*s,ty+dy*s,5*s,0,7);x.fill();});
}
const FY0 = 770, fxi = (i,y) => CX + i*(40 + 70*(y-FY0)/(H-FY0)); const FYS = []; for (let y = FY0; y < H; y += 22 + (y-FY0)*.05) FYS.push(y); FYS.push(H);
const TILES = []; for (let r = 0; r < FYS.length-1; r++) for (let i = -11; i <= 10; i++) { const h = hash(`t${r}_${i}`); if (h % 3) continue; TILES.push({ r, i, cl: [PINK,CYAN,VIO,LIME][h%4], ph: (h>>5)%16 }); }
function island(){
  x.fillStyle=lg(0,0,0,600,[[0,'#0b0420'],[.45,'#2a0a4a'],[.85,'#6a1a66'],[1,'#a43a6a']]);x.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){const h=hash('s'+i);x.fillStyle=`rgba(255,240,255,${.15+(h%50)/100})`;x.fillRect(h%W,(h>>8)%420,1.5,1.5);}
  glow(360,372,150,'rgba(255,230,180,.35)','rgba(255,200,160,0)');
  x.fillStyle=rg(345,360,8,62,[[0,'#fffbe6'],[1,'#ffe0a0']]);x.beginPath();x.arc(360,372,60,0,7);x.fill();
  x.fillStyle='rgba(220,180,120,.25)';[[340,352,9],[378,390,12],[372,350,6]].forEach(([a,b,r])=>{x.beginPath();x.arc(a,b,r,0,7);x.fill();});
  x.fillStyle='#1a0a30';x.beginPath();x.moveTo(0,575);x.quadraticCurveTo(120,520,240,568);x.quadraticCurveTo(300,555,330,575);x.lineTo(0,575);x.fill();
  x.beginPath();x.moveTo(470,575);x.quadraticCurveTo(600,530,720,560);x.lineTo(720,575);x.fill();
  x.fillStyle=lg(0,572,0,660,[[0,'#2a0f4a'],[1,'#0f0a2a']]);x.fillRect(0,572,W,88);
  for(let k=0;k<9;k++){const w=90-k*7;x.fillStyle=`rgba(255,230,170,${.55-k*.05})`;x.fillRect(360-w/2+(k%2)*6,578+k*9,w,2.5);}
  x.fillStyle=lg(0,650,0,770,[[0,'#3a1f3a'],[1,'#2a1430']]);x.fillRect(0,650,W,120);
  palm(214,770,300,-60,1.05);palm(506,770,320,70,1.1);palm(150,770,240,-90,.8);palm(580,770,250,95,.8);
  // quầy bar mái lá (phông sau sân khấu)
  x.fillStyle=lg(0,600,0,760,[[0,'#2a1530'],[1,'#160a1e']]);x.fillRect(250,600,220,160);
  [256,458].forEach(px=>{x.fillStyle='#5a3a1e';x.fillRect(px,596,8,164);});
  x.fillStyle='#7a5a2a';x.beginPath();x.moveTo(226,608);x.lineTo(360,552);x.lineTo(494,608);x.closePath();x.fill();
  x.fillStyle='#5e4420';for(let k=0;k<22;k++){const fx=228+k*12;x.beginPath();x.moveTo(fx,606);x.lineTo(fx+6,622+(k%3)*4);x.lineTo(fx+12,606);x.fill();}
  x.strokeStyle='rgba(255,220,140,.25)';x.lineWidth=1;for(let k=0;k<8;k++){x.beginPath();x.moveTo(360,556);x.lineTo(236+k*35,604);x.stroke();}
  txt('Đảo Thần Tiên',350,662,`27px ${SIGN}`,'#fff','center',null,{sh:[PINK,18]});txt('Đảo Thần Tiên',350,662,`27px ${SIGN}`,'#ffd0ea','center',null,{sh:[PINK,6]});
  x.fillStyle=lg(0,690,0,760,[[0,'#1c0c26'],[1,'#0e0614']]);x.fillRect(244,690,232,70);
  x.save();x.shadowColor=PINK;x.shadowBlur=14;x.fillStyle=PINK;x.fillRect(244,688,232,4);x.shadowColor=CYAN;x.fillStyle=CYAN;x.fillRect(244,756,232,3);x.restore();
  [[226,700],[494,700]].forEach(([sx,sy])=>{x.fillStyle='#0b0710';rr(sx-16,sy,32,58,4);x.fill();x.strokeStyle=CYAN;x.lineWidth=1.5;x.stroke();
    [[sy+18,9],[sy+42,11]].forEach(([cy,r])=>{x.strokeStyle='rgba(47,230,255,.6)';x.beginPath();x.arc(sx,cy,r,0,7);x.stroke();});});
  // sàn nhảy (nền); ô sáng nhấp nháy theo nhạc vẽ mỗi khung
  x.fillStyle='#120818';x.fillRect(0,FY0,W,H-FY0);
  x.strokeStyle='rgba(155,92,255,.22)';x.lineWidth=1;FYS.forEach(y=>{x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();});
  for(let i=-11;i<=11;i++){x.beginPath();x.moveTo(fxi(i,FY0),FY0);x.lineTo(fxi(i,H),H);x.stroke();}
  x.save();x.shadowColor=CYAN;x.shadowBlur=12;x.fillStyle=CYAN;x.fillRect(0,FY0-2,W,3);x.restore();
  x.fillStyle=lg(0,0,0,300,[[0,'rgba(5,2,14,.65)'],[1,'rgba(5,2,14,0)']]);x.fillRect(0,0,W,300);
}
function stringLights(t){
  [[620,46],[650,38]].forEach(([y0,sag],L)=>{x.strokeStyle='rgba(20,10,30,.9)';x.lineWidth=1.5;x.beginPath();x.moveTo(0,y0);x.quadraticCurveTo(CX,y0+sag*2,W,y0);x.stroke();
    for(let k=0;k<=18;k++){const u=k/18,bx=u*W,by=(1-u)*(1-u)*y0+2*(1-u)*u*(y0+sag*2)+u*u*y0+6,cl=[PINK,CYAN,GOLD,LIME,VIO][(k+L+Math.floor(t/700))%5];
      x.globalAlpha=.55;glow(bx,by,11,cl,cl+'00');x.globalAlpha=1;x.fillStyle=cl;x.beginPath();x.arc(bx,by,3.2,0,7);x.fill();}});
}
function floorFx(b){
  const k = b % 16;
  x.save(); x.globalCompositeOperation='lighter';
  for (const T of TILES) { const a = FYS[T.r], d = FYS[T.r+1], on = (T.ph === Math.floor(k)) || ((T.ph + Math.floor(b/4)) % 5 === 0);
    x.globalAlpha = on ? .32 : .09; x.fillStyle = T.cl;
    x.beginPath(); x.moveTo(fxi(T.i,a),a); x.lineTo(fxi(T.i+1,a),a); x.lineTo(fxi(T.i+1,d),d); x.lineTo(fxi(T.i,d),d); x.closePath(); x.fill(); }
  x.restore(); x.globalAlpha = 1;
}
function lasers(t, n){
  x.save(); x.globalCompositeOperation='lighter';
  [[30,250,PINK],[690,250,CYAN],[360,240,VIO]].forEach(([sx,sy,cl],j)=>{ for(let k=0;k<n;k++){
    const tx = CX + Math.sin(t/(2100+j*500) + k*1.3 + j) * 420, ty = 860 + Math.cos(t/2900 + k + j) * 260;
    x.strokeStyle=cl; x.globalAlpha=.09; x.lineWidth=7; x.beginPath(); x.moveTo(sx,sy); x.lineTo(tx,ty); x.stroke(); x.globalAlpha=.32; x.lineWidth=1.2; x.stroke(); }});
  x.restore(); x.globalAlpha=1;
}
function stage(t, b){
  const p = 1 - (b % 1);
  x.save(); x.globalCompositeOperation='lighter';
  [[250,240,PINK],[470,240,CYAN]].forEach(([sx,sy,cl])=>{x.globalAlpha=.6+.4*p;x.fillStyle=lg(0,sy,0,770,[[0,cl+'00'],[.4,cl+'22'],[1,cl+'55']]);
    x.beginPath();x.moveTo(sx-6,sy);x.lineTo(sx+6,sy);x.lineTo(450,770);x.lineTo(270,770);x.closePath();x.fill();});
  x.restore(); x.globalAlpha=1;
  x.fillStyle='#14081e';x.beginPath();x.ellipse(360,772,112,24,0,0,Math.PI);x.lineTo(248,758);x.ellipse(360,758,112,24,0,Math.PI,0,true);x.closePath();x.fill();
  x.fillStyle=rg(360,758,10,112,[[0,`rgba(255,240,200,${.35+.25*p})`],[.6,'rgba(255,63,164,.35)'],[1,'rgba(60,10,80,.9)']]);x.beginPath();x.ellipse(360,758,112,24,0,0,7);x.fill();
  x.save();x.shadowColor=PINK;x.shadowBlur=14;x.strokeStyle=PINK;x.lineWidth=2.5;x.beginPath();x.ellipse(360,758,112,24,0,0,7);x.stroke();
  x.shadowColor=CYAN;x.strokeStyle=CYAN;x.beginPath();x.ellipse(360,772,112,24,0,.15,Math.PI-.15);x.stroke();x.restore();
  txt('SÂN KHẤU ĐẢO',360,792,`800 11px ${SANS}`,'#fff','center',null,{sp:3,sh:[PINK,8]});
  const nb = Math.floor(b) % 4; [[-1,'♪'],[1,'♫']].forEach(([d,n],i)=>txt(n,360+d*(70+nb*3),640+i*14-((b%1)*10),`800 22px ${SANS}`,i?CYAN:PINK,'center',null,{sh:[i?CYAN:PINK,10],a:.5+.5*p}));
}

// ---------------- khách, bàn, món ----------------
function mug(X,Y,s){x.fillStyle='rgba(255,200,80,.85)';rr(X-6*s,Y-9*s,12*s,16*s,2*s);x.fill();x.fillStyle='#fffbe8';rr(X-6.5*s,Y-12*s,13*s,5*s,2.5*s);x.fill();
  x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=1.6*s;x.beginPath();x.arc(X+7*s,Y-1*s,4*s,-1.2,1.2);x.stroke();}
function dish(X,Y,s,k){x.fillStyle='#f4f1ea';x.beginPath();x.ellipse(X,Y,11*s,4.5*s,0,0,7);x.fill();
  if(k==='lac'){x.fillStyle='#c98a4a';for(let i=0;i<7;i++){x.beginPath();x.ellipse(X-6*s+(i%4)*4*s,Y-1.5*s-(i>3?2*s:0),2*s,1.4*s,0,0,7);x.fill();}}
  else if(k==='muc'){x.strokeStyle='#e8a868';x.lineWidth=3*s;x.lineCap='round';for(let i=0;i<3;i++){x.beginPath();x.moveTo(X-7*s+i*5*s,Y-1*s);x.quadraticCurveTo(X-4*s+i*5*s,Y-6*s,X-2*s+i*5*s,Y-1*s);x.stroke();}}
  else if(k==='ban'||k==='quan'){dish(X-4*s,Y,s*.7,'muc');dish(X+5*s,Y+1*s,s*.7,'nem');}
  else {x.fillStyle='#e0703a';for(let i=0;i<4;i++){rr(X-8*s+i*4.2*s,Y-4*s,3*s,6*s,1.4*s);x.fill();}}}
function stool(X,Y,s,cl){x.fillStyle='#1a1222';x.fillRect(X-1.5*s,Y-18*s,3*s,18*s);x.fillRect(X-8*s,Y-2*s,16*s,2*s);x.fillStyle=cl;rr(X-12*s,Y-22*s,24*s,6*s,3*s);x.fill();
  x.fillStyle='rgba(255,255,255,.3)';x.fillRect(X-10*s,Y-21*s,20*s,1.5*s);}
function guest(X,Y,s,u,t,o={}){
  const h=hash(u.id), shirt=AV[(h>>3)%AV.length]; stool(X,Y,s,h%2?PINK:CYAN);
  const ch = o.cheer, hop = ch ? Math.abs(Math.sin(t/140 + h)) * 5 * s : 0; Y -= hop;
  x.fillStyle=shirt;rr(X-15*s,Y-50*s,30*s,30*s,10*s);x.fill();x.fillStyle='rgba(0,0,0,.18)';x.fillRect(X-15*s,Y-26*s,30*s,6*s);
  if(ch){x.strokeStyle=shirt;x.lineWidth=7*s;x.lineCap='round';x.beginPath();x.moveTo(X+12*s,Y-44*s);x.lineTo(X+22*s,Y-66*s);x.stroke();mug(X+24*s,Y-72*s,s*.8);}
  const r=15*s, ay=Y-64*s;
  head(X,ay,r,u,o.vip?GOLD:'#fff3d6');
  S.anchor.set(u.id,{x:X,y:ay-r-20*s});
  const nm=short(u.name), f=`800 ${Math.round(10.5*Math.min(1.1,s+.15))}px ${SANS}`; x.font=f; const w=x.measureText(nm).width+10;
  x.fillStyle=o.vip?'rgba(150,20,90,.92)':'rgba(15,6,26,.8)';rr(X-w/2,ay-r-17*s-4,w,15,7.5);x.fill();txt(nm,X,ay-r-17*s+7,f,o.vip?'#ffe27a':'#fff');
}
// khách được mời lên sân khấu: đứng nhảy theo nhịp cạnh Ngân
function dancerGuest(X,Y,s,u,b,t){
  const h=hash(u.id), shirt=AV[(h>>3)%AV.length], ph=b%1, mv=Math.floor(b/4)%3, bo=Math.abs(Math.sin(b*Math.PI))*6;
  x.save(); x.translate(X,Y); x.scale(s,s);

    txt({thu:'Thu mang ra ngay',mai:'Mai mang ra ngay',all:'Cả quán phục vụ!'}[o.server]||'',CX,y+70,`italic 600 13px ${SANS}`,'#bff6ff');txt('cảm ơn bạn ủng hộ quán',CX,y+87,`italic 600 13px ${SANS}`,'#bff6ff');x.restore(); } }
  // combo DZÔ
  const cb=S.combo, ca=t-cb.t; if (ca<2600 && cb.n>=1 && !party) burst(CX,(S.dancer?900:600)-Math.min(ca,200)/20,`DZÔ ×${cb.n}`,Math.min(64,40+cb.n*2),`${short(cb.name,14)} vừa hô`,ca>2000?(2600-ca)/600:1);
  // khoảnh khắc lớn
  if (S.big) { const g=S.big, age=t-g.t, a=clamp(Math.min(age/300,(g.dur-age)/500),0,1);
    if (g.k==='quan'||g.k==='goal') { x.fillStyle=`rgba(20,0,30,${.3*a})`;x.fillRect(0,0,W,H); fireworks(g.t,t); }
    x.save();x.globalAlpha=a;x.fillStyle=lg(0,650,0,810,[[0,'rgba(60,0,60,0)'],[.2,'rgba(80,6,90,.92)'],[.8,'rgba(80,6,90,.92)'],[1,'rgba(60,0,60,0)']]);x.fillRect(0,650,W,160);x.restore();
    burst(CX,732,g.title,g.size||60,null,a); if (g.sub) txt(g.sub,CX,770,fit(g.sub,640,18,SANS),'#fff','center',['rgba(40,0,50,.9)',4],{a});
    if (g.k==='quan'||g.k==='goal') burst(CX,600,`DZÔ ×${S.seats.filter(Boolean).length||1}`,52,'cả đảo cùng cụng!',a); }
  drawHostCam(t);
  requestAnimationFrame(frame);
}

// ---------------- âm thanh: nhạc nền tự tạo (không bản quyền) hoặc nhạc trong thư mục music/ ----------------
let AC, master, bgGain, voiceGain, musBus, BGM;
function audioInit(){
  if (AC) return; AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = .85; master.connect(AC.destination);
  bgGain = AC.createGain(); bgGain.gain.value = .5; bgGain.connect(master);
  voiceGain = AC.createGain(); voiceGain.gain.value = 1.6; voiceGain.connect(master);
  musBus = AC.createGain(); musBus.gain.value = 1; musBus.connect(bgGain);
  beat0 = AC.currentTime + .3;
  const mode = Q.get('music');
  if (mode === 'off') {}
  else if (mode === 'synth') startSynth();
  else fetch('/music').then(r=>r.json()).then(l=> l.length ? playFiles(l) : startSynth()).catch(startSynth);
  if (AC.state === 'suspended' && !/[?&]shot/.test(location.search)) document.getElementById('tap').style.display = 'flex';
}
function playFiles(list){   // nhạc sếp tự bỏ vào music/: phát trộn ngẫu nhiên, hết bài sang bài
  let i = Math.floor(Math.random()*list.length);
  BGM = new Audio(); const src = AC.createMediaElementSource(BGM); src.connect(bgGain);
  const next = () => { i = (i+1) % list.length; BGM.src = '/music/' + encodeURIComponent(list[i]); BGM.play().catch(()=>{}); };
  BGM.onended = next; BGM.onerror = () => setTimeout(next, 1000); next();
}
// tropical house / EDM 4/4 tự tạo: trống, hi-hat, bass, hợp âm pluck; đổi vòng hợp âm + nhịp theo minigame
const PROG = { a: [[57,60,64],[53,57,60],[48,52,55],[55,59,62]], b: [[50,53,57],[46,50,53],[53,57,60],[48,52,55]], c: [[52,55,59],[48,52,55],[55,59,62],[50,54,57]] };
const mtof = m => 440*Math.pow(2,(m-69)/12);
let NOISE;
function noiseBuf(){ if (NOISE) return NOISE; NOISE = AC.createBuffer(1, AC.sampleRate*.5, AC.sampleRate); const d=NOISE.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return NOISE; }
function env(g,when,a,peak,d){ g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(peak,when+a); g.gain.exponentialRampToValueAtTime(.0005,when+a+d); }
function kick(w){ const o=AC.createOscillator(),g=AC.createGain(); o.frequency.setValueAtTime(150,w); o.frequency.exponentialRampToValueAtTime(48,w+.12); env(g,w,.002,.9,.28); o.connect(g); g.connect(bgGain); o.start(w); o.stop(w+.35);
  musBus.gain.cancelScheduledValues(w); musBus.gain.setValueAtTime(.35,w); musBus.gain.linearRampToValueAtTime(1,w+.22); }   // "bơm" theo trống
function hat(w,open,v=.12){ const n=AC.createBufferSource(); n.buffer=noiseBuf(); const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=open?6500:8500; const g=AC.createGain(); env(g,w,.001,v,open?.18:.04); n.connect(f); f.connect(g); g.connect(bgGain); n.start(w); n.stop(w+.3); }
function clap(w){ const n=AC.createBufferSource(); n.buffer=noiseBuf(); const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1500; f.Q.value=1.2; const g=AC.createGain(); env(g,w,.002,.35,.16); n.connect(f); f.connect(g); g.connect(bgGain); n.start(w); n.stop(w+.3); }
function bass(w,m,d){ const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(m-24); const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380; const g=AC.createGain(); env(g,w,.005,.22,d); o.connect(f); f.connect(g); g.connect(musBus); o.start(w); o.stop(w+d+.05); }
function pluck(w,ms,v=.05,cut=3200){ const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(cut,w); f.frequency.exponentialRampToValueAtTime(500,w+.25); const g=AC.createGain(); env(g,w,.004,v,.32); f.connect(g); g.connect(musBus);
  ms.forEach(m=>[-6,6].forEach(dt=>{ const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(m); o.detune.value=dt; o.connect(f); o.start(w); o.stop(w+.4); })); }
function riser(w,len){ const n=AC.createBufferSource(); n.buffer=noiseBuf(); n.loop=true; const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=2; f.frequency.setValueAtTime(400,w); f.frequency.exponentialRampToValueAtTime(7000,w+len);
  const g=AC.createGain(); g.gain.setValueAtTime(0,w); g.gain.linearRampToValueAtTime(.12,w+len); g.gain.linearRampToValueAtTime(0,w+len+.05); n.connect(f); f.connect(g); g.connect(bgGain); n.start(w); n.stop(w+len+.1); }
function startSynth(){
  let step = 0, next = AC.currentTime + .3;
  setInterval(() => {
    const key = S.seg.key, quay = key === 'quay', bpm = quay ? 128 : 122, sp = 60 / bpm / 4;
    if (bpm !== BPM) { beat0 = next - step / 4 * 60 / bpm; BPM = bpm; }
    const prog = PROG[{ vui:'a', ott:'b', quay:'a', do:'c', dzo:'b' }[key] || 'a'];
    while (next < AC.currentTime + .25) {
      const s = step % 16, bar = Math.floor(step / 16), sec = bar % 16, ch = prog[bar % 4], drop = sec >= 4 && sec < 14, br = sec >= 14;
      if ((drop || quay) && s % 4 === 0) kick(next);
      if (br && s % (sec === 15 ? 1 : 2) === 0) clap(next);
      if (drop && (s === 4 || s === 12)) clap(next);
      if (s % 4 === 2) hat(next, true, drop ? .1 : .06); else if (drop) hat(next, false, .05);
      if (drop && s % 4 === 2) bass(next, ch[0], sp * 1.8);
      if (!br && [0,3,6,10,12].includes(s)) pluck(next, ch, drop ? .045 : .035, drop ? 3600 : 1800);
      if (drop && [7,15].includes(s) && bar % 2) pluck(next, [ch[2] + 12], .03, 5000);
      if (sec === 14 && s === 0) riser(next, sp * 32);
      next += sp; step++;
    }
  }, 60);
}
function clink(){ if (!AC) return; const w=AC.currentTime+.01; [2637,3520].forEach((f,i)=>{ const o=AC.createOscillator(),g=AC.createGain(); o.frequency.value=f; env(g,w+i*.05,.002,.08,.25); o.connect(g); g.connect(master); o.start(w+i*.05); o.stop(w+.5); }); }
function duck(on){ if(!AC) return; bgGain.gain.cancelScheduledValues(AC.currentTime); bgGain.gain.linearRampToValueAtTime(on?.16:.5, AC.currentTime+.3); }
async function speak(m){
  const ack = () => ws && ws.readyState===1 && ws.send(JSON.stringify({t:'spoken',id:m.id}));
  if (/chị Hằng chúc|Chị Hằng chúc/.test(m.text)) S.sing = now() + 7000;
  if (!m.url || !AC) { setTimeout(ack, 1200 + m.text.length*55); return; }
  try { const ab = await AC.decodeAudioData(await (await fetch(m.url)).arrayBuffer());
    const src = AC.createBufferSource(); src.buffer = ab; src.connect(voiceGain); duck(true); src.onended = () => { duck(false); ack(); }; src.start();
  } catch (e) { console.warn('voice', e); ack(); }
}

// ---------------- kết nối server ----------------
let ws; const UIVER = '__UIVER__'; let reloading = false;
function checkVer(v){ if (!v || v === UIVER || UIVER.startsWith('__') || reloading) return; reloading = true; setTimeout(() => location.reload(), 1500 + Math.random() * 1500); }
function hello(){ if (ws && ws.readyState===1) ws.send(JSON.stringify({ t:'hello', w:innerWidth, h:innerHeight, dpr:window.devicePixelRatio||1, sc:SC, ver:UIVER, ua:navigator.userAgent.slice(0,120) })); }
function connect(){ ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?p='+PLATFORM);
  ws.onmessage = e => handle(JSON.parse(e.data)); ws.onopen = hello; ws.onclose = () => setTimeout(connect, 2000); }
const setSeg = g => { S.seg = { ...g, end: Date.now() + (g.left || 0) }; };
const at = id => S.anchor.get(id) || { x: CX, y: 900 };
function handle(m){
  const t = now();
  if (m.id && /^(chat|dzo|like|order|ott|quiz|call|bill|share|pollv)$/.test(m.t)) S.act.set(m.id, Date.now());
  switch (m.t) {
    case 'ver': checkVer(m.ver); break;
    case 'snapshot': checkVer(m.ver); Object.assign(S, { seats: m.seats, top: m.top || [], dzoTop: m.dzoTop || [], likes: m.likes || 0, dzo: m.dzo || 0, goal: m.goal || S.goal, orders: m.orders || [], vip: m.vip ?? -1, ticker: m.ticker || '' });
      if (m.seg) setSeg(m.seg); if (m.mg) S.mg = m.mg; S.dancer = m.dancer ? { ...m.dancer, t, cam: 0, end: Date.now() + m.dancer.left } : null; S.poll = m.poll ? { ...m.poll, end: Date.now() + m.poll.left } : null; break;
    case 'poll': S.poll = { ...m.poll, end: Date.now() + m.poll.left }; break;
    case 'pollv': { if (S.poll) S.poll.n = m.n; const p = at(m.id); S.floats.push({ t, x: p.x, y: p.y, text: `Chọn ${m.c + 1}`, cl: m.c ? CYAN : PINK, size: 14 }); S.cheer.set(m.id, t + 1200); break; }
    case 'pollend': S.poll = { q: m.q, a: m.a, n: m.n, win: m.win, end: 0, endAt: Date.now() }; break;
    case 'dance': { const d = m.dancer; S.dancer = { ...d, t, cam: t + 6000, end: Date.now() + d.left };
      S.bigQ.push({ k: 'win', title: `${short(d.name, 12)} lên sân khấu!`, sub: 'Nhảy cùng Ngân · cả đảo thả tim cổ vũ', size: 46, dur: 4200 });
      S.spot = null; camStage(6000); break; }
    case 'danceend': { if (S.dancer && S.dancer.id === m.id) S.dancer = null;
      S.floats.push({ t, x: 300, y: 700, text: `Cảm ơn ${short(m.name, 10)} · ${fmt(m.likes)} tim`, cl: GOLD, size: 17 }); break; }
    case 'nudge': { S.nudge.set(m.id, t + 9000); spot(m.id, 'Gọi bạn đó! Gõ dzô nào', 4500, true); const p = at(m.id); S.floats.push({ t: t + 300, x: p.x, y: p.y - 6, text: 'Gọi bạn đó!', cl: GOLD, size: 15 }); break; }
    case 'seats': S.seats = m.seats; break;
    case 'seg': setSeg(m.seg); if (m.mg) S.mg = m.mg; S.bigQ.push({ k: 'seg', title: m.seg.name, sub: m.seg.sub, size: 46, dur: 4200 }); break;
    case 'mg': S.mg = m.mg; break;
    case 'mgwin': { S.vip = m.vip ?? S.vip; const w = m.win;
      const ti = w.k === 'vui' ? `Bàn ${w.table + 1} vui nhất!` : w.k === 'ott' ? `${short(w.name, 12)} thắng chị Hằng!` : `Vua Dzô: ${short(w.name, 12)}`;
      S.bigQ.push({ k: 'win', title: ti, sub: w.k === 'vui' ? 'Cả bàn lên Bàn VIP · chị Hằng hát chúc' : `${fmt(w.n)} ${w.k === 'ott' ? 'ván thắng' : 'lần dzô'}`, size: 46, dur: 5500 });
      if (w.k === 'vui') { S.tcheer.set(w.table, t + 5000); camFocus(w.table); } S.sing = t + 7000; break; }
    case 'quiz': spot(m.id, 'trả lời đúng!', 4000, true); S.bigQ.push({ k: 'win', title: `${short(m.name, 12)} đúng rồi!`, sub: `“${short(m.a, 30)}” · cả đảo vỗ tay!`, size: 44, dur: 4500 }); S.cheer.set(m.id, t + 3000); break;
    case 'ott': { const p = at(m.id); S.floats.push({ t, x: p.x, y: p.y, text: `${m.you} · ${m.res === 'thang' ? 'THẮNG' : m.res === 'thua' ? 'thua' : 'hòa'}`, cl: m.res === 'thang' ? LIME : '#fff', size: 14 }); break; }
    case 'dzo': { S.dzo = m.n; const c = S.combo; c.n = t - c.t < 2600 ? c.n + 1 : 1; c.t = t; c.name = m.name; clink();
      if (m.table >= 0) S.tcheer.set(m.table, t + 1400); S.cheer.set(m.id, t + 1600); const p = at(m.id); S.floats.push({ t, x: p.x, y: p.y, text: 'Dzô!', cl: GOLD, size: 15 }); if (c.n === 6) spot(m.id, `DZÔ ×${c.n} · đang cháy!`); break; }
    case 'call': assign(m.server, { table: m.table, dish: null }); { const p = at(m.id); S.floats.push({ t, x: p.x, y: p.y, text: 'Em ơi!', cl: '#ffd0f0', size: 14 }); } break;
    case 'bill': { const p = at(m.id); S.floats.push({ t, x: p.x, y: p.y - 10, text: 'Hóa đơn: 100% vui vẻ', cl: GOLD, size: 14 }); break; }
    case 'chat': if (m.text) { S.bubbles.set(m.id, { text: m.text, t }); spot(m.id, `“${short(m.text, 24)}”`); } break;
    case 'like': { S.likes = m.total || S.likes; S.likeHit = t; if (m.goal) S.goal = m.goal; const p = at(m.id);
      for (let k = 0; k < Math.min(5, 1 + Math.floor(m.count / 3)); k++) S.hearts.push({ t: t + k * 120, x: p.x + (Math.random() - .5) * 16, y: p.y, s: 13 + Math.random() * 7, ph: Math.random() * 6 });
      if (S.dancer) { S.dancer.likes = (S.dancer.likes || 0) + (m.count || 1); for (let k = 0; k < 3; k++) S.hearts.push({ t: t + k * 140, x: 300 + (Math.random() - .5) * 50, y: 650, s: 15 + Math.random() * 8, ph: Math.random() * 6 }); }
      if (S.hearts.length > 60) S.hearts.splice(0, S.hearts.length - 60); break; }
    case 'goaldone': if (m.goal) S.goal = m.goal; S.bigQ.unshift({ k: 'goal', title: 'Đảo bùng nổ!', sub: `Cả đảo đã thả đủ ${fmt(m.target)} tim · Ngân lên đồ!`, dur: 7000 }); break;
    case 'share': case 'follow': { const p = at(m.id); S.floats.push({ t, x: p.x, y: p.y, text: m.t === 'share' ? 'Rủ bạn lên đảo!' : 'Theo dõi quán!', cl: CYAN, size: 13 }); break; }
    case 'top': S.top = m.top || []; S.dzoTop = m.dzoTop || S.dzoTop; break;
    case 'order': {
      S.orders = [m, ...S.orders].slice(0, 4); S.toasts.push(m); if (S.toasts.length > 6) S.toasts.splice(0, S.toasts.length - 6);
      const p = at(m.id); S.floats.push({ t, x: p.x, y: p.y, text: `+${fmt(m.points)} xu`, cl: GOLD, size: 17 });
      if (m.server === 'all') { assign('thu', { table: m.table, dish: 'muc' }); assign('mai', { table: m.table, dish: 'nem' }); }
      else assign(m.server, { table: m.table, dish: m.dish === 'dzo' ? 'lac' : m.dish });
      if (m.dish === 'dzo') S.tcheer.set(m.table, t + 2500);
      if (m.dish === 'muc') S.sing = t + 8000;
      if (m.dish === 'ban') { S.bigQ.push({ k: 'ban', title: `Bao cả bàn ${m.table + 1}!`, sub: `Cảm ơn ${short(m.name, 16)} · món ra liên tục`, size: 52, dur: 5500 }); camFocus(m.table, 5500); S.tcheer.set(m.table, t + 5500); }
      if (m.dish === 'quan') S.bigQ.push({ k: 'quan', title: 'Bao cả đảo!', sub: `Cảm ơn ${short(m.name, 16)} · cả đảo cùng Dzô · món ra mọi bàn`, size: 64, dur: 9000 });
      else if (m.dish !== 'ban') spot(m.id, `gọi ${m.dishName} · cảm ơn bạn!`, m.points >= 10 ? 4500 : 3200, true);
      break; }
    case 'speak': speak(m); break;
  }
}

document.getElementById('tap').onclick = () => { AC && AC.resume(); BGM && BGM.play().catch(()=>{}); document.getElementById('tap').style.display='none'; };
let rsT; addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { const s = pickScale(); if (s !== SC) { applyScale(); buildStatic(); } hello(); }, 300); });
