<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="google" content="notranslate">
<title>Chùa Online</title>
<meta name="viewport" content="width=720">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Be+Vietnam+Pro:wght@500;700;800&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
  #tap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);
       color:#ffe08a;font:bold 26px "Playfair Display","DejaVu Serif",serif;cursor:pointer;text-align:center}
</style></head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<div id="tap">Bấm để bật âm thanh 🔔<br><small style="font-size:15px">(trong OBS sẽ tự bật)</small></div>
<script>
'use strict';
// Mẫu 2 · Kim Quang Đại Bi: mạn đà la vàng xoay, tượng Quan Âm trên đài sen vàng,
// Phật tử là huy hiệu vàng (Top 6 xếp vòng cung, 24 chỗ thường 3 hàng).
const W = 720, H = 1280;
const c = document.getElementById('c'); let x = c.getContext('2d');
const PLATFORM = location.pathname.split('/').filter(Boolean)[0] || 'tiktok';
const SERIF = '"Playfair Display","DejaVu Serif","Noto Serif",serif', SANS = '"Be Vietnam Pro","DejaVu Sans","Noto Sans",Arial,sans-serif';
const AV = ['#e57373','#64b5f6','#81c784','#ffb74d','#ba68c8','#4db6ac','#f06292','#a1887f'];
let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const now = () => performance.now();

// ---------------- trạng thái ----------------
const S = { temple: 'CHÙA AN LẠC', subtitle: 'Cầu Bình An – Cầu Tài Lộc – Cầu May Mắn', ticker: '', seats: [], top: [], niem: 0,
  bubbles: new Map(), bows: new Map(), joins: new Map(), floats: [], toasts: [], petals: [], sparks: [], wish: null, bigFx: null, speaking: null, likeBoost: 0 };

// ---------------- vẽ: công cụ ----------------
function rr(a,b,w,h,q){x.beginPath();x.moveTo(a+q,b);x.arcTo(a+w,b,a+w,b+h,q);x.arcTo(a+w,b+h,a,b+h,q);x.arcTo(a,b+h,a,b,q);x.arcTo(a,b,a+w,b,q);x.closePath();}
function lg(x0,y0,x1,y1,st){const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function rg(cx,cy,r0,r1,st){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function glow(cx,cy,rad,inner,outer){x.fillStyle=rg(cx,cy,0,rad,[[0,inner],[1,outer]]);x.beginPath();x.arc(cx,cy,rad,0,7);x.fill();}
const GOLD=(y0,y1)=>lg(0,y0,0,y1,[[0,'#fff6cf'],[.42,'#ffd56e'],[.58,'#d9982a'],[1,'#fff0b4']]);
// o: { spacing, shadow: [màu, độ nhoè] }
function txt(t,X,Y,font,fill,align='center',stroke,o={}){x.save();x.font=font;x.textAlign=align;if(o.spacing&&'letterSpacing' in x)x.letterSpacing=o.spacing+'px';
  if(o.shadow){x.shadowColor=o.shadow[0];x.shadowBlur=o.shadow[1];}
  if(stroke){x.lineJoin='round';x.lineWidth=stroke[1];x.strokeStyle=stroke[0];x.strokeText(t,X,Y);}x.fillStyle=fill;x.fillText(t,X,Y);x.restore();}
function fitFont(t,max,size,family,weight='bold'){let s=size;do{x.font=`${weight} ${s}px ${family}`;}while(x.measureText(t).width>max&&--s>8);return x.font;}
function wrap(t,max,font){x.font=font;const ws=t.split(' ');const out=[];let cur='';for(const w of ws){const tt=cur?cur+' '+w:w;if(x.measureText(tt).width>max&&cur){out.push(cur);cur=w;}else cur=tt;}if(cur)out.push(cur);return out;}
function layer(fn,w=W,h=H){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const old=x;x=cv.getContext('2d');try{fn();}finally{x=old;}return cv;}
function petal(len,wid){x.beginPath();x.moveTo(0,0);x.bezierCurveTo(wid,-len*.35,wid*.6,-len*.85,0,-len);x.bezierCurveTo(-wid*.6,-len*.85,-wid,-len*.35,0,0);}
const short=(s,n)=>{const a=[...s];return a.length>n?a.slice(0,n-1).join('')+'…':s;};

// ---------------- bố cục ----------------
const QX = W/2, MCY = 420;                 // tâm mạn đà la
const ST_H = 540, ST_B = 830, LOTUS_B = 868; // tượng: cao, đáy; đáy đài sen vàng
const HY = ST_B - ST_H + ST_H*.16;          // tâm hào quang = mặt tượng
const QY = HY;                              // điểm phát vòng sóng thỉnh chuông
// Top 6: vòng cung, hạng 1 ở giữa -> thứ tự trái→phải 5 3 1 2 4 6
const TOPX = [70,186,302,418,534,650];
const FRONT = [2,3,1,4,0,5].map(k => ({ x: TOPX[k], y: 985 - (TOPX[k]-QX)**2/1800, s: 1, r: 30 }));
// 24 chỗ thường: 3 hàng × 8, hơi cong theo mạn đà la
const SEATPOS = [];
[1066,1130,1194].forEach(y0 => { for (let k=0;k<8;k++){ const px=59+86*k; SEATPOS.push({ x: px, y: y0-(px-QX)**2/6000, s: .7, r: 19 }); } });

// ---------------- lớp tĩnh ----------------
let BACK, MID, TOPL, M_OUT, M_IN;
// Tượng Quan Âm: ảnh public/img/quan-am.png (nền trong suốt)
const STATUE = { img: new Image(), ok: false };
STATUE.img.onload = () => { STATUE.ok = true; buildStatic(); };
STATUE.img.src = '/img/quan-am.png';

function goldLotus(cx,by,hw){
  // 3 lớp cánh: lớp sau to & nghiêng nhiều, lớp trước nhỏ & đứng -> dáng đài sen khép
  [[hw,84,11,'#6a3e08','#e9b545',.75],[hw*.78,74,9,'#8e5a10','#ffd977',.5],[hw*.5,62,7,'#b07818','#fff1c2',.3]].forEach(([w,len,n,c0,c1,tilt],li)=>{
    for(let i=0;i<n;i++){const t=(i/(n-1))*2-1;x.save();x.translate(cx+t*w*.8,by+li*8-Math.cos(t*1.2)*6);x.rotate(t*tilt);
      x.fillStyle=lg(0,-len,0,0,[[0,c1],[.7,c0],[1,'#3a2004']]);petal(len,len*.62);x.fill();x.strokeStyle='rgba(255,240,190,.8)';x.lineWidth=1.3;x.stroke();
      x.strokeStyle='rgba(255,236,170,.35)';x.lineWidth=1;x.beginPath();x.moveTo(0,-4);x.lineTo(0,-len*.85);x.stroke();x.restore();}});
}
function cauDoi(X,words){
  const y0=200,h=548;
  x.save();x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=16;x.fillStyle=lg(X-27,0,X+27,0,[[0,'#3a0805'],[.5,'#6e130b'],[1,'#3a0805']]);rr(X-27,y0,54,h,8);x.fill();x.restore();
  x.strokeStyle='#d9a441';x.lineWidth=2;rr(X-27,y0,54,h,8);x.stroke();x.strokeStyle='rgba(255,220,140,.4)';x.lineWidth=1;rr(X-21,y0+6,42,h-12,5);x.stroke();
  const step=(h-12)/words.length;words.forEach((w,i)=>txt(w,X,y0+6+step*(i+.5)+8,fitFont(w,40,19,SERIF,'800'),GOLD(y0+step*i,y0+step*(i+1))));
}
function buildStatic(){
  BACK = layer(() => {
    x.fillStyle=rg(QX,MCY+40,0,860,[[0,'#5a2d08'],[.42,'#1e0e03'],[1,'#040201']]);x.fillRect(0,0,W,H);
    x.fillStyle=lg(0,880,0,H,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.55)']]);x.fillRect(0,880,W,H-880);
  });
  // mạn đà la: vòng ngoài (cánh + chấm) và lõi (hạt xoắn ốc + cánh sen) vẽ riêng để xoay ngược chiều
  const G='rgba(255,205,110,';
  M_OUT = layer(() => { x.translate(320,320);
    const ring=(r,w,a)=>{x.strokeStyle=G+a+')';x.lineWidth=w;x.beginPath();x.arc(0,0,r,0,7);x.stroke();};
    ring(300,3,.9);ring(288,1,.6);ring(226,1.6,.65);ring(214,1,.4);
    for(let i=0;i<40;i++){x.save();x.rotate(i*Math.PI*2/40);x.strokeStyle=G+'.8)';x.lineWidth=1.6;x.beginPath();x.moveTo(-14,-228);x.quadraticCurveTo(-14,-270,0,-286);x.quadraticCurveTo(14,-270,14,-228);x.stroke();
      x.fillStyle=G+'.95)';x.beginPath();x.arc(0,-294,2.6,0,7);x.fill();x.restore();}
    for(let i=0;i<96;i++){const a=i*Math.PI*2/96;x.fillStyle=G+'.85)';x.beginPath();x.arc(Math.cos(a)*220,Math.sin(a)*220,1.8,0,7);x.fill();}
  }, 640, 640);
  M_IN = layer(() => { x.translate(320,320);
    for(let i=0;i<900;i++){const a=i*2.39996,r=10*Math.sqrt(i);if(r>205)break;x.fillStyle=G+(.12+.4*(1-r/205))+')';x.beginPath();x.arc(Math.cos(a)*r,Math.sin(a)*r,1.5,0,7);x.fill();}
    x.strokeStyle=G+'.35)';x.lineWidth=1;x.beginPath();x.arc(0,0,145,0,7);x.stroke();
    for(let i=0;i<16;i++){x.save();x.rotate(i*Math.PI/8);x.translate(0,-145);x.fillStyle=G+'.09)';x.strokeStyle=G+'.55)';x.lineWidth=1.3;petal(62,30);x.fill();x.stroke();x.restore();}
  }, 640, 640);
  MID = layer(() => {
    if (STATUE.ok) {
      const k=ST_H/STATUE.img.height,sw=STATUE.img.width*k;
      x.save();x.shadowColor='rgba(255,200,90,1)';x.shadowBlur=50;x.drawImage(STATUE.img,QX-sw/2,ST_B-ST_H,sw,ST_H);x.restore();
      x.drawImage(STATUE.img,QX-sw/2,ST_B-ST_H,sw,ST_H);
    }
    goldLotus(QX,LOTUS_B,180);
  });
  TOPL = layer(() => {
    cauDoi(37,['NAM','MÔ','ĐẠI','BI']);cauDoi(W-37,['QUÁN','THẾ','ÂM','BỒ','TÁT']);
    txt('✦  KIM QUANG ĐẠI BI  ✦',QX,46,`800 15px ${SANS}`,'#ffd98a','center',null,{spacing:7});
    txt(S.temple,QX,106,fitFont(S.temple,620,64,SERIF,'800'),GOLD(58,112),'center',['#2a1200',5],{shadow:['rgba(255,190,80,.85)',22]});
    txt(S.subtitle,QX,142,fitFont(S.subtitle,640,22,SERIF,'italic 500'),'#ffe9c0','center',null,{shadow:['rgba(0,0,0,.7)',8]});
  });
}

// ---------------- vẽ: động ----------------
// huy hiệu Phật tử. pulse 0..1 = đang niệm Phật; k 0..1 = mới vào (phóng to dần)
function medal(p,name,rank,alpha=1,pulse=0,k=1){
  const r=p.r*(.4+.6*k)*(1+.16*pulse),X=p.x,Y=p.y;
  x.save();x.globalAlpha=alpha;
  if(rank)glow(X,Y,r*2,'rgba(255,200,90,.5)','rgba(255,160,40,0)');
  if(pulse)glow(X,Y,r*2.2,`rgba(255,235,160,${.7*pulse})`,'rgba(255,200,90,0)');
  x.fillStyle=rg(X,Y-r*.3,0,r,[[0,rank?'#6a3a08':'#2c1b0c'],[1,rank?'#2a1402':'#120a04']]);x.beginPath();x.arc(X,Y,r,0,7);x.fill();
  x.lineWidth=rank?4:2.4;x.strokeStyle=rank?lg(X,Y-r,X,Y+r,[[0,'#fff2bd'],[.5,'#dca233'],[1,'#fff2bd']]):(pulse?'#ffe08a':'#a8823f');x.stroke();
  txt(([...name][0]||'•').toUpperCase(),X,Y+r*.36,`800 ${Math.round(r*.95)}px ${SERIF}`,rank?GOLD(Y-r,Y+r):'#e6cb93');
  if(rank){const bx=X+r*.74,by=Y-r*.74;x.fillStyle='#c0261b';x.beginPath();x.arc(bx,by,12,0,7);x.fill();x.strokeStyle='#ffd36b';x.lineWidth=1.6;x.stroke();txt(String(rank),bx,by+5,`800 13px ${SANS}`,'#fff');}
  txt(short(name,rank?12:9),X,Y+p.r+(rank?19:15),`800 ${rank?14:12}px ${SANS}`,rank===1?'#ffe08a':rank?'#ffe3a0':'#e6d9c2','center',null,{shadow:['#000',5]});
  x.restore();
}
function emptyMedal(p,rank){
  x.save();x.globalAlpha=.42;x.setLineDash([4,4]);x.strokeStyle='#d9a441';x.lineWidth=2;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.stroke();x.setLineDash([]);
  txt(String(rank),p.x,p.y+7,`800 20px ${SERIF}`,'#d9a441');txt('Chờ công đức',p.x,p.y+p.r+19,`700 12px ${SANS}`,'#e6d9c2');x.restore();
}
function bubble(X,Y,text,a){
  const font='bold 14px '+SANS;const lines=wrap(text,170,font).slice(0,3);
  const w=Math.max(...lines.map(l=>x.measureText(l).width))+20,h=lines.length*18+12;
  const bx=Math.min(Math.max(X-w/2,8),W-w-8),by=Y-h-10;
  x.save();x.globalAlpha=a;
  x.fillStyle='rgba(255,244,214,.97)';rr(bx,by,w,h,10);x.fill();x.strokeStyle='#d9a441';x.lineWidth=2;x.stroke();
  x.beginPath();x.moveTo(X-7,by+h);x.lineTo(X,by+h+9);x.lineTo(X+7,by+h);x.closePath();x.fillStyle='rgba(255,244,214,.97)';x.fill();
  lines.forEach((l,i)=>txt(l,bx+10,by+20+i*18,font,'#5a3206','left'));
  x.restore();
}
const ease = t => 1 - Math.pow(1 - Math.min(Math.max(t,0),1), 3);

function seatPosOf(id){
  const ti = S.top.findIndex(t => t.id === id); if (ti >= 0) return FRONT[ti];
  const si = S.seats.findIndex(s => s && s.id === id); return si >= 0 ? SEATPOS[si] : null;
}

function frame(){
  const t = now();
  x.drawImage(BACK,0,0);
  // tia sáng xoay chậm
  x.save();x.translate(QX,MCY);x.rotate(t/90000);
  for(let i=0;i<28;i++){x.rotate(Math.PI*2/28);x.fillStyle=`rgba(255,200,100,${i%2?.035:.075})`;x.beginPath();x.moveTo(0,0);x.lineTo(-46,-1100);x.lineTo(46,-1100);x.closePath();x.fill();}x.restore();
  // mạn đà la: vòng ngoài xoay thuận, lõi xoay ngược
  x.save();x.translate(QX,MCY);x.rotate(t/70000);x.drawImage(M_OUT,-320,-320);x.restore();
  x.save();x.translate(QX,MCY);x.rotate(-t/45000);x.drawImage(M_IN,-320,-320);x.restore();
  const pulse = 1 + Math.sin(t/1400)*.04;
  glow(QX,MCY,250*pulse,'rgba(255,220,140,.32)','rgba(255,170,60,0)');
  // hào quang sau đầu tượng (thở nhẹ)
  glow(QX,HY,96*pulse,'rgba(255,248,215,.95)','rgba(255,190,80,0)');
  x.strokeStyle='rgba(255,236,170,.9)';x.lineWidth=2.5;x.beginPath();x.arc(QX,HY,72*pulse,0,7);x.stroke();
  x.drawImage(MID,0,0);
  // hạt vàng bay lên quanh tượng
  while(S.sparks.length<34)S.sparks.push({x:QX+(Math.random()-.5)*340,y:880-Math.random()*560,v:.25+Math.random()*.5,ph:Math.random()*6,r:1+Math.random()*2.2});
  S.sparks.forEach(p=>{p.y-=p.v;p.x+=Math.sin(t/900+p.ph)*.25;const a=.35+.65*Math.abs(Math.sin(t/500+p.ph));glow(p.x,p.y,p.r*4,`rgba(255,236,170,${a})`,'rgba(255,200,90,0)');});
  S.sparks=S.sparks.filter(p=>p.y>230);
  x.drawImage(TOPL,0,0);
  // dải chữ chạy dưới đài sen
  x.fillStyle='rgba(30,14,3,.86)';rr(QX-180,892,360,28,14);x.fill();x.strokeStyle='#d9a441';x.lineWidth=1.5;x.stroke();
  x.save();rr(QX-170,892,340,28,14);x.clip();
  const tk='“'+S.ticker+'”     ';x.font='italic 15px '+SERIF;const tw=x.measureText(tk).width;const off=(t/28)%tw;
  for(let k=0;k<3;k++)txt(tk,QX+170-off+k*tw-tw,911,'italic 15px '+SERIF,'#ffeccc','left');x.restore();
  // nhãn hành động 2 bên đài sen
  tag(PLATFORM==='tiktok'?'🔔 Quà ≥ '+(window.BIG||99)+' xu: Thỉnh chuông':'🔔 Thỉnh chuông',8,762,-1);
  tag('Niệm Phật: Gõ mõ 🪵',W-8,762,1);
  // bộ đếm niệm Phật
  const nt='🙏 '+S.niem.toLocaleString('vi-VN')+' lượt niệm Phật';x.font=`800 17px ${SANS}`;const nw=x.measureText(nt).width+44;
  x.fillStyle='rgba(30,14,3,.9)';rr(QX-nw/2,1241,nw,34,17);x.fill();x.strokeStyle='#e0a83a';x.lineWidth=1.6;x.stroke();txt(nt,QX,1264,`800 17px ${SANS}`,'#ffe3a0');

  // Phật tử: Top 6 công đức
  FRONT.forEach((p,i)=>{const u=S.top[i]; if(u) medal(p,u.name,i+1,1,bowOf(u.id,t)); else emptyMedal(p,i+1);});
  // 24 chỗ thường
  S.seats.forEach((u,i)=>{ if(!u) return; const p=SEATPOS[i]; const j=S.joins.get(u.id); const a=j?ease((t-j)/600):1;
    if(j&&t-j<1500){x.save();x.globalAlpha=1-(t-j)/1500;glow(p.x,p.y,48,'rgba(255,220,120,.8)','rgba(255,220,120,0)');x.restore();}
    medal(p,u.name,0,a,bowOf(u.id,t),a); });
  // bong bóng lời nguyện
  for(const [id,b] of S.bubbles){ const age=t-b.t; if(age>5500){S.bubbles.delete(id);continue;} const p=seatPosOf(id); if(!p) continue;
    bubble(p.x,p.y-p.r-2,b.text,Math.min(1,age/200,(5500-age)/400)); }
  // sớ cầu an: thẻ bên trái tượng
  if(S.wish){const age=t-S.wish.t; if(age>7000) S.wish=null; else {const a=Math.min(1,age/300,(7000-age)/400);
    const X0=66,Y0=548,w=206;x.save();x.globalAlpha=a;const font='italic 500 15px '+SERIF;const lines=wrap('“'+S.wish.text+'”',w-28,font).slice(0,4);const h=60+lines.length*20;
    x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=18;x.fillStyle='rgba(30,14,3,.9)';rr(X0,Y0,w,h,14);x.fill();x.shadowBlur=0;x.strokeStyle='#e0a83a';x.lineWidth=1.6;x.stroke();
    txt('📜 SỚ CẦU AN',X0+14,Y0+24,`800 12px ${SANS}`,'#ffcf6b','left',null,{spacing:2});
    txt('🙏 '+S.wish.name,X0+14,Y0+48,fitFont('🙏 '+S.wish.name,w-28,17,SANS,'800'),'#fff4dc','left');
    lines.forEach((l,i)=>txt(l,X0+14,Y0+72+i*20,font,'#ffe2b0','left'));x.restore();}}
  // chữ bay "+Công đức"
  S.floats=S.floats.filter(f=>t-f.t<2200);
  S.floats.forEach(f=>{const k=(t-f.t)/2200;x.save();x.globalAlpha=1-k*k;txt(f.text,f.x,f.y-70*ease(k),'800 '+f.size+'px '+SERIF,'#ffe27a','center',['rgba(90,30,0,.85)',5]);x.restore();});
  // thông báo quà: phía trên đầu tượng, mới nhất ở trên
  S.toasts=S.toasts.filter(o=>t-o.t<4200);
  (S.bigFx?[]:S.toasts.slice(-2)).forEach((o,i,arr)=>{const age=t-o.t;const a=Math.min(1,age/250,(4200-age)/350);const y=158+(arr.length-1-i)*66-(1-ease(age/300))*16;
    x.save();x.globalAlpha=a;x.shadowColor='rgba(255,190,70,.9)';x.shadowBlur=24;x.fillStyle='rgba(60,24,2,.93)';rr(90,y,540,58,29);x.fill();x.shadowBlur=0;x.strokeStyle='#ffd36b';x.lineWidth=2;x.stroke();
    txt(o.icon,128,y+40,'30px '+SANS,'#fff');
    txt(o.l1,166,y+25,fitFont(o.l1,446,16,SANS,'800'),'#ffe7a3','left');txt(o.l2,166,y+46,fitFont(o.l2,446,14,SERIF,'italic 500'),'#fff1d6','left');x.restore();});
  // hoa rơi theo like
  const want=14+Math.min(40,S.likeBoost);S.likeBoost*=.995;
  while(S.petals.length<want)S.petals.push({x:Math.random()*W,y:-20-Math.random()*400,v:.6+Math.random()*1.1,r:Math.random()*6,w:(Math.random()-.5)*.04,c:Math.random()<.6?'rgba(255,214,80,.85)':'rgba(255,190,205,.85)'});
  S.petals.forEach(p=>{p.y+=p.v*1.6;p.x+=Math.sin(p.y/60+p.r)*.6;p.r+=p.w;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.beginPath();x.ellipse(0,0,7,3.5,0,0,7);x.fill();x.restore();});
  S.petals=S.petals.filter(p=>p.y<H+20).slice(0,80);
  // quà lớn: thỉnh chuông
  if(S.bigFx){const age=t-S.bigFx.t; if(age>5200) S.bigFx=null; else {
    const a=Math.min(1,age/300,(5200-age)/600);x.save();x.globalAlpha=a*.3*Math.max(.35,1-age/1500);x.fillStyle='rgba(255,200,90,1)';x.fillRect(0,0,W,H);x.restore();
    x.save();x.globalAlpha=a;for(let k=0;k<3;k++){const rr2=((age/9)+k*120)%360;x.strokeStyle=`rgba(255,240,180,${1-rr2/360})`;x.lineWidth=4;x.beginPath();x.arc(QX,QY,60+rr2,0,7);x.stroke();}
    const sw=Math.sin(age/160)*.25*Math.max(0,1-age/3000);drawBell(QX,232,1.0,sw);
    x.fillStyle=lg(0,510,0,670,[[0,'rgba(20,8,0,0)'],[.25,'rgba(20,8,0,.78)'],[.75,'rgba(20,8,0,.78)'],[1,'rgba(20,8,0,0)']]);x.fillRect(0,510,W,160);
    txt('THỈNH CHUÔNG',QX,572,'800 48px '+SERIF,GOLD(530,575),'center',['#4a1500',6],{shadow:['rgba(255,190,80,.9)',20]});
    txt(S.bigFx.l1,QX,612,fitFont(S.bigFx.l1,640,22,SANS,'800'),'#fff','center',['rgba(60,20,0,.9)',5]);
    txt(S.bigFx.l2,QX,644,fitFont(S.bigFx.l2,640,18,SERIF,'italic 500'),'#ffe7a8','center',['rgba(60,20,0,.9)',4]);x.restore();}}
  requestAnimationFrame(frame);
}
function tag(t,X,Y,side){x.font='800 13px '+SANS;const w=x.measureText(t).width+22;const X0=side<0?X:X-w;
  x.fillStyle='rgba(30,14,3,.85)';rr(X0,Y,w,30,15);x.fill();x.strokeStyle='#d9a441';x.lineWidth=1.5;x.stroke();txt(t,X0+11,Y+20,'800 13px '+SANS,'#ffe3a0','left');}
function drawBell(X,Y,s,rot){x.save();x.translate(X,Y);x.rotate(rot);x.scale(s,s);
  x.fillStyle=lg(-44,0,44,0,[[0,'#6a4a12'],[.5,'#f3c95a'],[1,'#5a3a0a']]);x.beginPath();x.moveTo(-18,-60);x.quadraticCurveTo(-46,-48,-46,60);x.lineTo(46,60);x.quadraticCurveTo(46,-48,18,-60);x.closePath();x.fill();
  x.strokeStyle='#fff0b0';x.lineWidth=2;[-20,20,48].forEach(yy=>{x.beginPath();x.moveTo(-44,yy);x.lineTo(44,yy);x.stroke();});x.fillStyle='#e2ab3c';x.fillRect(-8,-74,16,16);x.restore();}
function bowOf(id,t){const b=S.bows.get(id);if(!b)return 0;const k=(t-b)/1400;if(k>1){S.bows.delete(id);return 0;}return Math.sin(k*Math.PI);}

// ---------------- âm thanh ----------------
let AC, master, bgGain, voiceGain;
function audioInit(){
  if (AC) return; AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = .8; master.connect(AC.destination);
  bgGain = AC.createGain(); bgGain.gain.value = .55; bgGain.connect(master);
  voiceGain = AC.createGain(); voiceGain.gain.value = 1.6; voiceGain.connect(master);
  // nền: chuông xoay ngân + pad nhẹ
  [[196,.05],[196.8,.04],[392.5,.018],[587,.008]].forEach(([f,v])=>{const o=AC.createOscillator();o.frequency.value=f;const g=AC.createGain();g.gain.value=v;
    const l=AC.createOscillator();l.frequency.value=.07+Math.random()*.05;const lg2=AC.createGain();lg2.gain.value=v*.6;l.connect(lg2);lg2.connect(g.gain);l.start();o.connect(g);g.connect(bgGain);o.start();});
  // mõ đều
  let next = AC.currentTime + .5; setInterval(()=>{ while(next < AC.currentTime + .6){ moAt(next,.35); next += 1.15; } }, 200);
  // chuông nhỏ mỗi ~16 giây
  setInterval(()=>bell(.07, 523), 16000);
  if (AC.state === 'suspended') document.getElementById('tap').style.display = 'flex';
}
function moAt(when, vol){
  const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(820,when);o.frequency.exponentialRampToValueAtTime(520,when+.06);
  const g=AC.createGain();g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vol,when+.004);g.gain.exponentialRampToValueAtTime(.001,when+.16);
  const n=AC.createBufferSource();const b=AC.createBuffer(1,AC.sampleRate*.05,AC.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  n.buffer=b;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1200;bp.Q.value=3;const ng=AC.createGain();ng.gain.value=vol*.6;
  o.connect(g);g.connect(bgGain);n.connect(bp);bp.connect(ng);ng.connect(bgGain);o.start(when);o.stop(when+.2);n.start(when);
}
function mo(){ if(AC) moAt(AC.currentTime+.01,.6); }
function bell(vol=.5, f=196){
  if(!AC) return; const t0=AC.currentTime;
  [[1,1],[2.76,.5],[5.4,.25],[8.93,.12],[.5,.35]].forEach(([m,v])=>{const o=AC.createOscillator();o.frequency.value=f*m;const g=AC.createGain();
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol*v,t0+.01);g.gain.exponentialRampToValueAtTime(.0005,t0+(m<1?9:7/m+1.5));o.connect(g);g.connect(master);o.start(t0);o.stop(t0+10);});
}
function duck(on){ if(!AC) return; bgGain.gain.cancelScheduledValues(AC.currentTime); bgGain.gain.linearRampToValueAtTime(on?.18:.55, AC.currentTime+.3); }

// giọng đọc
async function speak(m){
  const ack = () => ws && ws.readyState===1 && ws.send(JSON.stringify({t:'spoken',id:m.id}));
  S.speaking = m;
  if (!m.url || !AC) { setTimeout(()=>{S.speaking=null;ack();}, 1200 + m.text.length*55); return; }
  try {
    const buf = await (await fetch(m.url)).arrayBuffer();
    const ab = await AC.decodeAudioData(buf);
    const src = AC.createBufferSource(); src.buffer = ab; src.connect(voiceGain);
    duck(true); src.onended = () => { duck(false); S.speaking=null; ack(); }; src.start();
  } catch (e) { console.warn('voice', e); S.speaking=null; ack(); }
}

// ---------------- kết nối server ----------------
let ws;
function connect(){
  ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?p='+PLATFORM);
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connect, 2000);
}
function handle(m){
  const t = now();
  switch(m.t){
    case 'snapshot': Object.assign(S,{temple:m.temple||S.temple,subtitle:m.subtitle||S.subtitle,ticker:m.ticker||'',seats:m.seats,top:m.top,niem:m.niem}); buildStatic(); break;
    case 'seats': { const old=new Set(S.seats.filter(Boolean).map(s=>s.id)); S.seats=m.seats; m.seats.forEach(s=>{if(s&&!old.has(s.id))S.joins.set(s.id,t);}); break; }
    case 'top': S.top=m.top; break;
    case 'niem': S.niem=m.n; break;
    case 'join': S.joins.set(m.id,t); break;
    case 'chat':
      if (m.niem) { S.bows.set(m.id,t); mo(); const p=seatPosOf(m.id); if(p&&Math.random()<.5) S.floats.push({t,x:p.x,y:p.y-30,text:'+1 🙏',size:16}); }
      if (m.text) { S.bubbles.set(m.id,{text:m.text,t}); if(!m.niem) S.wish={name:m.name,text:m.text,t}; }
      break;
    case 'like': S.likeBoost += Math.min(m.count,10); break;
    case 'gift': {
      const p = seatPosOf(m.id) || {x:QX,y:900,s:1};
      S.floats.push({t,x:p.x,y:p.y-30,text:'+'+m.points+' Công Đức',size:22});
      S.bows.set(m.id,t);
      S.toasts.push({t,icon:/hoa|rose/i.test(m.gift)?'🌹':'🎁',l1:`Thành tâm dâng ${m.count>1?m.count+' ':''}${m.gift} kính lễ Đức Phật`,l2:`— ${m.name}  ·  Nam mô A Di Đà Phật`});
      if (m.big && (!S.bigFx || t - S.bigFx.t > 9000)) { S.bigFx={t,l1:`Cảm ơn ${m.name} đã cúng dường ${m.gift}`,l2:'Nguyện cho quý Phật tử bình an, vạn sự như ý'}; bell(.42,147); setTimeout(()=>bell(.3,147),2600); }
      else if (!m.big) bell(.08, 392);
      break; }
    case 'speak': speak(m); break;
  }
}

document.getElementById('tap').onclick = () => { AC && AC.resume(); document.getElementById('tap').style.display='none'; };
buildStatic(); audioInit(); connect(); requestAnimationFrame(frame);
