const c = document.getElementById('c'); let x = c.getContext('2d');
// Độ nét: vẽ theo độ phân giải thật của khung hiển thị (OBS / LIVE Studio thường 1080×1920 = 1,5×),
// mọi toạ độ vẫn tính trên khung 720×1280. ?scale=2 để ép; trần 2 cho nhẹ máy.
let SC = 1;
function pickScale(){
  const q = +new URLSearchParams(location.search).get('scale');
  const v = q || Math.min(innerWidth / 720, innerHeight / 1280) * (window.devicePixelRatio || 1);
  return Math.min(2, Math.max(1, Math.ceil(v * 4) / 4));
}
function applyScale(){ SC = pickScale(); c.width = 720 * SC; c.height = 1280 * SC; }
applyScale();
function blit(cv, X, Y){ x.drawImage(cv, X, Y, cv.width / SC, cv.height / SC); }

const hashOf = s => { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return h >>> 0; };

// ---------------- trạng thái ----------------

function rr(a,b,w,h,q){x.beginPath();x.moveTo(a+q,b);x.arcTo(a+w,b,a+w,b+h,q);x.arcTo(a+w,b+h,a,b+h,q);x.arcTo(a,b+h,a,b,q);x.arcTo(a,b,a+w,b,q);x.closePath();}
function lg(x0,y0,x1,y1,st){const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function rg(cx,cy,r0,r1,st){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function glow(cx,cy,rad,inner,outer){x.fillStyle=rg(cx,cy,0,rad,[[0,inner],[1,outer]]);x.beginPath();x.arc(cx,cy,rad,0,7);x.fill();}
const GOLD=(y0,y1)=>lg(0,y0,0,y1,[[0,'#fff6cf'],[.42,'#ffd56e'],[.58,'#d9982a'],[1,'#fff0b4']]);
function txt(t,X,Y,font,fill,align='center',stroke,o={}){x.save();x.font=font;x.textAlign=align;if(o.spacing&&'letterSpacing' in x)x.letterSpacing=o.spacing+'px';
  if(o.shadow){x.shadowColor=o.shadow[0];x.shadowBlur=o.shadow[1];}
  if(stroke){x.lineJoin='round';x.lineWidth=stroke[1];x.strokeStyle=stroke[0];x.strokeText(t,X,Y);}x.fillStyle=fill;x.fillText(t,X,Y);x.restore();}
function fitFont(t,max,size,family,weight='bold'){let s=size;do{x.font=`${weight} ${s}px ${family}`;}while(x.measureText(t).width>max&&--s>8);return x.font;}
function wrap(t,max,font){x.font=font;const ws=t.split(' ');const out=[];let cur='';for(const w of ws){const tt=cur?cur+' '+w:w;if(x.measureText(tt).width>max&&cur){out.push(cur);cur=w;}else cur=tt;}if(cur)out.push(cur);return out;}
function layer(fn,w=W,h=H){const cv=document.createElement('canvas');cv.width=Math.ceil(w*SC);cv.height=Math.ceil(h*SC);const old=x;x=cv.getContext('2d');x.scale(SC,SC);try{fn();}finally{x=old;}return cv;}
const short=(s,n)=>{const a=[...s];return a.length>n?a.slice(0,n-1).join('')+'…':s;};
const ease = t => 1 - Math.pow(1 - Math.min(Math.max(t,0),1), 3);
// icon vẽ tay thay emoji: trình duyệt nguồn Link của LIVE Studio không có font emoji (hiện ô vuông)
function heartPath(r){x.beginPath();x.moveTo(0,r*.9);x.bezierCurveTo(-r*1.3,0,-r*.9,-r*1.1,0,-r*.45);x.bezierCurveTo(r*.9,-r*1.1,r*1.3,0,0,r*.9);x.closePath();}
function icon(k,X,Y,sz=20){
  x.save();x.translate(X,Y);const s=sz/20;x.scale(s,s);x.lineCap='round';x.lineJoin='round';
  if(k==='den'){ glow(0,-6,12,'rgba(255,200,90,.8)','rgba(255,160,40,0)');
    x.fillStyle='#fff1b0';x.beginPath();x.moveTo(0,-13);x.quadraticCurveTo(5,-5,0,-1);x.quadraticCurveTo(-5,-5,0,-13);x.fill();
    x.fillStyle=lg(-10,0,10,0,[[0,'#8a5a14'],[.5,'#f6cf6a'],[1,'#8a5a14']]);x.beginPath();x.moveTo(-10,0);x.quadraticCurveTo(0,9,10,0);x.closePath();x.fill();x.fillRect(-3,4,6,4);x.fillRect(-6,8,12,2); }
  else if(k==='cauan'){ glow(0,0,13,'rgba(255,90,40,.5)','rgba(255,60,20,0)');
    x.fillStyle=lg(-8,0,8,0,[[0,'#8a0e06'],[.5,'#ec3a1e'],[1,'#8a0e06']]);x.beginPath();x.ellipse(0,0,8,9.5,0,0,7);x.fill();
    x.fillStyle='#e8b04a';x.fillRect(-5,-11,10,2.5);x.fillRect(-5,8.5,10,2.5);x.strokeStyle='#e8b04a';x.lineWidth=1.2;x.beginPath();x.moveTo(0,11);x.lineTo(0,15);x.moveTo(0,-11);x.lineTo(0,-14);x.stroke(); }
  else if(k==='xinxam'){ x.lineWidth=1.8;[[-5,-.25],[-1.5,-.08],[2,.1],[5,.28]].forEach(([dx,a])=>{x.save();x.translate(dx*.6,-1);x.rotate(a);x.strokeStyle='#e9c47a';x.beginPath();x.moveTo(0,0);x.lineTo(0,-13);x.stroke();x.strokeStyle='#d0281a';x.beginPath();x.moveTo(0,-11);x.lineTo(0,-14);x.stroke();x.restore();});
    x.fillStyle=lg(-8,0,8,0,[[0,'#5a2a08'],[.5,'#b0701e'],[1,'#5a2a08']]);x.beginPath();x.moveTo(-8,-3);x.lineTo(8,-3);x.lineTo(6.5,12);x.lineTo(-6.5,12);x.closePath();x.fill();x.fillStyle='#e8b04a';x.fillRect(-8,-3,16,2); }
  else if(k==='chuong'){ x.fillStyle=lg(-9,0,9,0,[[0,'#7a5212'],[.45,'#ffe7a0'],[1,'#6a4410']]);x.beginPath();x.moveTo(-5,-9);x.quadraticCurveTo(-9,-8,-9,4);x.quadraticCurveTo(-9,8,-11,10);x.lineTo(11,10);x.quadraticCurveTo(9,8,9,4);x.quadraticCurveTo(9,-8,5,-9);x.quadraticCurveTo(0,-11,-5,-9);x.fill();
    x.strokeStyle='#7a5212';x.lineWidth=2;x.beginPath();x.arc(0,-11,3,Math.PI,0);x.stroke(); }
  else if(k==='tim'){ x.fillStyle=lg(0,-10,0,10,[[0,'#ff6b81'],[1,'#d81b3c']]);heartPath(10);x.fill();x.fillStyle='rgba(255,255,255,.45)';x.beginPath();x.ellipse(-4.5,-4,2.5,1.6,-.6,0,7);x.fill(); }
  else if(k==='nguoi'){ x.fillStyle='#f0c060';x.beginPath();x.arc(0,-7,4.5,0,7);x.fill();x.beginPath();x.moveTo(-9,10);x.quadraticCurveTo(-9,-1,0,-1);x.quadraticCurveTo(9,-1,9,10);x.closePath();x.fill(); }
  else if(k==='the'){ glow(0,0,14,'rgba(255,215,120,.45)','rgba(255,190,80,0)');
    x.save();x.rotate(-.12);x.fillStyle=lg(-8,-11,8,11,[[0,'#fff3c8'],[1,'#e2b45a']]);rr(-8,-11,16,22,3);x.fill();x.strokeStyle='#9b1c10';x.lineWidth=1.6;rr(-6,-9,12,18,2);x.stroke();
    x.fillStyle='#b8281a';x.beginPath();x.moveTo(0,-5);x.lineTo(3.5,0);x.lineTo(0,5);x.lineTo(-3.5,0);x.closePath();x.fill();x.restore(); }
  else if(k==='mo'){ x.fillStyle=lg(0,-9,0,10,[[0,'#d08a3a'],[1,'#6a3410']]);x.beginPath();x.ellipse(0,1,11,9,0,0,7);x.fill();
    x.strokeStyle='#3a1a06';x.lineWidth=1.8;x.beginPath();x.moveTo(-7,3);x.quadraticCurveTo(0,7,7,3);x.stroke();
    x.strokeStyle='#e8b04a';x.lineWidth=2.2;x.beginPath();x.moveTo(6,-12);x.lineTo(14,-4);x.stroke(); }
  else if(k==='phatquang'){ glow(0,0,15,'rgba(255,230,140,.7)','rgba(255,200,90,0)');
    x.strokeStyle='#ffe08a';x.lineWidth=1.8;for(let i=0;i<12;i++){const a=i*Math.PI/6;x.beginPath();x.moveTo(Math.cos(a)*6,Math.sin(a)*6);x.lineTo(Math.cos(a)*(i%2?10:13),Math.sin(a)*(i%2?10:13));x.stroke();}
    x.fillStyle=rg(0,0,0,6,[[0,'#fffbe0'],[1,'#f2b63a']]);x.beginPath();x.arc(0,0,6,0,7);x.fill(); }
  else if(k==='qua'){ x.fillStyle='#d8261a';x.fillRect(-9,-4,18,14);x.fillStyle='#b81a10';x.fillRect(-10,-7,20,5);x.fillStyle='#f6cf6a';x.fillRect(-1.5,-7,3,17);
    x.strokeStyle='#f6cf6a';x.lineWidth=2;x.beginPath();x.ellipse(-4,-9,4,2.5,.4,0,7);x.ellipse(4,-9,4,2.5,-.4,0,7);x.stroke(); }
  else { // sen (niệm Phật)
    [[-.9,'#f5a3b5'],[.9,'#f5a3b5'],[-.45,'#f7b8c6'],[.45,'#f7b8c6'],[0,'#fcd3dc']].forEach(([a,cl])=>{x.save();x.translate(0,8);x.rotate(a);x.fillStyle=cl;x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(6,-8,0,-17);x.quadraticCurveTo(-6,-8,0,0);x.fill();x.restore();});
    x.fillStyle='#7cbf6a';x.beginPath();x.ellipse(0,9,10,2.5,0,0,7);x.fill(); }
  x.restore();
}
function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(v*k)));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`;}

// ---------------- bố cục (theo ảnh nền) ----------------
const CX = 360;                                  // trục thảm đỏ (bậc thang + sân)
const HALO = { x: 360, y: 440 };                 // hào quang sau đầu tượng Phật trong ảnh
const LAND = 926;                                // chiếu nghỉ trên cùng bậc thang, ngay dưới lư hương
const sc = y => .36 + (y - 1060) * .0008;        // tỉ lệ người: xa tượng nhỏ dần
const ENTRY = { x: CX, y: 1330 };                // lối vào sân (dưới khung hình)
// Top 5 quỳ trên chiếu nghỉ 2 bên lư hương (tên hiện ở dãy nhãn top 10)
const TOPPOS = [[-96,0],[96,0],[-150,3],[150,3],[-204,6]].map(([dx,dy]) => ({ x: CX+dx, y: LAND+dy, s: sc(LAND)*1.1, top: true }));
// chỗ quỳ thường: 5 hàng trên sân 2 bên lối đi giữa, lấp từ hàng gần bậc thang, sát lối trước; hàng lẻ lệch nửa chỗ
const SEATPOS = [];
[1068,1100,1134,1170,1208].forEach((y,row) => { const s = sc(y), sp = 86*s, L = [], R = [];
  for (let k = 0; ; k++) { const d = 30 + 14*s + (row%2 ? sp/2 : 0) + sp*k; if (CX - d < 12) break; L.push({x:CX-d,y,s}); R.push({x:CX+d,y,s}); }
  L.forEach((p,k) => SEATPOS.push(p, R[k])); });
// 18 ngọn đèn lưu ly trên bậc thềm 2 bên lư hương
const LAMPS = []; for (let k = 0; k < 9; k++) { LAMPS.push({ x: 292 - k*13, y: 910 + (k%2)*5 }, { x: 428 + k*13, y: 910 + (k%2)*5 }); }
// bảng vàng tuần: 10 nhãn tên trên bậc thang (hàng 1: hạng 1–4, hàng 2: hạng 5–10)

function avatarImg(url){ if (!url) return null; let a = AVC.get(url);
  if (!a) { a = { img: new Image(), ok: false }; a.img.onload = () => a.ok = true; a.img.src = url; AVC.set(url, a); if (AVC.size > 300) AVC.delete(AVC.keys().next().value); }

// ---------------- lớp tĩnh ----------------
let BACK, TOPL, LAKE, QAM;
const QAH = 412;   // tâm hào quang sau đầu tượng Quán Thế Âm (cảnh Lễ Quán Thế Âm)
// tối nhẹ phía trên cho chữ, tối 2 mép cho bảng, sáng giữ nguyên ở giữa (dùng chung cho mọi cảnh)
function edges(){
  x.fillStyle=lg(0,0,0,300,[[0,'rgba(10,3,0,.42)'],[1,'rgba(10,3,0,0)']]);x.fillRect(0,0,W,300);
  x.fillStyle=lg(0,0,W,0,[[0,'rgba(10,3,0,.16)'],[.25,'rgba(10,3,0,0)'],[.75,'rgba(10,3,0,0)'],[1,'rgba(10,3,0,.16)']]);x.fillRect(0,0,W,H);
  x.fillStyle=lg(0,1150,0,H,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.35)']]);x.fillRect(0,1150,W,H-1150);
}
function panel(X,Y,w,h,title){
  x.save();x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=18;x.fillStyle=lg(0,Y,0,Y+h,[[0,'rgba(66,12,6,.88)'],[1,'rgba(28,6,3,.9)']]);rr(X,Y,w,h,12);x.fill();x.restore();
  x.strokeStyle=lg(X,Y,X+w,Y+h,[[0,'#fff0b0'],[.5,'#c88a2a'],[1,'#fff0b0']]);x.lineWidth=2;rr(X,Y,w,h,12);x.stroke();
  x.strokeStyle='rgba(255,215,130,.35)';x.lineWidth=1;rr(X+4,Y+4,w-8,h-8,9);x.stroke();
  x.fillStyle=lg(X,0,X+w,0,[[0,'rgba(150,20,10,0)'],[.15,'#9b1c10'],[.85,'#9b1c10'],[1,'rgba(150,20,10,0)']]);x.fillRect(X+6,Y+7,w-12,27);
  x.strokeStyle='rgba(255,210,120,.7)';x.lineWidth=1;x.beginPath();x.moveTo(X+18,Y+34.5);x.lineTo(X+w-18,Y+34.5);x.stroke();
  txt(title,X+w/2,Y+26,fitFont(title,w-30,14,SANS,'800'),GOLD(Y+12,Y+30),'center',null,{spacing:1});
}
function buildStatic(){

    glow(CX,372,190,'rgba(255,236,190,.32)','rgba(255,220,160,0)');
    x.fillStyle=rg(CX-12,360,0,46,[[0,'#fffdf0'],[.75,'#f6e9bf'],[1,'#e2cf98']]);x.beginPath();x.arc(CX,372,42,0,7);x.fill();
    x.fillStyle='rgba(200,180,130,.18)';[[-12,-8,9],[10,6,6],[-4,14,5]].forEach(([dx,dy,r])=>{x.beginPath();x.arc(CX+dx,372+dy,r,0,7);x.fill();});
    x.fillStyle='#121836';x.beginPath();x.moveTo(0,560);x.quadraticCurveTo(120,470,250,540);x.quadraticCurveTo(340,505,420,545);x.quadraticCurveTo(560,462,W,540);x.lineTo(W,592);x.lineTo(0,592);x.closePath();x.fill();
    // chùa xa: mái cong 3 tầng, cửa sáng đèn
    x.fillStyle='#0a0e24';
    const roof=(y,w,h)=>{x.beginPath();x.moveTo(CX-w/2-14,y+h);x.quadraticCurveTo(CX-w/2,y+h-3,CX-w/2+10,y+h-7);x.lineTo(CX,y);x.lineTo(CX+w/2-10,y+h-7);x.quadraticCurveTo(CX+w/2,y+h-3,CX+w/2+14,y+h);x.closePath();x.fill();};
    x.fillRect(CX-62,540,124,52);roof(510,176,32);x.fillRect(CX-42,520,84,24);roof(486,126,27);x.fillRect(CX-26,494,52,20);roof(466,82,23);

const ROBES = ['#6b7b8f','#7a5a3e','#8b7b66','#55707a','#9a8a74','#6d5d7a','#5f6b5a','#84705c'];

const SKIN='#d9a882', HAIR='#1a120d';
// đầu nhìn từ sau: tóc che gần hết, lộ 2 vành tai + gáy
function headBack(hy,L){

// áo tràng phần trên: vai tròn, 2 tay áo buông dọc thân (chắp tay phía trước). sy = đỉnh vai
function backRobe(sy,wy,L){
  const robe=L.robe, lt=shade(robe,1.28), dk=shade(robe,.7);

function walker(X,Y,s,L,ph){

// ---------------- di chuyển: vào chỗ / lên lễ ----------------
const SPEED = .13;                       // px / ms
const PRAY = 3 * 1300;                   // lạy 3 lạy
function homeOf(id){ const ti=S.top.findIndex(u=>u.id===id); if(ti>=0) return TOPPOS[ti];
  const si=S.seats.findIndex(u=>u&&u.id===id); return si>=0?SEATPOS[si]:null; }
function userOf(id){ return S.top.find(u=>u.id===id) || S.seats.find(u=>u&&u.id===id); }
function plen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);return L;}
function along(p,d){for(let i=1;i<p.length;i++){const l=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);if(d<=l||i===p.length-1){const k=l?Math.min(1,d/l):1;return{x:p[i-1].x+(p[i].x-p[i-1].x)*k,y:p[i-1].y+(p[i].y-p[i-1].y)*k};}d-=l;}return p[0];}
function startAct(id,k,o={}){ S.acts.set(id,{k,t0:now(),jx:(Math.random()-.5)*36,...o}); }
const countActs = k => [...S.acts.values()].filter(a=>a.k===k).length;
// vị trí + tư thế hiện tại của một người đang có hành động
function actState(id,a,t,home){
  const side = home.x < CX ? -1 : 1;
  if (a.k === 'join') {
    const p=[ENTRY,{x:CX+side*16,y:home.y},home], L=plen(p), d=(t-a.t0)*SPEED;
    if (d>=L) return null; return { walk:true, ...along(p,d), ph:d/11, path:p, d };
  }
  const altar={x:CX+a.jx*.6,y:LAND+8};
  const out=home.top?[home]:[home,{x:CX+side*18,y:home.y},altar], L=plen(out), tw=L/SPEED, e=t-a.t0, last=out[out.length-1];
  if (e<tw) return { walk:true, ...along(out,e*SPEED), ph:e*SPEED/11 };
  if (e<tw+PRAY) { if(!a.fired){a.fired=true;ritualFx(a.m);} const k=((e-tw)%1300)/1300; return { x:last.x, y:last.y, bow:Math.pow(Math.sin(k*Math.PI),.7) }; }
  if (e<2*tw+PRAY) return { walk:true, ...along(out.slice().reverse(),(e-tw-PRAY)*SPEED), ph:(e-tw-PRAY)*SPEED/11 };
  return null;
}
function bowOf(id,t){const b=S.bows.get(id);if(!b)return 0;const k=(t-b)/1300;if(k>1){S.bows.delete(id);return 0;}return Math.pow(Math.sin(k*Math.PI),.7);}

// ---------------- lên chánh điện: tặng quà → máy quay phóng cận bàn thờ, người tặng một mình lên đệm đỏ lạy 3 lạy ----------------
const ZF = { y: 800, z: 1.35 };                // tâm phóng: thấy cả mặt tượng + chiếu nghỉ trước lư hương (cảnh y 934 ra màn hình y≈980)
const ST = { zin: 900, walk0: 250, y0: 1090, y1: 934, v: .14, bows: 3, out: 900, gap: 2500 };
const UNIT = 'điểm';   // không hiện số xu trên màn hình
const GIFT_TIER = ['Bông hồng','Quà nhỏ','Quà vừa','Quà lớn','Quà rất lớn','Quà đặc biệt'];   // bảng trái: cỡ quà thay cho số xu
// hàng chờ dài thì lạy ít lạy hơn (3 → 2 → 1) cho nhịp nhanh, ai tặng cũng sớm được lên
const ST_ARR = ST.walk0 + (ST.y0 - ST.y1) / ST.v;
const end0 = s => ST_ARR + (s.bows || ST.bows) * 1300 + 300, endOf = s => end0(s) + ST.out;
function camK(t){ const s=S.st; if(!s) return 0; const e=t-s.t0; if(e<ST.zin) return ease(e/ST.zin); if(e<end0(s)) return 1; return 1-ease((e-end0(s))/ST.out); }
// máy quay: toàn cảnh luôn trôi chậm (không có 2 phút nào giống nhau), ghé gần người vừa tương tác, phóng cận bàn thờ khi có người lên lễ.
// điểm cảnh (fx,fy) hiện ra ở (sx,sy) màn hình, phóng z ≥ 1; kẹp sx/sy để ảnh luôn phủ kín khung (không lộ mép đen)
let CAM = { fx: CX, fy: 800, sx: CX, sy: 800, z: 1 };
const mixC = (a,b,k) => ({ fx:a.fx+(b.fx-a.fx)*k, fy:a.fy+(b.fy-a.fy)*k, sx:a.sx+(b.sx-a.sx)*k, sy:a.sy+(b.sy-a.sy)*k, z:a.z+(b.z-a.z)*k });
const VISIT = 6500;
function camUpdate(t,K){
  const fx=CX+60*Math.sin(t/37000), fy=800+100*Math.sin(t/29000+1);
  let c={ fx, fy, sx:fx, sy:fy, z:1.035+.03*Math.sin(t/23000) };
  const v=S.visit;
  if (v) { const e=t-v.t0, h=homeOf(v.id);
    if (e>VISIT || !h || S.st) S.visit=null;
    else { const k=Math.min(ease(e/1300),ease((VISIT-e)/1300)), fy2=h.y-70;
      c=mixC(c,{ fx:h.x, fy:fy2, sx:h.x+(CX-h.x)*.45, sy:fy2+(760-fy2)*.45, z:1.3 },k); } }
  c=mixC(c,{ fx:CX, fy:ZF.y, sx:CX, sy:ZF.y, z:ZF.z },K);
  c.sx=Math.min(c.fx*c.z,Math.max(W-(W-c.fx)*c.z,c.sx)); c.sy=Math.min(c.fy*c.z,Math.max(H-(H-c.fy)*c.z,c.sy));
  CAM=c;
}

  { const b=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;

function moAt(when, vol){
  const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(820,when);o.frequency.exponentialRampToValueAtTime(520,when+.06);
  const g=AC.createGain();g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vol,when+.004);g.gain.exponentialRampToValueAtTime(.001,when+.16);
  const n=AC.createBufferSource();const b=AC.createBuffer(1,AC.sampleRate*.05,AC.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  n.buffer=b;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1200;bp.Q.value=3;const ng=AC.createGain();ng.gain.value=vol*.6;
  o.connect(g);g.connect(bgGain);n.connect(bp);bp.connect(ng);ng.connect(bgGain);o.start(when);o.stop(when+.2);n.start(when);

function bell(vol=.5, f=196){
  if(!AC) return; const t0=AC.currentTime;
  [[1,1],[2.76,.5],[5.4,.25],[8.93,.12],[.5,.35]].forEach(([m,v])=>{const o=AC.createOscillator();o.frequency.value=f*m;const g=AC.createGain();

async function speak(m){
  const ack = () => ws && ws.readyState===1 && ws.send(JSON.stringify({t:'spoken',id:m.id}));
  if (!m.url || !AC) { setTimeout(ack, 1200 + m.text.length*55); return; }

    const buf = await (await fetch(m.url)).arrayBuffer();
    const ab = await AC.decodeAudioData(buf);

      if (S.scene.cur!=='hall' && t-(S.likeHd.get(m.id)||-1e9)>4000) { S.likeHd.set(m.id,t); addHd(S.seats.find(u=>u&&u.id===m.id)||{id:m.id},t); if (m.count>=10) addHd(null,t-2000); }
      const p=S.anchor.get(m.id)||{x:CX,y:300};
      for(let k=0;k<Math.min(5,1+Math.floor(m.count/3));k++) S.hearts.push({t:t+k*120,x:p.x+(Math.random()-.5)*16,y:p.y,s:13+Math.random()*7,ph:Math.random()*6});
      if(S.hearts.length>60) S.hearts.splice(0,S.hearts.length-60);
      S.floats.push({t,x:p.x,y:p.y-6,icon:'tim',text:'+'+m.count,size:15});
      if (m.count>=5) maybeVisit(m.id,t);
      break; }
    case 'gift': { const p=S.anchor.get(m.id); if(p) S.floats.push({t,x:p.x,y:p.y,text:'+'+m.points+' điểm',size:18}); S.bows.set(m.id,t);
      if (t-(S.luAt.get(m.id)||-1e9)>3000) { S.luAt.set(m.id,t); S.lotusUp.push({t,name:m.name}); if (S.lotusUp.length>6) S.lotusUp.shift(); }
      // xếp hàng lên chánh điện; người đã đang chờ (hoặc đang lên, chưa lạy) thì cộng dồn quà
      const q=(S.st&&S.st.id===m.id&&!S.st.fired)?S.st:S.stage.find(s=>s.id===m.id);
      if (q) { q.count+=m.count; q.points+=m.points; q.gift=m.gift; if (m.rose && q!==S.st && !q.rose) { q.rose=true; S.stage.splice(S.stage.indexOf(q),1); roseFirst(q); } }
      else if (m.rose) roseFirst({id:m.id,name:m.name,avatar:m.avatar,gift:m.gift,count:m.count,points:m.points,rose:true});
      else if (m.stage!==false || stageQuiet(t)) { S.stage.push({id:m.id,name:m.name,avatar:m.avatar,gift:m.gift,count:m.count,points:m.points});
        const rest=S.stage.filter(s=>!s.rose);   // quá đông: bỏ người quà nhỏ nhất (không bỏ người tặng hồng)
        if (S.stage.length>15 && rest.length) S.stage.splice(S.stage.indexOf(rest.reduce((mi,s)=>s.points<mi.points?s:mi)),1); }
      break; }
    case 'speak': speak(m); break;
  }
}
