<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="google" content="notranslate">
<title>Chùa Online</title>
<meta name="viewport" content="width=720">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Be+Vietnam+Pro:wght@500;700;800&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
  #tap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);
       color:#ffe08a;font:bold 26px "Playfair Display","DejaVu Serif",serif;cursor:pointer;text-align:center}
</style></head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<div id="tap">Bấm để bật âm thanh 🔔<br><small style="font-size:15px">(trong OBS sẽ tự bật)</small></div>
<script>
'use strict';
// Mẫu 3 · Chánh Điện Lễ Phật: nền ảnh chánh điện (public/img/chanh-dien.jpg), Phật tử quỳ lễ 2 bên thảm đỏ
// (ảnh đại diện + tên trên đầu), người mới vào đi dọc thảm vào chỗ; làm pháp sự thì đi lên trước bàn thờ lạy 3 lạy.
// Bảng trái: hướng dẫn lễ Phật; bảng phải: 4 đại pháp sự (bộ đếm) + bảng vàng công đức Top 5.
const W = 720, H = 1280;
const c = document.getElementById('c'); let x = c.getContext('2d');
// Độ nét: vẽ theo độ phân giải thật của khung hiển thị (OBS / LIVE Studio thường 1080×1920 = 1,5×),
// mọi toạ độ vẫn tính trên khung 720×1280. ?scale=2 để ép; trần 2 cho nhẹ máy.
let SC = 1;
function pickScale(){
  const q = +new URLSearchParams(location.search).get('scale');
  const v = q || Math.min(innerWidth / 720, innerHeight / 1280) * (window.devicePixelRatio || 1);
  return Math.min(2, Math.max(1, Math.ceil(v * 4) / 4));
}
function applyScale(){ SC = pickScale(); c.width = 720 * SC; c.height = 1280 * SC; }
applyScale();
function blit(cv, X, Y){ x.drawImage(cv, X, Y, cv.width / SC, cv.height / SC); }
const PLATFORM = location.pathname.split('/').filter(Boolean)[0] || 'tiktok';
const SERIF = '"Playfair Display","DejaVu Serif","Noto Serif",serif', SANS = '"Be Vietnam Pro","DejaVu Sans","Noto Sans",Arial,sans-serif';
const AV = ['#e57373','#64b5f6','#81c784','#ffb74d','#ba68c8','#4db6ac','#f06292','#a1887f'];
const now = () => performance.now();
const hashOf = s => { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return h >>> 0; };

// ---------------- trạng thái ----------------
const DEF_RITUALS = [
  { key:'den', name:'Thắp đèn lưu ly', icon:'🪔', hint:'Tặng Hoa Hồng hoặc chat: thắp đèn', count:0 },
  { key:'cauan', name:'Cầu an gia đạo', icon:'🏮', hint:'Chia sẻ live / quà từ 5 xu hoặc chat: cầu an', count:0 },
  { key:'xinxam', name:'Xin xăm quẻ pháp', icon:'🎋', hint:'Quà từ 30 xu hoặc chat: xin xăm', count:0 },
  { key:'chuong', name:'Chuông đồng bát nhã', icon:'🔔', hint:'Quà từ 99 xu: thỉnh chuông đồng', count:0 },
];
const S = { temple: 'CHÙA AN LẠC', ticker: '', seats: [], top: [], niem: 0, likes: 0, rituals: DEF_RITUALS,
  acts: new Map(), joins: new Map(), bows: new Map(), bubbles: new Map(), anchor: new Map(), hot: new Map(),
  floats: [], toasts: [], petals: [], sparks: [], lanterns: [], smoke: [], lampNew: 0, que: null, bellFx: null, bigQ: [], hearts: [], likeHit: 0, likeBoost: 0,
  next: [], stage: [], st: null, stNext: 0, stEnd: performance.now(), active: new Map(), invited: new Map() };

// ---------------- vẽ: công cụ ----------------
function rr(a,b,w,h,q){x.beginPath();x.moveTo(a+q,b);x.arcTo(a+w,b,a+w,b+h,q);x.arcTo(a+w,b+h,a,b+h,q);x.arcTo(a,b+h,a,b,q);x.arcTo(a,b,a+w,b,q);x.closePath();}
function lg(x0,y0,x1,y1,st){const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function rg(cx,cy,r0,r1,st){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function glow(cx,cy,rad,inner,outer){x.fillStyle=rg(cx,cy,0,rad,[[0,inner],[1,outer]]);x.beginPath();x.arc(cx,cy,rad,0,7);x.fill();}
const GOLD=(y0,y1)=>lg(0,y0,0,y1,[[0,'#fff6cf'],[.42,'#ffd56e'],[.58,'#d9982a'],[1,'#fff0b4']]);
function txt(t,X,Y,font,fill,align='center',stroke,o={}){x.save();x.font=font;x.textAlign=align;if(o.spacing&&'letterSpacing' in x)x.letterSpacing=o.spacing+'px';
  if(o.shadow){x.shadowColor=o.shadow[0];x.shadowBlur=o.shadow[1];}
  if(stroke){x.lineJoin='round';x.lineWidth=stroke[1];x.strokeStyle=stroke[0];x.strokeText(t,X,Y);}x.fillStyle=fill;x.fillText(t,X,Y);x.restore();}
function fitFont(t,max,size,family,weight='bold'){let s=size;do{x.font=`${weight} ${s}px ${family}`;}while(x.measureText(t).width>max&&--s>8);return x.font;}
function wrap(t,max,font){x.font=font;const ws=t.split(' ');const out=[];let cur='';for(const w of ws){const tt=cur?cur+' '+w:w;if(x.measureText(tt).width>max&&cur){out.push(cur);cur=w;}else cur=tt;}if(cur)out.push(cur);return out;}
function layer(fn,w=W,h=H){const cv=document.createElement('canvas');cv.width=Math.ceil(w*SC);cv.height=Math.ceil(h*SC);const old=x;x=cv.getContext('2d');x.scale(SC,SC);try{fn();}finally{x=old;}return cv;}
const short=(s,n)=>{const a=[...s];return a.length>n?a.slice(0,n-1).join('')+'…':s;};
const ease = t => 1 - Math.pow(1 - Math.min(Math.max(t,0),1), 3);
// icon vẽ tay thay emoji: trình duyệt nguồn Link của LIVE Studio không có font emoji (hiện ô vuông)
function heartPath(r){x.beginPath();x.moveTo(0,r*.9);x.bezierCurveTo(-r*1.3,0,-r*.9,-r*1.1,0,-r*.45);x.bezierCurveTo(r*.9,-r*1.1,r*1.3,0,0,r*.9);x.closePath();}
function icon(k,X,Y,sz=20){
  x.save();x.translate(X,Y);const s=sz/20;x.scale(s,s);x.lineCap='round';x.lineJoin='round';
  if(k==='den'){ glow(0,-6,12,'rgba(255,200,90,.8)','rgba(255,160,40,0)');
    x.fillStyle='#fff1b0';x.beginPath();x.moveTo(0,-13);x.quadraticCurveTo(5,-5,0,-1);x.quadraticCurveTo(-5,-5,0,-13);x.fill();
    x.fillStyle=lg(-10,0,10,0,[[0,'#8a5a14'],[.5,'#f6cf6a'],[1,'#8a5a14']]);x.beginPath();x.moveTo(-10,0);x.quadraticCurveTo(0,9,10,0);x.closePath();x.fill();x.fillRect(-3,4,6,4);x.fillRect(-6,8,12,2); }
  else if(k==='cauan'){ glow(0,0,13,'rgba(255,90,40,.5)','rgba(255,60,20,0)');
    x.fillStyle=lg(-8,0,8,0,[[0,'#8a0e06'],[.5,'#ec3a1e'],[1,'#8a0e06']]);x.beginPath();x.ellipse(0,0,8,9.5,0,0,7);x.fill();
    x.fillStyle='#e8b04a';x.fillRect(-5,-11,10,2.5);x.fillRect(-5,8.5,10,2.5);x.strokeStyle='#e8b04a';x.lineWidth=1.2;x.beginPath();x.moveTo(0,11);x.lineTo(0,15);x.moveTo(0,-11);x.lineTo(0,-14);x.stroke(); }
  else if(k==='xinxam'){ x.lineWidth=1.8;[[-5,-.25],[-1.5,-.08],[2,.1],[5,.28]].forEach(([dx,a])=>{x.save();x.translate(dx*.6,-1);x.rotate(a);x.strokeStyle='#e9c47a';x.beginPath();x.moveTo(0,0);x.lineTo(0,-13);x.stroke();x.strokeStyle='#d0281a';x.beginPath();x.moveTo(0,-11);x.lineTo(0,-14);x.stroke();x.restore();});
    x.fillStyle=lg(-8,0,8,0,[[0,'#5a2a08'],[.5,'#b0701e'],[1,'#5a2a08']]);x.beginPath();x.moveTo(-8,-3);x.lineTo(8,-3);x.lineTo(6.5,12);x.lineTo(-6.5,12);x.closePath();x.fill();x.fillStyle='#e8b04a';x.fillRect(-8,-3,16,2); }
  else if(k==='chuong'){ x.fillStyle=lg(-9,0,9,0,[[0,'#7a5212'],[.45,'#ffe7a0'],[1,'#6a4410']]);x.beginPath();x.moveTo(-5,-9);x.quadraticCurveTo(-9,-8,-9,4);x.quadraticCurveTo(-9,8,-11,10);x.lineTo(11,10);x.quadraticCurveTo(9,8,9,4);x.quadraticCurveTo(9,-8,5,-9);x.quadraticCurveTo(0,-11,-5,-9);x.fill();
    x.strokeStyle='#7a5212';x.lineWidth=2;x.beginPath();x.arc(0,-11,3,Math.PI,0);x.stroke(); }
  else if(k==='tim'){ x.fillStyle=lg(0,-10,0,10,[[0,'#ff6b81'],[1,'#d81b3c']]);heartPath(10);x.fill();x.fillStyle='rgba(255,255,255,.45)';x.beginPath();x.ellipse(-4.5,-4,2.5,1.6,-.6,0,7);x.fill(); }
  else if(k==='nguoi'){ x.fillStyle='#f0c060';x.beginPath();x.arc(0,-7,4.5,0,7);x.fill();x.beginPath();x.moveTo(-9,10);x.quadraticCurveTo(-9,-1,0,-1);x.quadraticCurveTo(9,-1,9,10);x.closePath();x.fill(); }
  else if(k==='qua'){ x.fillStyle='#d8261a';x.fillRect(-9,-4,18,14);x.fillStyle='#b81a10';x.fillRect(-10,-7,20,5);x.fillStyle='#f6cf6a';x.fillRect(-1.5,-7,3,17);
    x.strokeStyle='#f6cf6a';x.lineWidth=2;x.beginPath();x.ellipse(-4,-9,4,2.5,.4,0,7);x.ellipse(4,-9,4,2.5,-.4,0,7);x.stroke(); }
  else { // sen (niệm Phật)
    [[-.9,'#f5a3b5'],[.9,'#f5a3b5'],[-.45,'#f7b8c6'],[.45,'#f7b8c6'],[0,'#fcd3dc']].forEach(([a,cl])=>{x.save();x.translate(0,8);x.rotate(a);x.fillStyle=cl;x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(6,-8,0,-17);x.quadraticCurveTo(-6,-8,0,0);x.fill();x.restore();});
    x.fillStyle='#7cbf6a';x.beginPath();x.ellipse(0,9,10,2.5,0,0,7);x.fill(); }
  x.restore();
}
function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(v*k)));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`;}

// ---------------- bố cục (theo ảnh nền) ----------------
const CX = 363;                                  // trục thảm đỏ
const HALO = { x: 364, y: 534 };                 // hào quang tượng Phật trong ảnh
const hw = y => 49 + (y - 918) * .518;           // nửa bề rộng thảm theo y
const sc = y => .74 + (y - 918) * .00105;        // tỉ lệ người: xa bàn thờ to dần
const ENTRY = { x: CX, y: 1330 };                // cửa chánh điện (dưới khung hình)
// Top 5 quỳ ngay trước bàn thờ, hạng 1 ở giữa gần nhất
const TOPPOS = [[0,972],[-66,934],[66,934],[-134,922],[134,922]].map(([dx,y]) => ({ x: CX+dx, y, s: sc(y)*1.06, top: true }));
// chỗ quỳ thường: các hàng 2 bên thảm, lấp từ hàng gần bàn thờ, sát thảm trước
const SEATPOS = [];
// hàng lẻ lệch nửa chỗ để tên các hàng không chồng nhau
[996,1058,1124,1194,1264].forEach((y,row) => { const s = sc(y), sp = 82*s, L = [], R = [];
  for (let k = 0; ; k++) { const d = hw(y) + 22*s + (row%2 ? sp/2 : 0) + sp*k; if (CX - d < 24*s) break; L.push({x:CX-d,y,s}); R.push({x:CX+d,y,s}); }
  L.forEach((p,k) => SEATPOS.push(p, R[k])); });
// 18 ngọn đèn lưu ly trên chiếu trước bàn thờ (2 bên lối giữa)
const LAMPS = []; for (let k = 0; k < 9; k++) { LAMPS.push({ x: 318 - k*14, y: 900 + (k%2)*7 }, { x: 408 + k*14, y: 900 + (k%2)*7 }); }
// khung bảng
const PL = { x: 8, y: 240, w: 222 }, PR = { x: 490, y: 240, w: 222 };

// ---------------- ảnh ----------------
const BG = { img: new Image(), ok: false };
BG.img.onload = () => { BG.ok = true; buildStatic(); };
BG.img.src = '/img/chanh-dien.jpg?v=' + Date.now();   // LIVE Studio giữ ảnh cũ trong bộ nhớ đệm → mỗi lần tải trang lấy ảnh mới
const AVC = new Map();     // ảnh đại diện: url -> Image
function avatarImg(url){ if (!url) return null; let a = AVC.get(url);
  if (!a) { a = { img: new Image(), ok: false }; a.img.onload = () => a.ok = true; a.img.src = url; AVC.set(url, a); if (AVC.size > 300) AVC.delete(AVC.keys().next().value); }
  return a.ok ? a.img : null; }

// ---------------- lớp tĩnh ----------------
let BACK, TOPL;
function panel(X,Y,w,h,title){
  x.save();x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=18;x.fillStyle=lg(0,Y,0,Y+h,[[0,'rgba(66,12,6,.88)'],[1,'rgba(28,6,3,.9)']]);rr(X,Y,w,h,12);x.fill();x.restore();
  x.strokeStyle=lg(X,Y,X+w,Y+h,[[0,'#fff0b0'],[.5,'#c88a2a'],[1,'#fff0b0']]);x.lineWidth=2;rr(X,Y,w,h,12);x.stroke();
  x.strokeStyle='rgba(255,215,130,.35)';x.lineWidth=1;rr(X+4,Y+4,w-8,h-8,9);x.stroke();
  x.fillStyle=lg(X,0,X+w,0,[[0,'rgba(150,20,10,0)'],[.15,'#9b1c10'],[.85,'#9b1c10'],[1,'rgba(150,20,10,0)']]);x.fillRect(X+6,Y+7,w-12,27);
  x.strokeStyle='rgba(255,210,120,.7)';x.lineWidth=1;x.beginPath();x.moveTo(X+18,Y+34.5);x.lineTo(X+w-18,Y+34.5);x.stroke();
  txt(title,X+w/2,Y+26,fitFont(title,w-30,14,SANS,'800'),GOLD(Y+12,Y+30),'center',null,{spacing:1});
}
function buildStatic(){
  BACK = layer(() => {
    if (BG.ok) { const k = Math.max(W/BG.img.width, H/BG.img.height), w = BG.img.width*k, h = BG.img.height*k; x.drawImage(BG.img,(W-w)/2,(H-h)/2,w,h); }
    else { x.fillStyle=rg(CX,520,0,900,[[0,'#6a3a10'],[1,'#120502']]);x.fillRect(0,0,W,H); }
    // tối nhẹ phía trên cho chữ, tối 2 mép cho bảng, sáng giữ nguyên ở tượng
    x.fillStyle=lg(0,0,0,300,[[0,'rgba(10,3,0,.55)'],[1,'rgba(10,3,0,0)']]);x.fillRect(0,0,W,300);
    x.fillStyle=lg(0,0,W,0,[[0,'rgba(10,3,0,.35)'],[.3,'rgba(10,3,0,0)'],[.7,'rgba(10,3,0,0)'],[1,'rgba(10,3,0,.35)']]);x.fillRect(0,0,W,H);
    x.fillStyle=lg(0,1150,0,H,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.35)']]);x.fillRect(0,1150,W,H-1150);
  });
  TOPL = layer(() => {
    // đầu trang: tên chùa + dải chữ
    x.fillStyle=lg(0,100,0,236,[[0,'rgba(30,6,2,0)'],[.25,'rgba(30,6,2,.78)'],[1,'rgba(30,6,2,.78)']]);x.fillRect(0,100,W,136);
    txt('✦  CHÁNH ĐIỆN LỄ PHẬT  ✦',CX,132,`800 14px ${SANS}`,'#ffd98a','center',null,{spacing:6});
    txt(S.temple,CX,178,fitFont(S.temple,600,46,SERIF,'800'),GOLD(140,182),'center',['#2a1200',5],{shadow:['rgba(255,190,80,.85)',20]});
    // bảng trái: hướng dẫn
    const noEmoji = s => s.replace(/\p{Extended_Pictographic}️?\s?/gu, '');
    const rows = S.rituals.map(r => ({ icon: r.key, name: r.name, lines: wrap(noEmoji(r.hint || ''), PL.w-54, `600 11.5px ${SANS}`).slice(0,2) }));
    if (S.stageMin > 1) rows.push({ icon: 'qua', name: 'Lên chánh điện lạy Phật', lines: [`Tặng quà từ ${S.stageMin} ${UNIT}`] });
    rows.push({ icon: 'sen', name: 'Niệm Phật cùng đại chúng', lines: ['Chat: Nam mô A Di Đà Phật'] });
    const hh = 44 + rows.reduce((a,r) => a + 22 + r.lines.length*15 + 6, 0);
    panel(PL.x,PL.y,PL.w,hh,'HƯỚNG DẪN LỄ PHẬT');
    let y = PL.y + 44;
    rows.forEach((r,i) => {
      icon(r.icon,PL.x+24,y+13,19);
      txt(r.name,PL.x+42,y+14,fitFont(r.name,PL.w-52,13.5,SANS,'800'),'#ffd98a','left');
      r.lines.forEach((l,k) => txt(l,PL.x+42,y+31+k*15,`600 11.5px ${SANS}`,'#f6e7cc','left'));
      y += 22 + r.lines.length*15 + 6;
      if (i < rows.length-1) { x.strokeStyle='rgba(255,210,120,.18)';x.lineWidth=1;x.beginPath();x.moveTo(PL.x+14,y-3);x.lineTo(PL.x+PL.w-14,y-3);x.stroke(); }
    });
    S.statY = PL.y + hh + 10;
    panel(PR.x,PR.y,PR.w,44+S.rituals.length*42,(S.rituals.length===4?'4 ':'')+'ĐẠI PHÁP SỰ LỄ PHẬT');
    S.lbY = PR.y + 44 + S.rituals.length*42 + 10;
    panel(PR.x,S.lbY,PR.w,44+5*44,'BẢNG VÀNG CÔNG ĐỨC');
  });
}

// ---------------- vẽ: Phật tử ----------------
const ROBES = ['#6b7b8f','#7a5a3e','#8b7b66','#55707a','#9a8a74','#6d5d7a','#5f6b5a','#84705c'];
function look(id, rank){ const h = hashOf(id);
  return { robe: rank ? '#c9932e' : ROBES[h % ROBES.length], hair: (h >> 4) % 13 === 0 ? 3 : (h >> 5) % 3, gold: !!rank }; }
// quỳ lạy nhìn từ sau lưng. gốc = giữa mép dưới. b 0..1 = cúi lạy
const SKIN='#d9a882', HAIR='#1a120d';
// đầu nhìn từ sau: tóc che gần hết, lộ 2 vành tai + gáy
function headBack(hy,L){
  x.fillStyle=SKIN;x.fillRect(-4.5,hy+8,9,9);
  x.beginPath();x.ellipse(-11.2,hy+1,2.6,3.6,0,0,7);x.ellipse(11.2,hy+1,2.6,3.6,0,0,7);x.fill();
  x.fillStyle=L.hair===3?'#c8976d':HAIR;x.beginPath();x.ellipse(0,hy,11.5,12.8,0,0,7);x.fill();
  if(L.hair===1){x.beginPath();x.arc(0,hy-11,6.5,0,7);x.fill();}
  x.fillStyle='rgba(255,230,190,.16)';x.beginPath();x.ellipse(-3.5,hy-5,5,6,-.3,0,7);x.fill();
}
// áo tràng phần trên: vai tròn, 2 tay áo buông dọc thân (chắp tay phía trước). sy = đỉnh vai
function backRobe(sy,wy,L){
  const robe=L.robe, lt=shade(robe,1.28), dk=shade(robe,.7);
  x.fillStyle=lg(0,sy,0,wy,[[0,lt],[1,robe]]);
  x.beginPath();x.moveTo(-19,wy);x.bezierCurveTo(-22,wy-12,-25,sy+12,-16,sy+1);x.quadraticCurveTo(0,sy-5,16,sy+1);x.bezierCurveTo(25,sy+12,22,wy-12,19,wy);x.closePath();x.fill();
  // tay áo
  x.lineCap='round';x.strokeStyle=dk;x.lineWidth=9;
  [-1,1].forEach(k=>{x.beginPath();x.moveTo(k*19,sy+5);x.quadraticCurveTo(k*27,(sy+wy)/2,k*20,wy-3);x.stroke();});
  // viền sáng ánh đèn bàn thờ trên vai + đường may sống lưng
  x.strokeStyle='rgba(255,215,150,.38)';x.lineWidth=1.3;x.beginPath();x.moveTo(-15,sy+2);x.quadraticCurveTo(0,sy-4,15,sy+2);x.stroke();
  x.strokeStyle='rgba(0,0,0,.2)';x.beginPath();x.moveTo(0,sy);x.lineTo(0,wy);x.stroke();
  if(L.gold){x.strokeStyle='#b8281a';x.lineWidth=4.5;x.beginPath();x.moveTo(-14,sy+3);x.lineTo(16,wy-2);x.stroke();}
}
// quỳ lạy nhìn từ sau lưng. gốc = giữa mép dưới. b 0..1 = cúi lạy
function kneel(X,Y,s,L,b){
  x.save();x.translate(X,Y);x.scale(s,s);
  x.fillStyle='rgba(0,0,0,.4)';x.beginPath();x.ellipse(0,-1,32,7,0,0,7);x.fill();
  const robe=L.robe;
  // hai chân xếp dưới vạt áo
  x.fillStyle=lg(0,-34,0,0,[[0,shade(robe,1.05)],[1,shade(robe,.6)]]);
  x.beginPath();x.moveTo(-29,0);x.bezierCurveTo(-31,-16,-26,-31,-17,-34);x.lineTo(17,-34);x.bezierCurveTo(26,-31,31,-16,29,0);x.closePath();x.fill();
  x.fillStyle=shade(SKIN,.8);x.beginPath();x.ellipse(-9,-2.5,5.5,2.4,0,0,7);x.ellipse(9,-2.5,5.5,2.4,0,0,7);x.fill();
  const sy=-74+b*32, hy=-89+b*44;
  headBack(hy,L);                     // vẽ trước: lạy sát đất thì lưng che đầu
  if(L.hair===2&&b<.5){x.fillStyle=HAIR;x.beginPath();x.ellipse(0,hy+15,4.5,10,0,0,7);x.fill();}
  backRobe(sy,-30,L);
  x.fillStyle=shade(robe,.45);x.fillRect(-20,-33,40,3.5);
  x.restore();
}
// đứng / đi nhìn từ sau lưng. ph = pha bước chân
function walker(X,Y,s,L,ph){
  const bob=Math.abs(Math.sin(ph))*2.2;
  x.save();x.translate(X,Y);x.scale(s,s);
  x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(0,-2,22,6,0,0,7);x.fill();
  x.fillStyle='#2a1c14';const f=Math.sin(ph)*5;x.beginPath();x.ellipse(-7,-3+Math.min(0,f),5.5,3,0,0,7);x.ellipse(7,-3+Math.min(0,-f),5.5,3,0,0,7);x.fill();
  x.translate(0,-bob);x.rotate(Math.sin(ph)*.025);
  const robe=L.robe;
  headBack(-114,L);
  // vạt áo dài
  x.fillStyle=lg(0,-60,0,-4,[[0,robe],[1,shade(robe,.62)]]);
  x.beginPath();x.moveTo(-22,-4);x.lineTo(-18,-62);x.lineTo(18,-62);x.lineTo(22,-4);x.closePath();x.fill();
  x.strokeStyle='rgba(0,0,0,.18)';x.lineWidth=1.3;x.beginPath();x.moveTo(Math.sin(ph)*3,-60);x.lineTo(Math.sin(ph)*5,-6);x.stroke();
  backRobe(-100,-58,L);
  if(L.hair===2){x.fillStyle=HAIR;x.beginPath();x.ellipse(0,-98,4.5,11,0,0,7);x.fill();}
  x.fillStyle=shade(robe,.45);x.fillRect(-19,-61,38,3.5);
  x.restore();
}

  x.fillStyle=lg(0,-18,0,2,[[0,'#fff3b8'],[.5,'#f2b63a'],[1,'#a86a12']]);x.beginPath();x.moveTo(-15,2);x.lineTo(-17,-14);x.lineTo(-8,-6);x.lineTo(0,-19);x.lineTo(8,-6);x.lineTo(17,-14);x.lineTo(15,2);x.closePath();x.fill();
  x.strokeStyle='#7a4a08';x.lineWidth=1;x.stroke();x.fillStyle='#d8261a';x.beginPath();x.arc(0,-4,2.6,0,7);x.fill();x.restore();}

// ảnh đại diện + tên trên đầu. top = đỉnh đầu
function label(X,top,s,u,rank,alpha){

  x.save();x.globalAlpha=alpha;

  const nm=short(u.name,rank?11:9), f=`800 ${Math.round((rank?12.5:11)*Math.min(1.1,s+.18))}px ${SANS}`;x.font=f;const w=x.measureText(nm).width+12;
  x.fillStyle=rank?'rgba(120,20,10,.92)':'rgba(25,8,3,.8)';rr(X-w/2,ny-8,w,16,8);x.fill();
  if(rank){x.strokeStyle='#f0c060';x.lineWidth=1;x.stroke();}
  txt(nm,X,ny+4,f,rank?'#ffe7a3':'#fff2dc');
  if(rank){x.fillStyle='#c0261b';x.beginPath();x.arc(X+r*.8,ay+r*.75,7.5,0,7);x.fill();x.strokeStyle='#ffd36b';x.lineWidth=1.2;x.stroke();txt(String(rank),X+r*.8,ay+r*.75+3.6,`800 10px ${SANS}`,'#fff');}

function bubble(X,Y,text,a){

  const w=Math.max(...lines.map(l=>x.measureText(l).width))+20,h=lines.length*17+12;

// ---------------- di chuyển: vào chỗ / lên lễ ----------------
const SPEED = .13;                       // px / ms
const PRAY = 3 * 1300;                   // lạy 3 lạy
function homeOf(id){ const ti=S.top.findIndex(u=>u.id===id); if(ti>=0) return TOPPOS[ti];
  const si=S.seats.findIndex(u=>u&&u.id===id); return si>=0?SEATPOS[si]:null; }
function userOf(id){ return S.top.find(u=>u.id===id) || S.seats.find(u=>u&&u.id===id); }
function plen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);return L;}
function along(p,d){for(let i=1;i<p.length;i++){const l=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);if(d<=l||i===p.length-1){const k=l?Math.min(1,d/l):1;return{x:p[i-1].x+(p[i].x-p[i-1].x)*k,y:p[i-1].y+(p[i].y-p[i-1].y)*k};}d-=l;}return p[0];}
function startAct(id,k,o={}){ S.acts.set(id,{k,t0:now(),jx:(Math.random()-.5)*36,...o}); }
const countActs = k => [...S.acts.values()].filter(a=>a.k===k).length;
// vị trí + tư thế hiện tại của một người đang có hành động
function actState(id,a,t,home){
  const side = home.x < CX ? -1 : 1;
  if (a.k === 'join') {
    const p=[ENTRY,{x:CX+side*16,y:home.y},home], L=plen(p), d=(t-a.t0)*SPEED;
    if (d>=L) return null; return { walk:true, ...along(p,d), ph:d/11, path:p, d };
  }
  const altar={x:CX+a.jx,y:948};
  const out=home.top?[home]:[home,{x:CX+side*18,y:home.y},altar], L=plen(out), tw=L/SPEED, e=t-a.t0, last=out[out.length-1];
  if (e<tw) return { walk:true, ...along(out,e*SPEED), ph:e*SPEED/11 };
  if (e<tw+PRAY) { if(!a.fired){a.fired=true;ritualFx(a.m);} const k=((e-tw)%1300)/1300; return { x:last.x, y:last.y, bow:Math.pow(Math.sin(k*Math.PI),.7) }; }
  if (e<2*tw+PRAY) return { walk:true, ...along(out.slice().reverse(),(e-tw-PRAY)*SPEED), ph:(e-tw-PRAY)*SPEED/11 };
  return null;
}
function bowOf(id,t){const b=S.bows.get(id);if(!b)return 0;const k=(t-b)/1300;if(k>1){S.bows.delete(id);return 0;}return Math.pow(Math.sin(k*Math.PI),.7);}

// ---------------- lên chánh điện: tặng quà → máy quay phóng cận bàn thờ, người tặng một mình lên đệm đỏ lạy 3 lạy ----------------
const ZF = { y: 853, z: 1.6 };                 // tâm phóng: chỗ quỳ trước bàn thờ (cảnh y 958) ra màn hình y≈1020
const ST = { zin: 900, walk0: 250, y0: 1090, y1: 958, v: .14, bows: 3, out: 900, gap: 2500 };
const UNIT = PLATFORM === 'tiktok' ? 'xu' : 'công đức';
const ST_ARR = ST.walk0 + (ST.y0 - ST.y1) / ST.v, ST_END0 = ST_ARR + ST.bows * 1300 + 300, ST_END = ST_END0 + ST.out;
function camK(t){ const s=S.st; if(!s) return 0; const e=t-s.t0; if(e<ST.zin) return ease(e/ST.zin); if(e<ST_END0) return 1; return 1-ease((e-ST_END0)/ST.out); }
function camOn(k){ const z=1+(ZF.z-1)*k; x.translate(CX,ZF.y); x.scale(z,z); x.translate(-CX,-ZF.y); }
function toScreen(p,k){ const z=1+(ZF.z-1)*k; return { x:CX+(p.x-CX)*z, y:ZF.y+(p.y-ZF.y)*z }; }
// vắng: chánh điện trống ≥ 20 giây thì pháp sự bằng chat / chia sẻ / quà nhỏ cũng được lên; trống ≥ 75 giây thì mời người vừa tương tác lên lạy
const QUIET = 20000, INVITE = 75000;
const stageQuiet = t => !S.st && !S.stage.length && t - S.stEnd > QUIET;
function inviteOne(t){
  let best = null;
  for (const [id, at] of S.active) {
    if (t - at > 180000) { S.active.delete(id); continue; }
    if (t - (S.invited.get(id) || -1e9) < 600000 || !userOf(id)) continue;   // mỗi người được mời tối đa 1 lần / 10 phút
    if (!best || at > best.at) best = { id, at };
  }
  if (!best && S.top[0] && t - (S.invited.get(S.top[0].id) || -1e9) > 600000) best = { id: S.top[0].id };
  if (!best) return;
  const u = userOf(best.id); S.invited.set(u.id, t);
  S.stage.push({ id: u.id, name: u.name, avatar: u.avatar, count: 0, points: 0 });
}
function stageTick(t){
  if (S.st && t - S.st.t0 > ST_END) { S.st = null; S.stNext = t + ST.gap; S.stEnd = t; }   // về toàn cảnh ít nhất 2,5 giây rồi mới mời người kế
  if (!S.st && !S.stage.length && !S.que && !S.bellFx && t - S.stEnd > INVITE) { S.stEnd = t; inviteOne(t); }
  if (!S.st && !S.que && !S.bellFx && S.stage.length && t >= S.stNext) { S.st = { ...S.stage.shift(), t0: t }; bell(.09, 262); }
}
// vẽ trong toạ độ cảnh (đang phóng)
function drawStage(t){
  const s=S.st; if(!s) return; const e=t-s.t0;
  const a=Math.max(0,Math.min(1,(e-ST.walk0)/300,e>ST_END0?1-(e-ST_END0)/(ST.out*.7):1)); if(a<=0) return;
  const rank=S.top.findIndex(u=>u.id===s.id)+1, L=look(s.id,rank), u={id:s.id,name:s.name,avatar:s.avatar};
  // ánh sáng rọi xuống + đệm đỏ trước bàn thờ
  x.save();x.globalAlpha=a;x.globalCompositeOperation='lighter';
  x.fillStyle=lg(0,560,0,980,[[0,'rgba(255,220,140,0)'],[1,'rgba(255,214,120,.22)']]);
  x.beginPath();x.moveTo(CX-22,560);x.lineTo(CX+22,560);x.lineTo(CX+72,978);x.lineTo(CX-72,978);x.closePath();x.fill();
  glow(CX,ST.y1-40,90,'rgba(255,215,130,.28)','rgba(255,190,80,0)');x.restore();
  x.save();x.globalAlpha=a;
  x.fillStyle=lg(0,ST.y1-9,0,ST.y1+13,[[0,'#d8321e'],[1,'#7a0e06']]);x.beginPath();x.ellipse(CX,ST.y1+2,50,11,0,0,7);x.fill();
  x.strokeStyle='#f0c060';x.lineWidth=1.6;x.stroke();
  let Y, sz, head;
  if (e < ST_ARR) { Y=ST.y0-Math.max(0,e-ST.walk0)*ST.v; sz=sc(Y)*1.12; walker(CX,Y,sz,L,(e-ST.walk0)*ST.v/11); head=Y-127*sz; }
  else { Y=ST.y1; sz=sc(Y)*1.12; const k=e-ST_ARR, bn=Math.floor(k/1300), b=bn<ST.bows?Math.pow(Math.sin((k%1300)/1300*Math.PI),.7):0;
    if (!s.fired) { s.fired=true; if (s.rit) ritualFx(s.rit,true); for(let i=0;i<6;i++) S.smoke.push({t:t-i*400,x:CX+(Math.random()-.5)*8,ph:Math.random()*6}); }
    if (bn<ST.bows && s.bn!==bn) { s.bn=bn; mo(); }
    kneel(CX,Y,sz,L,b); head=Y-(103-b*44)*sz; }
  x.restore();
  const top=label(CX,head,sz,u,rank,a); S.anchor.set(s.id,toScreen({x:CX,y:top},camK(t)));
}
// băng rôn trên cùng (toạ độ màn hình): đè lên tên chùa trong lúc lễ

// ---------------- hiệu ứng pháp sự ----------------
let FT = 0, inFrame = false;            // giờ của khung đang vẽ: hiệu ứng bắt đầu giữa khung không được "ở tương lai"
function ritualFx(m, quiet){
  const t=inFrame?FT:now(), r=S.rituals.find(r=>r.key===m.key)||{key:'sen',name:'Lễ Phật'};
  S.hot.set(m.key,t);
  const p=S.anchor.get(m.id)||{x:CX,y:900};
  if (m.key==='den') { S.lampNew=t; bell(.07,523); S.floats.push({t,x:CX,y:880,icon:'den',text:'+1 đèn lưu ly',size:18}); }
  if (m.key==='cauan') { S.lanterns.push({t,x:CX+(Math.random()<.5?-1:1)*(85+Math.random()*45),name:m.name}); /* bay 2 bên tượng, không che mặt Phật */ bell(.1,392); }
  // quẻ xăm + thỉnh chuông chiếm giữa màn hình: xếp hàng lần lượt (tối đa 4 chờ)
  if (m.key==='xinxam' && m.que) S.bigQ.push({k:'que',name:m.name,...m.que});
  if (m.key==='chuong') S.bigQ.push({k:'bell',name:m.name});
  if (S.bigQ.length>4) S.bigQ.splice(0,S.bigQ.length-4);
  if (m.key!=='xinxam' && !quiet) S.toasts.push({t,icon:r.key,l1:`${m.name} · ${r.name}`,l2:m.gift?`Thành tâm dâng ${m.gift} kính lễ Đức Phật`:'Nam mô A Di Đà Phật'});
  if (m.points) S.floats.push({t,x:p.x,y:p.y,text:'+'+m.points+' công đức',size:18});
}

// ---------------- khung hình ----------------
function frame(){
  const t = now(); FT = t; inFrame = true;
  x.setTransform(SC,0,0,SC,0,0);
  stageTick(t); const K=camK(t), ca=1-K;   // K: 0 toàn cảnh → 1 cận bàn thờ; ca: độ hiện của đại chúng
  x.save(); if(K) camOn(K);
  blit(BACK,0,0);
  // hào quang tượng Phật thở nhẹ + tia sáng
  const pulse = 1 + Math.sin(t/1500)*.05;
  x.save();x.globalCompositeOperation='lighter';
  glow(HALO.x,HALO.y,120*pulse,'rgba(255,214,120,.30)','rgba(255,170,60,0)');
  x.translate(HALO.x,HALO.y);x.rotate(t/80000);
  for(let i=0;i<20;i++){x.rotate(Math.PI/10);x.fillStyle=`rgba(255,210,120,${i%2?.02:.045})`;x.beginPath();x.moveTo(0,0);x.lineTo(-16,-230);x.lineTo(16,-230);x.closePath();x.fill();}
  x.restore();
  // khói trầm từ lư hương
  if (S.smoke.length < 14 && Math.random() < .08) S.smoke.push({ t, x: CX + (Math.random()-.5)*8, ph: Math.random()*6 });
  S.smoke = S.smoke.filter(p => t - p.t < 7000);
  S.smoke.forEach(p => { const k=(t-p.t)/7000; const yy=800-k*230, xx=p.x+Math.sin(k*5+p.ph)*16*k; glow(xx,yy,10+k*26,`rgba(235,225,210,${.16*(1-k)})`,'rgba(235,225,210,0)'); });
  // hạt vàng quanh tượng
  while(S.sparks.length<26)S.sparks.push({x:CX+(Math.random()-.5)*300,y:860-Math.random()*420,v:.2+Math.random()*.45,ph:Math.random()*6,r:1+Math.random()*2});
  S.sparks.forEach(p=>{p.y-=p.v;p.x+=Math.sin(t/900+p.ph)*.25;const a=.3+.6*Math.abs(Math.sin(t/500+p.ph));glow(p.x,p.y,p.r*4,`rgba(255,236,170,${a})`,'rgba(255,200,90,0)');});
  S.sparks=S.sparks.filter(p=>p.y>380);
  // đèn lưu ly đã thắp
  const den=(S.rituals.find(r=>r.key==='den')||{}).count||0, nl=Math.min(LAMPS.length,den);
  for(let i=0;i<nl;i++){const L=LAMPS[i],fl=.85+.15*Math.sin(t/120+i*1.7),isNew=i===nl-1&&t-S.lampNew<1500;
    glow(L.x,L.y-6,(isNew?26:13)*fl,'rgba(255,200,90,.75)','rgba(255,160,40,0)');
    x.fillStyle=lg(L.x-5,0,L.x+5,0,[[0,'#8a5a14'],[.5,'#f6cf6a'],[1,'#8a5a14']]);x.beginPath();x.moveTo(L.x-5,L.y-3);x.lineTo(L.x+5,L.y-3);x.lineTo(L.x+3,L.y+2);x.lineTo(L.x-3,L.y+2);x.closePath();x.fill();
    x.fillStyle='#fff3c0';x.beginPath();x.ellipse(L.x,L.y-8,2.2,4.5*fl,0,0,7);x.fill();}

  // ---- Phật tử: gom, xếp theo chiều sâu, vẽ thân trước, nhãn sau ----
  const items=[];
  const add=(u,home,rank)=>{
    if(S.st&&S.st.id===u.id) return;      // đang ở trên chánh điện
    const a=S.acts.get(u.id); let st=a?actState(u.id,a,t,home):null;

let AC, master, bgGain, voiceGain;
let BGM;
function audioInit(){
  if (AC) return; AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = .8; master.connect(AC.destination);
  bgGain = AC.createGain(); bgGain.gain.value = .55; bgGain.connect(master);
  voiceGain = AC.createGain(); voiceGain.gain.value = 1.6; voiceGain.connect(master);
  [[196,.05],[196.8,.04],[392.5,.018],[587,.008]].forEach(([f,v])=>{const o=AC.createOscillator();o.frequency.value=f;const g=AC.createGain();g.gain.value=v;
    const l=AC.createOscillator();l.frequency.value=.07+Math.random()*.05;const lg2=AC.createGain();lg2.gain.value=v*.6;l.connect(lg2);lg2.connect(g.gain);l.start();o.connect(g);g.connect(bgGain);o.start();});
  let next = AC.currentTime + .5; setInterval(()=>{ while(next < AC.currentTime + .6){ moAt(next,.35); next += 1.15; } }, 200);
  setInterval(()=>bell(.07, 523), 16000);
  // nhạc nền lặp (Án Ma Ni Bát Di Hồng): public/audio/nen.mp3, phát dạng luồng; đi qua bgGain nên tự nhỏ lại khi giọng đọc phát
  BGM = new Audio('/audio/nen.mp3'); BGM.loop = true;
  const bs = AC.createMediaElementSource(BGM), bg2 = AC.createGain(); bg2.gain.value = .8; bs.connect(bg2); bg2.connect(bgGain);
  BGM.play().catch(()=>{});
  if (AC.state === 'suspended' && !/[?&]shot/.test(location.search)) document.getElementById('tap').style.display = 'flex';
}
function moAt(when, vol){
  const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(820,when);o.frequency.exponentialRampToValueAtTime(520,when+.06);
  const g=AC.createGain();g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vol,when+.004);g.gain.exponentialRampToValueAtTime(.001,when+.16);
  const n=AC.createBufferSource();const b=AC.createBuffer(1,AC.sampleRate*.05,AC.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  n.buffer=b;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1200;bp.Q.value=3;const ng=AC.createGain();ng.gain.value=vol*.6;
  o.connect(g);g.connect(bgGain);n.connect(bp);bp.connect(ng);ng.connect(bgGain);o.start(when);o.stop(when+.2);n.start(when);
}
function mo(){ if(AC) moAt(AC.currentTime+.01,.6); }
function bell(vol=.5, f=196){
  if(!AC) return; const t0=AC.currentTime;
  [[1,1],[2.76,.5],[5.4,.25],[8.93,.12],[.5,.35]].forEach(([m,v])=>{const o=AC.createOscillator();o.frequency.value=f*m;const g=AC.createGain();
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol*v,t0+.01);g.gain.exponentialRampToValueAtTime(.0005,t0+(m<1?9:7/m+1.5));o.connect(g);g.connect(master);o.start(t0);o.stop(t0+10);});
}
function duck(on){ if(!AC) return; bgGain.gain.cancelScheduledValues(AC.currentTime); bgGain.gain.linearRampToValueAtTime(on?.18:.55, AC.currentTime+.3); }
async function speak(m){
  const ack = () => ws && ws.readyState===1 && ws.send(JSON.stringify({t:'spoken',id:m.id}));
  if (!m.url || !AC) { setTimeout(ack, 1200 + m.text.length*55); return; }
  try {
    const buf = await (await fetch(m.url)).arrayBuffer();
    const ab = await AC.decodeAudioData(buf);
    const src = AC.createBufferSource(); src.buffer = ab; src.connect(voiceGain);
    duck(true); src.onended = () => { duck(false); ack(); }; src.start();
  } catch (e) { console.warn('voice', e); ack(); }
}

  ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?p='+PLATFORM);
  ws.onmessage = e => handle(JSON.parse(e.data));
  // báo cỡ khung thật về server (đọc ở log) để biết nguồn Link / OBS đang vẽ ở độ phân giải nào
  ws.onopen = hello;
  ws.onclose = () => setTimeout(connect, 2000);
}
function arrive(id,t){ // người mới có chỗ: đi dọc thảm vào chỗ (tối đa 6 người đi cùng lúc, còn lại hiện dần)
  if (S.acts.has(id)) return;
  if (countActs('join') < 6) startAct(id,'join'); else S.joins.set(id,t);
}
function handle(m){
  const t = now();
  if (m.id && (m.t==='chat'||m.t==='like'||m.t==='gift'||m.t==='ritual')) S.active.set(m.id,t);   // người vừa tương tác: ứng viên được mời lên chánh điện
  switch(m.t){
    case 'snapshot':
      Object.assign(S,{temple:m.temple||S.temple,ticker:m.ticker||'',seats:m.seats,top:m.top,next:m.next||[],niem:m.niem,likes:m.likes||0,stageMin:m.stageMin||0});
      if (m.rituals) S.rituals = m.rituals;
      buildStatic(); break;
    case 'seats': { const old=new Set(S.seats.filter(Boolean).map(s=>s.id)); S.seats=m.seats; m.seats.forEach(s=>{if(s&&!old.has(s.id))arrive(s.id,t);}); break; }
    case 'top': {
      const was=S.top[0]&&S.top[0].id; S.top=m.top; S.next=m.next||[];
      // Top 1 mới: tiến lên chánh điện cùng 2 người theo hầu
      if (m.top[0] && m.top[0].id!==was) startAct(m.top[0].id,'join',{proc:true});
      break; }
    case 'rituals': S.rituals=m.rituals; break;
    case 'ritual': {
      // pháp sự do tặng quà: làm lúc người đó lạy trên chánh điện
      if (m.via==='gift') {
        if (S.st&&S.st.id===m.id) { if(!S.st.fired) S.st.rit=m; else ritualFx(m,true); break; }
        const q=S.stage.find(s=>s.id===m.id); if (q) { q.rit=m; break; }
      }
      // vắng khách: pháp sự bằng chat / chia sẻ / quà nhỏ cũng được lên chánh điện cho cảnh luôn có người lạy
      if (stageQuiet(t)) { S.stage.push({id:m.id,name:m.name,avatar:m.avatar,count:0,points:0,rit:m}); break; }
      const a=S.acts.get(m.id);
      if (homeOf(m.id) && (!a || a.k==='join') && countActs('rit') < 3) startAct(m.id,'rit',{m});
      else { S.bows.set(m.id,t); ritualFx(m); }
      break; }
    case 'niem': S.niem=m.n; break;
    case 'chat':
      if (m.niem) { S.bows.set(m.id,t); mo(); const p=S.anchor.get(m.id); if(p&&Math.random()<.5) S.floats.push({t,x:p.x,y:p.y,icon:'sen',text:'+1',size:15}); }
      if (m.text) S.bubbles.set(m.id,{text:m.text,t});
      break;
    case 'like': {
      // mọi lượt thả tim đều có phản hồi: tim bay từ chỗ người thả (chưa có chỗ thì từ góc số liệu), số tim nảy
      S.likes=m.total||S.likes; S.likeBoost += Math.min(m.count,10); S.likeHit=t;
      const p=S.anchor.get(m.id)||{x:PL.x+30,y:(S.statY||560)+30};
      for(let k=0;k<Math.min(5,1+Math.floor(m.count/3));k++) S.hearts.push({t:t+k*120,x:p.x+(Math.random()-.5)*16,y:p.y,s:13+Math.random()*7,ph:Math.random()*6});
      if(S.hearts.length>60) S.hearts.splice(0,S.hearts.length-60);
      S.floats.push({t,x:p.x,y:p.y-6,icon:'tim',text:'+'+m.count,size:15});
      break; }
    case 'gift': { const p=S.anchor.get(m.id); if(p) S.floats.push({t,x:p.x,y:p.y,text:'+'+m.points+' công đức',size:18}); S.bows.set(m.id,t);
      // xếp hàng lên chánh điện; người đã đang chờ (hoặc đang lên, chưa lạy) thì cộng dồn quà
      const q=(S.st&&S.st.id===m.id&&!S.st.fired)?S.st:S.stage.find(s=>s.id===m.id);
      if (q) { q.count+=m.count; q.points+=m.points; q.gift=m.gift; }
      else if (m.stage!==false || stageQuiet(t)) { S.stage.push({id:m.id,name:m.name,avatar:m.avatar,gift:m.gift,count:m.count,points:m.points});
        if (S.stage.length>15) S.stage.splice(S.stage.reduce((mi,s,i,a)=>s.points<a[mi].points?i:mi,0),1); }   // quá đông: bỏ người quà nhỏ nhất
      break; }
    case 'speak': speak(m); break;
  }
}
