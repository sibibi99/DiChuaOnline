<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="google" content="notranslate">
<title>Lớp Học Vui</title>
<meta name="viewport" content="width=720">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Patrick+Hand&family=Be+Vietnam+Pro:ital,wght@0,500;0,700;0,800;1,600&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
  #tap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);
       color:#ffe9a8;font:bold 26px "Be Vietnam Pro",Arial,sans-serif;cursor:pointer;text-align:center}
</style></head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<div id="tap">Bấm để bật âm thanh 🎵<br><small style="font-size:15px">(trong LIVE Studio / OBS sẽ tự bật)</small></div>
<script>
'use strict';
// LỚP HỌC VUI (game/lop-hoc): lớp học 2D. Bình luận = vào lớp ngồi (4 hàng × 7 bàn, hàng đầu = bàn đầu), cô giáo dẫn các tiết học
// (điểm danh, đố vui A/B/C/D, toán nhẩm + chính tả, ra chơi nhảy dây, kể chuyện, tổng kết), quà = sao / giấy khen / bàn đầu / Sổ vàng.
// Tham số link nguồn: ?music=synth|off ép nhạc · ?scale=2 ép độ nét
const W = 720, H = 1280, CX = 360;
const Q = new URLSearchParams(location.search);
const c = document.getElementById('c'); let x = c.getContext('2d');
let SC = 1;
function pickScale(){ const q = +Q.get('scale'); const v = q || Math.min(innerWidth / 720, innerHeight / 1280) * (window.devicePixelRatio || 1);
  return Math.min(2, Math.max(1, Math.ceil(v * 4) / 4)); }
function applyScale(){ SC = pickScale(); c.width = 720 * SC; c.height = 1280 * SC; }
applyScale();
const PLATFORM = location.pathname.split('/').filter(Boolean)[0] || 'tiktok';
const SANS = '"Be Vietnam Pro","DejaVu Sans",Arial,sans-serif', SIGN = '"Lobster","Be Vietnam Pro",serif', CHALK = '"Patrick Hand","Be Vietnam Pro",sans-serif';
const RED='#d6343b', GOLD='#ffc83d', INK='#3a2a1a', GREEN='#1f5a3c', CREAM='#fff6df';
const AV = ['#e57373','#64b5f6','#81c784','#ffb74d','#ba68c8','#4db6ac','#f06292','#a1887f'];
const now = () => performance.now();
const hash = s => { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return h >>> 0; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const ease = k => k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
const fmt = n => Number(n||0).toLocaleString('vi-VN');

// ---------------- vẽ cơ bản ----------------
function rr(a,b,w,h,q){x.beginPath();x.moveTo(a+q,b);x.arcTo(a+w,b,a+w,b+h,q);x.arcTo(a+w,b+h,a,b+h,q);x.arcTo(a,b+h,a,b,q);x.arcTo(a,b,a+w,b,q);x.closePath();}
function lg(x0,y0,x1,y1,st){const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function rg(cx,cy,r0,r1,st){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function glow(cx,cy,r,a,b){x.fillStyle=rg(cx,cy,0,r,[[0,a],[1,b]]);x.beginPath();x.arc(cx,cy,r,0,7);x.fill();}
function txt(t,X,Y,font,fill,align='center',stroke,o={}){x.save();x.font=font;x.textAlign=align;if(o.sp&&'letterSpacing' in x)x.letterSpacing=o.sp+'px';if(o.sh){x.shadowColor=o.sh[0];x.shadowBlur=o.sh[1];}
  if(o.a!=null)x.globalAlpha=o.a;if(stroke){x.lineJoin='round';x.lineWidth=stroke[1];x.strokeStyle=stroke[0];x.strokeText(t,X,Y);}x.fillStyle=fill;x.fillText(t,X,Y);x.restore();}
function fit(t,max,size,fam,wt='800'){let s=size;do{x.font=`${wt} ${s}px ${fam}`;}while(x.measureText(t).width>max&&--s>8);return x.font;}
const short = (n,k=9) => [...String(n)].length>k ? [...String(n)].slice(0,k-1).join('')+'…' : String(n);
function wrap(t,maxW,font){ x.font=font; const out=[]; let cur=''; for(const w of String(t).split(/\s+/)){ const n=cur?cur+' '+w:w; if(x.measureText(n).width>maxW&&cur){out.push(cur);cur=w;} else cur=n; } if(cur) out.push(cur); return out; }
function layer(){ const cv=document.createElement('canvas'); cv.width=720*SC; cv.height=1280*SC; return cv; }
function paint(cv, fn){ const old=x; x=cv.getContext('2d'); x.setTransform(SC,0,0,SC,0,0); x.clearRect(0,0,W,H); fn(); x=old; }
function blit(cv){ x.drawImage(cv,0,0,W,H); }
// chữ phấn trên bảng
function chalk(t,X,Y,size,col='#f4fbf4',align='center',wt=''){ x.save(); x.font=`${wt} ${size}px ${CHALK}`; x.textAlign=align; x.fillStyle=col; x.globalAlpha=.96; x.shadowColor='rgba(255,255,255,.35)'; x.shadowBlur=2; x.fillText(t,X,Y); x.restore(); }

// ảnh đại diện (TikTok trả link ảnh); chưa tải xong thì vẽ chữ cái đầu
const AVC = new Map();
function avatarImg(url){ if (!url) return null; let a = AVC.get(url);
  if (!a) { a = { img: new Image(), ok: false }; a.img.onload = () => a.ok = true; a.img.src = url; AVC.set(url, a); if (AVC.size > 300) AVC.delete(AVC.keys().next().value); }
  return a.ok ? a.img : null; }
function head(X,Y,r,u,ring='#fff'){
  const im=avatarImg(u.avatar), h=hash(u.id||u.name);
  if (im) { x.save(); x.beginPath(); x.arc(X,Y,r,0,7); x.clip(); x.drawImage(im,X-r,Y-r,2*r,2*r); x.restore(); }
  else { x.fillStyle=AV[h%AV.length]; x.beginPath(); x.arc(X,Y,r,0,7); x.fill(); txt(([...(u.name||'?')][0]||'?').toUpperCase(),X,Y+r*.38,`800 ${Math.round(r*1.05)}px ${SANS}`,'#fff'); }
  x.lineWidth=Math.max(1.5,r*.13); x.strokeStyle=ring; x.beginPath(); x.arc(X,Y,r,0,7); x.stroke();
}
const TIMG = new Image(); TIMG.src = '/img/co-giao.png';

// ---------------- hình nhỏ ----------------
function star(X,Y,r,rot=0,fill=GOLD,line='#c98a00'){ x.save(); x.translate(X,Y); x.rotate(rot); x.beginPath();
  for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr_=i%2?r*.45:r; x.lineTo(Math.cos(a)*rr_,Math.sin(a)*rr_); } x.closePath();
  x.fillStyle=fill; x.fill(); x.lineWidth=Math.max(1,r*.12); x.strokeStyle=line; x.lineJoin='round'; x.stroke(); x.restore(); }
function heart(X,Y,s,cl='#ff5a8a'){ x.save(); x.translate(X,Y); x.scale(s,s); x.fillStyle=cl; x.beginPath(); x.moveTo(0,5); x.bezierCurveTo(-12,-3,-6,-12,0,-5); x.bezierCurveTo(6,-12,12,-3,0,5); x.fill(); x.restore(); }
function crown(X,Y,s){ x.save(); x.translate(X,Y); x.scale(s,s); x.fillStyle='#ffd23f'; x.strokeStyle='#b8860b'; x.lineWidth=1.2; x.beginPath();
  x.moveTo(-11,6); x.lineTo(-13,-6); x.lineTo(-6,0); x.lineTo(0,-9); x.lineTo(6,0); x.lineTo(13,-6); x.lineTo(11,6); x.closePath(); x.fill(); x.stroke();
  x.fillStyle='#e0473c'; x.beginPath(); x.arc(0,1,1.8,0,7); x.fill(); x.restore(); }
function cap(X,Y,s,rot){ x.save(); x.translate(X,Y); x.rotate(rot); x.scale(s,s); x.fillStyle='#222'; x.beginPath(); x.moveTo(-14,-2); x.lineTo(0,-8); x.lineTo(14,-2); x.lineTo(0,4); x.closePath(); x.fill();
  x.fillStyle='#333'; x.fillRect(-7,3,14,6); x.strokeStyle=GOLD; x.lineWidth=1.6; x.beginPath(); x.moveTo(10,-2); x.lineTo(13,9); x.stroke(); x.restore(); }
function flame(X,Y,s){ x.save(); x.translate(X,Y); x.scale(s,s); x.fillStyle='#ff8a1f'; x.beginPath(); x.moveTo(0,-9); x.bezierCurveTo(8,-2,7,8,0,8); x.bezierCurveTo(-7,8,-8,-1,0,-9); x.fill();
  x.fillStyle='#ffd23f'; x.beginPath(); x.moveTo(0,-2); x.bezierCurveTo(4,2,3,7,0,7); x.bezierCurveTo(-3,7,-4,3,0,-2); x.fill(); x.restore(); }
function flower(X,Y,r,cl){ x.fillStyle=cl; for(let i=0;i<5;i++){ const a=i*Math.PI*2/5; x.beginPath(); x.arc(X+Math.cos(a)*r*.7,Y+Math.sin(a)*r*.7,r*.62,0,7); x.fill(); } x.fillStyle='#ffe066'; x.beginPath(); x.arc(X,Y,r*.45,0,7); x.fill(); }

// ---------------- bố cục ----------------
const BOARD = { x: 66, y: 126, w: 588, h: 300 };
const TEACH_X = 150, TEACH_FY = 742, TEACH_H = 318;
const ROWYH = [890, 978, 1068, 1158], ROWS_S = [.76, .85, .94, 1.03], PER = 7, NSEAT = 28;
const seatXY = i => { const r = Math.floor(i / PER), k = i % PER; return { x: 60 + k * 100, y: ROWYH[r], s: ROWS_S[r], r }; };
const LVCOL = ['#90a4ae','#66bb6a','#42a5f5','#ab47bc','#ffca28','#ff5a8a'], LVNAME = ['Học sinh mới','Chăm ngoan','Học sinh giỏi','Học sinh xuất sắc','Thủ khoa','Gương sáng'];
const TEAMCOL = ['#ef5350','#42a5f5','#43a047','#ffa726'], HCOL = ['#42a5f5','#66bb6a','#ffa726','#ff5a8a','#8e6bd8','#26a69a'];
const ABC = ['#ef5350','#42a5f5','#66bb6a','#ffa726'];

// ---------------- trạng thái ----------------
const S = { scene: { id: 'sang', name: '' }, trans: null, banner: null, fxp: {}, seats: new Array(NSEAT).fill(null), pos: new Map(), top: [], book: [], lt: null, likes: 0, goal: { n: 0, target: 100 },
  seg: { key: 'diemdanh', name: '', sub: '', end: Date.now(), next: '', idx: 0, total: 6 }, q: null, qend: null, recess: { n: 0, target: 40, done: false }, jumpUntil: 0,
  hoa: 0, tri: false, sess: [], story: null, tk: null, dd: [], wait: { size: 0, list: [] }, teams: { tp: [0,0,0,0], tps: [0,0,0,0] }, hbQ: [], hb: null, donors: [], game: null, rong: [], vote: null, fwQ: [], spark: [],
  bubbles: new Map(), cheer: new Map(), nudge: new Map(), floats: [], strip: null, hearts: [], stars: [], conf: [], toast: null, big: null, bigQ: [], say: null, tAct: null, ticker: '',
  ans: new Map(), last: now() };
const at = id => { const p = S.pos.get(id); return p ? { x: p.x, y: p.y } : { x: CX, y: 1000 }; };
const lit = (u, t) => (u.act || 0) > Date.now() - 900000 || (S.nudge.get(u.id) || 0) > t;
const stage = () => S.seg.key;
function act(k, ms=2600){ S.tAct = { k, t0: now(), until: now() + ms }; }
function conf(n, X, Y, spread=300, up=1){ const cols=['#ef5350','#42a5f5','#66bb6a','#ffca28','#ab47bc','#ff7043','#26c6da'];
  for(let i=0;i<n;i++) S.conf.push({ x: X + (Math.random()-.5)*spread, y: Y, vx: (Math.random()-.5)*5, vy: -(Math.random()*9+3)*up, r: Math.random()*6, vr: (Math.random()-.5)*.4, c: cols[i%cols.length], w: 7+Math.random()*7, a: 1 });
  if (S.conf.length > 260) S.conf.splice(0, S.conf.length - 260); }
function caps(X, Y){ for(let i=0;i<9;i++) S.conf.push({ cap: true, x: X + (Math.random()-.5)*420, y: Y, vx: (Math.random()-.5)*4, vy: -(Math.random()*11+8), r: Math.random()*6, vr: (Math.random()-.5)*.3, w: 1+Math.random()*.5, a: 1 }); }
function fireworks(n, t0){ const cols=['#ff5a8a','#ffd23f','#42a5f5','#66bb6a','#ff9a3d','#ba68c8','#fff'];
  for(let i=0;i<n;i++) S.fwQ.push({ t: t0 + i*330, x: 80 + Math.random()*560, y: 190 + Math.random()*380, c: cols[i%cols.length] }); }
function petals(n){ for(let i=0;i<n;i++) S.conf.push({ petal: true, x: Math.random()*W, y: -10 - Math.random()*120, vx: (Math.random()-.5)*1.4, vy: 1 + Math.random()*1.6, r: Math.random()*6, vr: (Math.random()-.5)*.12, w: 9+Math.random()*6, a: 3.2, c: ['#ffc1d6','#ff9ac0','#ffe0ea','#ffb3cf'][i%4] }); }
function float(id, text, cl='#fff', size=16, dy=0){ const p = at(id), tt = now(), k = S.floats.filter(f => f.id === id && tt - f.t < 1600).length; S.floats.push({ t: tt, id, x: p.x, y: p.y - 40 + dy - k * 22, text, cl, size }); if (S.floats.length > 40) S.floats.shift(); }
function toast(text, cl=CREAM){ S.toast = { text, cl, t: now() }; }

// ---------------- BỐI CẢNH lớp học (server chọn, mọi khung đồng bộ) ----------------
// Mỗi cảnh = nền vẽ bằng code (tường, cửa sổ, đồ treo tường, sàn, ánh sáng) + vài hiệu ứng nhẹ động. Bảng, cô, bàn cô, dải xếp hạng, hàng bàn giữ nguyên chỗ.
// Nếu có public/img/lh-nen-<id>.jpg thì dùng ảnh đó làm nền (cover 720×1280, vẽ dưới bảng / cô / bàn) thay cho nền code của cảnh đó.
let BG;
const IDS = ['sang','hoanghon','dem','mua','thu','xuan','dong','thinghiem','thuvien','santruong'];
const IMGS = {};
function loadSceneImages(){ for (const id of IDS) { const o = IMGS[id] = { img: new Image(), ok: false };
  o.img.onload = () => { o.ok = true; if (S.scene.id === id) buildStatic(); }; o.img.onerror = () => { o.ok = false; }; o.img.src = `/img/lh-nen-${id}.jpg`; } }
const sr = i => { const v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };       // số "ngẫu nhiên" cố định cho đồ trang trí
const GLASS = [505, 455, 172, 188];                                                                       // ô kính cửa sổ bên phải (hiệu ứng mưa / tuyết / chim bay trong ô này)
const SCN = {};
function wallBase(c1, c2, pat, pc){
  x.fillStyle = lg(0,0,0,748,[[0,c1],[1,c2]]); x.fillRect(0,0,W,748);
  if (pat === 'stripe') { x.fillStyle = pc || 'rgba(255,255,255,.28)'; for (let i=0;i<9;i++) x.fillRect(i*84,0,3,748); }
  else if (pat === 'panel') { x.fillStyle = pc || 'rgba(0,0,0,.2)'; for (let i=0;i<10;i++) x.fillRect(i*72,0,3,748); }
  else if (pat === 'dots') { x.fillStyle = pc || 'rgba(255,255,255,.2)'; for (let yy=20, r=0; yy<748; yy+=44, r++) for (let xx=(r%2)*22+10; xx<W; xx+=44) { x.beginPath(); x.arc(xx,yy,3,0,7); x.fill(); } }
  else if (pat === 'tile') { x.strokeStyle = pc || 'rgba(255,255,255,.6)'; x.lineWidth = 2; for (let xx=0; xx<W; xx+=60) { x.beginPath(); x.moveTo(xx,440); x.lineTo(xx,748); x.stroke(); } for (let yy=440; yy<748; yy+=60) { x.beginPath(); x.moveTo(0,yy); x.lineTo(W,yy); x.stroke(); } }
  x.fillStyle = lg(0,0,0,26,[[0,'rgba(120,70,20,.35)'],[1,'rgba(120,70,20,0)']]); x.fillRect(0,0,W,26);
}
function floorBase(kind, c1, c2, pc){
  x.fillStyle = lg(0,748,0,H,[[0,c1],[1,c2]]); x.fillRect(0,748,W,H-748);
  if (kind === 'wood') {
    x.strokeStyle = pc || 'rgba(110,60,20,.28)'; x.lineWidth = 1.5; for (let y=760, d=14; y<H; y+=d, d+=3) { x.beginPath(); x.moveTo(0,y); x.lineTo(W,y); x.stroke(); }
    x.strokeStyle = 'rgba(110,60,20,.16)'; for (let y=760, d=14, r=0; y<H; y+=d, d+=3, r++) for (let i=0;i<3;i++) { const px = ((i*263 + r*131) % 760) - 20; x.beginPath(); x.moveTo(px,y); x.lineTo(px,y+d); x.stroke(); }
    x.fillStyle = 'rgba(255,230,170,.10)'; for (let y=760, d=14, r=0; y<H; y+=d, d+=3, r++) if (r % 2) x.fillRect(0,y,W,d);
  } else if (kind === 'checker') {
    x.fillStyle = 'rgba(255,255,255,.28)'; for (let y=748, d=14, r=0; y<H; y+=d, d+=3, r++) for (let c=0;c<9;c++) if ((r+c)%2) x.fillRect(c*80,y,80,d);
  } else if (kind === 'carpet') {
    x.fillStyle = 'rgba(255,215,120,.16)'; for (let yy=790, r=0; yy<H; yy+=64, r++) for (let xx=(r%2)*40; xx<W; xx+=80) { x.beginPath(); x.moveTo(xx,yy-14); x.lineTo(xx+14,yy); x.lineTo(xx,yy+14); x.lineTo(xx-14,yy); x.closePath(); x.fill(); }
    x.strokeStyle = 'rgba(255,215,120,.55)'; x.lineWidth = 4; x.beginPath(); x.moveTo(0,764); x.lineTo(W,764); x.stroke();
  } else if (kind === 'sand') {
    x.strokeStyle = pc || 'rgba(120,90,40,.22)'; x.lineWidth = 1.5; for (let y=760, d=22, r=0; y<H; y+=d, d+=4, r++) { x.beginPath(); x.moveTo(0,y); x.lineTo(W,y); x.stroke(); for (let px=(r%2)*55; px<W; px+=110) { x.beginPath(); x.moveTo(px,y); x.lineTo(px,y+d); x.stroke(); } }
  }
  x.fillStyle = lg(0,740,0,770,[[0,'rgba(90,50,20,.45)'],[1,'rgba(90,50,20,0)']]); x.fillRect(0,740,W,30);
  x.fillStyle = '#8a5a2b'; x.fillRect(0,736,W,12);
}
function windowAt(X, Y, w, h, sky, fr){
  const m = 9, gx = X+m, gy = Y+m, gw = w-2*m, gh = h-2*m; fr = fr || '#f6ead2';
  x.save(); x.shadowColor = 'rgba(60,30,10,.35)'; x.shadowBlur = 14; x.shadowOffsetY = 5; x.fillStyle = fr; rr(X,Y,w,h,10); x.fill(); x.restore();
  x.save(); rr(gx,gy,gw,gh,5); x.clip(); sky(gx,gy,gw,gh); x.restore();
  x.strokeStyle = fr; x.lineWidth = 7; x.beginPath(); x.moveTo(gx+gw/2,gy); x.lineTo(gx+gw/2,gy+gh); x.moveTo(gx,gy+gh*.5); x.lineTo(gx+gw,gy+gh*.5); x.stroke();
  x.fillStyle = '#e4cfa2'; rr(X-8,Y+h-4,w+16,12,4); x.fill();
}
const skyG = (gx, gy, gw, gh, st) => { x.fillStyle = lg(0,gy,0,gy+gh,st); x.fillRect(gx,gy,gw,gh); };
function cloud(cx, cy, s, col){ x.fillStyle = col || 'rgba(255,255,255,.92)'; [[0,0,22],[24,-9,28],[54,0,22],[28,9,24]].forEach(([dx,dy,r]) => { x.beginPath(); x.arc(cx+dx*s,cy+dy*s,r*s,0,7); x.fill(); }); }
function curtain(side, c1, c2){ const X = side ? 670 : 0, w = 50; x.fillStyle = lg(X,0,X+w,0,[[0,side?c2:c1],[1,side?c1:c2]]); x.fillRect(X,98,w,350);
  x.fillStyle = 'rgba(255,255,255,.14)'; for (let i=0;i<4;i++) x.fillRect(X+6+i*12,98,5,350); x.fillStyle = 'rgba(0,0,0,.10)'; for (let i=0;i<4;i++) x.fillRect(X+11+i*12,98,3,350);
  x.fillStyle = '#8a5a26'; x.fillRect(X,94,w,8); }
function plant(px, py, s, leaf, pot){ x.fillStyle = pot || '#b5651d'; rr(px-15*s,py-28*s,30*s,28*s,4*s); x.fill(); x.fillStyle = leaf || '#43a047';
  [[-18,-.7],[0,0],[18,.7],[-8,-.3],[8,.3]].forEach(([dx,r]) => { x.save(); x.translate(px+dx*s*.35,py-28*s); x.rotate(r); x.beginPath(); x.ellipse(0,-34*s,9*s,32*s,0,0,7); x.fill(); x.restore(); }); }
function poster(px, py, w, h, paper, fn){ x.save(); x.shadowColor = 'rgba(0,0,0,.25)'; x.shadowBlur = 6; x.shadowOffsetY = 3; x.fillStyle = paper || '#fffdf3'; rr(px,py,w,h,5); x.fill(); x.restore();

function noiseHit(w, type, f, peak, d, dest){ if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random()*2-1; }
  const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noiseBuf; fl.type = type; fl.frequency.value = f;
  g.gain.setValueAtTime(peak, w); g.gain.exponentialRampToValueAtTime(.0001, w + d); s.connect(fl); fl.connect(g); g.connect(dest || musBus); s.start(w, Math.random()*.5); s.stop(w + d + .02); }
function kick(w, peak){ const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(130, w); o.frequency.exponentialRampToValueAtTime(48, w + .11);
  g.gain.setValueAtTime(peak, w); g.gain.exponentialRampToValueAtTime(.0001, w + .2); o.connect(g); g.connect(musBus); o.start(w); o.stop(w + .22); }
function xylo(w, m, peak, d){ const f = mtof(m); tone(w, f, 'triangle', .002, peak, d || .3); tone(w, f*3, 'sine', .002, peak*.35, .1); }     // gõ thanh gỗ: attack rõ, đuôi ngắn
function pluck(w, m, peak){ tone(w, mtof(m), 'triangle', .003, peak, .28); }                                                                   // gảy mộc cầm
function startSynth(){
  if (synthOn) return; synthOn = true; nextT = AC.currentTime + .2;
  setInterval(() => { if (!AC || AC.state !== 'running') { nextT = Math.max(nextT, AC ? AC.currentTime : 0); return; }
    const key = S && S.seg && S.seg.key, play = key === 'rachoi', calm = key === 'ke', bpm = play ? 130 : calm ? 104 : 120;
    while (nextT < AC.currentTime + .3) { const beat = 60/bpm/2, pos = step % 32, bar = Math.floor(pos/8), k = pos % 8, w = nextT;
      if (pos === 0) { phr = Math.random() < .5 ? HC.A : HC.B;   // đoạn mới: chọn vòng hợp âm + giai điệu, không lặp lại giai điệu vừa chơi
        let mi; do { mi = Math.floor(Math.random()*phr.mel.length); } while (mi === lastMel[phr === HC.A ? 0 : 1] && phr.mel.length > 1); lastMel[phr === HC.A ? 0 : 1] = mi; cur = phr.mel[mi]; oct = Math.random() < .25 && !calm ? 12 : 0; }
      const g = calm ? .6 : play ? 1.15 : 1, bs = phr.bass[bar], ch = phr.chord[bar];

      if (k === 0 || k === 4) tone(w, mtof(bs[0]), 'triangle', .008, .11*g, .32); else if (k === 3 || k === 7 || (play && k === 6)) tone(w, mtof(bs[1]), 'triangle', .008, .08*g, .22);

      if (k === 0) ch.forEach((m, i) => pluck(w + i*.012, m, .018*g)); else if (k === 2 || k === 6) ch.forEach((m, i) => pluck(w + i*.012, m, .04*g));

}
function bell(){ if (!AC || !sfxOk('bell', 5000)) return; const w = AC.currentTime + .02; for (let i = 0; i < 7; i++) { [1180,1560].forEach(f => tone(w + i*.11, f, 'sine', .002, .12, .25, sfx)); } }
function ting(){ if (!AC || !sfxOk('ting', 1200)) return; const w = AC.currentTime + .01; [1320,1760,2093].forEach((f,i) => tone(w + i*.07, f, 'sine', .002, .12, .45, sfx)); }

function duck(on){ if(!AC) return; bgGain.gain.cancelScheduledValues(AC.currentTime); bgGain.gain.linearRampToValueAtTime(on?.14:.45, AC.currentTime+.3); sfx.gain.cancelScheduledValues(AC.currentTime); sfx.gain.linearRampToValueAtTime(on?.2:.55, AC.currentTime+.15); }   // cô đang nói: hiệu ứng nhỏ lại
async function speak(m){
  const ack = () => { if (S.say && S.say.id === m.id) S.say.end = now(); ws && ws.readyState===1 && ws.send(JSON.stringify({t:'spoken',id:m.id})); };
  S.say = { id: m.id, text: m.text, t: now(), end: 0, k: m.meta && m.meta.k, title: m.meta && m.meta.title };
  if (m.kind === 'gift' && /^Cảm ơn/.test(m.text)) act('camon', 3600); else if (/Nhanh nhất là|tung mũ|Tung mũ|nhảy dây thôi/.test(m.text)) act('khen', 3200); else if (/Cô thưởng|Hạng nhất|Đáp án là/.test(m.text)) act('khen', 2200);
  if (!m.url || !AC) { setTimeout(ack, 1200 + m.text.length*55); return; }
  try { const ab = await AC.decodeAudioData(await (await fetch(m.url)).arrayBuffer());
    const src = AC.createBufferSource(); src.buffer = ab; src.connect(voiceGain); duck(true); src.onended = () => { duck(false); ack(); }; src.start();
  } catch (e) { console.warn('voice', e); ack(); }
}

// ---------------- kết nối server ----------------
let ws; const UIVER = '__UIVER__'; let reloading = false;
function checkVer(v){ if (!v || v === UIVER || UIVER.startsWith('__') || reloading) return; reloading = true; setTimeout(() => location.reload(), 1500 + Math.random() * 1500); }
function hello(){ if (ws && ws.readyState===1) ws.send(JSON.stringify({ t:'hello', w:innerWidth, h:innerHeight, dpr:window.devicePixelRatio||1, sc:SC, ver:UIVER, ua:navigator.userAgent.slice(0,120) })); }
function connect(){ ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?p='+PLATFORM);
  ws.onmessage = e => handle(JSON.parse(e.data)); ws.onopen = hello; ws.onclose = () => setTimeout(connect, 2000); }
function setSeg(g){ S.seg = { ...g, end: Date.now() + (g.left || 0), tot: g.left || 1 }; }
function setQ(q){ S.q = q && { ...q, end: Date.now() + q.left }; }
function setSeats(a){ S.seats = a; const keep = new Set(a.filter(Boolean).map(u => u.id)); for (const id of S.pos.keys()) if (!keep.has(id)) S.pos.delete(id); }
function handle(m){
  const t = now();
  switch (m.t) {
    case 'ver': checkVer(m.ver); break;
    case 'snapshot': checkVer(m.ver); setSeats(m.seats); Object.assign(S, { top: m.top || [], book: m.book || [], lt: m.lt || null, likes: m.likes || 0, goal: m.goal || S.goal, hoa: m.hoa || 0, shareDay: m.sd || 0, tri: !!m.tri, sess: m.sess || [], ticker: m.ticker || '', recess: m.recess || S.recess, wait: m.wait || S.wait, teams: m.teams || S.teams });
      if (m.vote) S.vote = { phase: 'open', ...m.vote, endAt: Date.now() + (m.vote.left || 0), total: m.vote.left || 15000 }; if (m.scene) setScene(m.scene.id, m.scene.name, false); if (m.gs) handle(m.gs);
      if (m.seg) setSeg(m.seg); setQ(m.q); break;
    case 'seats': setSeats(m.seats); break;
    case 'top': S.top = m.top || []; S.book = m.book || S.book; S.lt = m.lt || null; break;
    case 'join': toast(`${short(m.name, 14)} vừa vào lớp`); pop(); break;
    case 'chat': if (m.text) S.bubbles.set(m.id, { text: m.text, t }); S.cheer.set(m.id, t + 500); break;
    case 'seg': setSeg(m.seg); S.q = null; S.qend = null; S.tk = null; if (m.seg.key !== 'dovui' && m.seg.key !== 'kt') S.vote = null; if (m.seg.key === 'diemdanh') S.dd = []; bell(); act('chao', 2600); break;
    case 'story': S.story = m.title; break;
    case 'q': setQ(m.q); S.qend = null; S.ans.clear(); pop(); act('point', 1800); break;
    case 'ans': { if (S.q) S.q.n = m.n; const p = at(m.id); S.floats.push({ t, x: p.x, y: p.y - 40, text: m.v, cl: m.v.length === 1 ? ABC['ABCD'.indexOf(m.v)] || '#fff' : '#fff', size: 22 }); S.cheer.set(m.id, t + 700); break; }
    case 'ok': float(m.id, '✓', '#9fe3b6', 24); break;
    case 'qend': { S.qend = m; if (S.q) S.q.done = true; (m.win || []).forEach((w, i) => { S.cheer.set(w.id, t + 3500); const p = at(w.id); if (w.ten) S.stars.push({ t: t + i * 200, x: p.x, y: p.y }); S.floats.push({ t, x: p.x, y: p.y - 70, text: `+${w.pts}`, cl: '#ffe27a', size: 20 }); });
      if (m.spot) { const sp = m.spot; float(sp.id, sp.ok ? 'Lên bảng: đúng! +8' : sp.answered ? 'Chưa đúng, cố lên nhé!' : 'Cô chờ bạn trả lời!', sp.ok ? '#ffe27a' : '#ffb199', 17, -64); }
      if (m.win && m.win.length) { ting(); act('khen', 3200); } else act('ngac', 2400); break; }
    case 'dd': S.dd.push({ name: m.name, streak: m.streak }); if (S.dd.length > 12) S.dd.shift(); S.cheer.set(m.id, t + 900); float(m.id, m.bonus ? `Chuỗi ${m.streak} ngày! +${m.bonus}` : 'Có mặt!', '#9fe3b6', 17); if (m.bonus) { conf(30, at(m.id).x, at(m.id).y, 120); ting(); } break;
    case 'recess': { const was = S.recess.done; S.recess = m; if (m.done && !was) { S.jumpUntil = t + 12000; S.bigQ.push({ k: 'jump', dur: 3200 }); caps(CX, 1000); ting(); act('khen', 4000); } break; }
    case 'tk': S.tk = m; S.sess = m.rows || S.sess; conf(50, CX, 800, 500); ting(); break;
    case 'scene': setScene(m.id, m.name, true); break;
    case 'vote': if (m.phase === 'off') S.vote = null; else { const { t: _vt, ...rest } = m; const first = !S.vote; S.vote = { ...(S.vote || {}), ...rest, endAt: Date.now() + (m.left || 0), total: first ? (m.left || 15000) : S.vote.total }; if (m.phase === 'res') { ting(); conf(30, CX, 640, 440); } else if (first) pop(); } break;
    case 'game': if (m.on) { S.game = { kind: m.kind, endAt: 0 }; if (m.kind === 'dragon') S.rong = []; } else { S.game = null; S.rong = []; } break;
    case 'rps': case 'tug': case 'hang': case 'count': { const { t: _mt, kind: ck, ...rest } = m; const g0 = S.game && S.game.kind === m.t ? S.game : {};
      S.game = { ...g0, ...rest, kind: m.t, endAt: Date.now() + (m.left || 0) }; if (m.t === 'count') S.game.kind2 = ck;
      if (m.phase === 'res') { if (m.t === 'rps' && m.win) pop(); if ((m.t === 'hang' || m.t === 'count') && m.win) { ting(); S.cheer.set(m.win.id, t + 2000); } }
      if (m.t === 'tug' && m.phase === 'end') { conf(40, CX, 700, 480); ting(); } break; }
    case 'rong': { if (m.list) S.rong = m.list.slice(); else if (m.add) { S.rong.push(m.add); if (S.rong.length > 80) S.rong.shift(); S.cheer.set(m.add.id, t + 800); }
      if (!S.game || S.game.kind !== 'dragon') S.game = { kind: 'dragon', endAt: 0 }; if (m.ms) { conf(40, CX, 620, 500); ting(); if (m.add) float(m.add.id, `${m.ms} khúc!`, '#ffe27a', 20); } break; }
    case 'kt': S.tk = { rows: m.rows || [], exam: true }; S.q = null; S.qend = null; if ((m.rows || []).length) { conf(40, CX, 800, 480); ting(); act('khen', 3000); } break;
    case 'spot': S.bigQ.push({ k: 'len', name: m.name, avatar: m.avatar, id: m.id, dur: 3000 }); S.cheer.set(m.id, t + 3000); act('point', 2400); break;
    case 'lb': float(m.id, m.full ? 'Hàng chờ đã đầy, thử lại sau nhé' : `Hàng chờ lên bảng: số ${m.pos}${m.paid ? ' (ưu tiên)' : ''}`, '#9fe3b6', 15); S.cheer.set(m.id, t + 900); break;

    case 'teams': S.teams = { tp: m.tp || [0,0,0,0], tps: m.tps || [0,0,0,0] }; break;
    case 'mission': float(m.id, 'Học sinh chăm! +3', '#ffe27a', 17); S.cheer.set(m.id, t + 1800); conf(24, at(m.id).x, at(m.id).y, 120); ting(); break;
    case 'hb': if (S.hbQ.length < 4) S.hbQ.push(m); break;

    case 'bow': act('cui', 4400); petals(46); ting(); break;

    case 'hoi': S.bigQ.push({ k: 'hoi', sub: `${fmt(m.n)} tim · bạn đang có mặt được +5 điểm`, dur: 5200 }); act('khen', 5000); ting(); break;
    case 'lv': float(m.id, `Lên hạng: ${m.title}`, '#ffe27a', 16, -22); S.cheer.set(m.id, t + 2000); break;
    case 'qd': if (S.q && S.q.id === m.id) { S.q.n = m.n; S.q.dist = m.dist; } break;
    case 'strip': S.strip = { text: m.text, t0: t, ms: m.ms || 9000 }; if (m.sd != null) S.shareDay = m.sd; break;
    case 'nudge': S.nudge.set(m.id, t + 6000); float(m.id, 'Cô gọi bạn!', '#ffd23f', 16); break;
    case 'me': float(m.id, `${m.points} điểm · ${m.title}`, '#fff', 15); break;
    case 'like': { S.likes = m.total || S.likes; if (m.goal) S.goal = m.goal; const p = at(m.id); for (let k = 0; k < Math.min(5, 1 + Math.floor(m.count / 3)); k++) S.hearts.push({ t: t + k * 120, x: p.x + (Math.random() - .5) * 16, y: p.y, s: 13 + Math.random() * 7, ph: Math.random() * 6 }); if (S.hearts.length > 60) S.hearts.splice(0, S.hearts.length - 60); break; }
    case 'goaldone': if (m.goal) S.goal = m.goal; S.bigQ.push({ k: 'goal', sub: `Cả lớp đã thả đủ ${fmt(m.target)} tim`, dur: 4200 }); act('khen', 4000); break;
    case 'share': case 'follow': if (m.t === 'share') { if (m.day != null) S.shareDay = m.day; const q = S.shareQ || (S.shareQ = []); if (q.length < 6) q.push(m.who || 'Một bạn'); } float(m.id, m.t === 'share' ? 'Rủ bạn vào lớp!' : 'Theo dõi lớp học!', '#7fd6ff', 15); if (m.t === 'follow') S.cheer.set(m.id, t + 1500); break;
    case 'gift': {
      S.donors = S.donors.filter(d => d.id !== m.id); S.donors.unshift({ id: m.id, name: m.name, avatar: m.avatar, tier: m.tier, until: Date.now() + ({ nho: 25, vua: 50, lon: 90, ratlon: 180 }[m.tier] || 25) * 1000 }); if (S.donors.length > 8) S.donors.pop();
      S.hoa = m.hoa ?? S.hoa; const p = at(m.id); act('camon', 3600); S.cheer.set(m.id, t + 3000);
      if (m.flower) { for (let k = 0; k < 6; k++) S.hearts.push({ t: t + k * 90, x: p.x + (Math.random() - .5) * 30, y: p.y, s: 15, ph: k }); float(m.id, 'Tặng hoa cô giáo!', '#ff9ac0', 16, -20); }
