<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>Bia Hơi Phố Cổ – thiết kế</title>
<meta name="viewport" content="width=720">
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Be+Vietnam+Pro:ital,wght@0,500;0,700;0,800;1,600&display=swap&subset=vietnamese" rel="stylesheet">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head><body><canvas id="c" width="720" height="1280"></canvas>
<script>
'use strict';
// BẢN THIẾT KẾ (chưa phải game): Bia Hơi Phố Cổ Online — 3 màn: ?f=1 thường · ?f=2 Bao cả quán · ?f=3 minigame Bàn nào vui nhất
const W=720,H=1280,CX=360,F=+(new URLSearchParams(location.search).get('f')||1);
const c=document.getElementById('c');let x=c.getContext('2d');
const SC=Math.min(2,Math.max(1,Math.ceil(Math.min(innerWidth/720,innerHeight/1280)*(devicePixelRatio||1)*4)/4));c.width=720*SC;c.height=1280*SC;
const SANS='"Be Vietnam Pro",Arial,sans-serif',SIGN='"Lobster","Be Vietnam Pro",serif';
function rr(a,b,w,h,q){x.beginPath();x.moveTo(a+q,b);x.arcTo(a+w,b,a+w,b+h,q);x.arcTo(a+w,b+h,a,b+h,q);x.arcTo(a,b+h,a,b,q);x.arcTo(a,b,a+w,b,q);x.closePath();}
function lg(x0,y0,x1,y1,st){const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function rg(cx,cy,r0,r1,st){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function glow(cx,cy,r,a,b){x.fillStyle=rg(cx,cy,0,r,[[0,a],[1,b]]);x.beginPath();x.arc(cx,cy,r,0,7);x.fill();}
function txt(t,X,Y,font,fill,align='center',stroke,o={}){x.save();x.font=font;x.textAlign=align;if(o.sp&&'letterSpacing' in x)x.letterSpacing=o.sp+'px';if(o.sh){x.shadowColor=o.sh[0];x.shadowBlur=o.sh[1];}
  if(stroke){x.lineJoin='round';x.lineWidth=stroke[1];x.strokeStyle=stroke[0];x.strokeText(t,X,Y);}x.fillStyle=fill;x.fillText(t,X,Y);x.restore();}
function fit(t,max,size,fam,wt='800'){let s=size;do{x.font=`${wt} ${s}px ${fam}`;}while(x.measureText(t).width>max&&--s>8);return x.font;}
const hash=s=>{let h=7;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))|0;return h>>>0;};
const AV=['#e57373','#64b5f6','#81c784','#ffb74d','#ba68c8','#4db6ac','#f06292','#a1887f'];
const YEL=(y0,y1)=>lg(0,y0,0,y1,[[0,'#fff7c2'],[.5,'#ffd84a'],[1,'#ffb21e']]);

// ---------- phố: trời đêm, dãy nhà ống, quán bia giữa, đèn dây, vỉa hè ----------
function street(){
  x.fillStyle=lg(0,0,0,700,[[0,'#070a1f'],[.6,'#151a3c'],[1,'#2a1e3a']]);x.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){const h=hash('s'+i);x.fillStyle=`rgba(255,255,240,${.15+(h%50)/100})`;x.fillRect(h%W,(h>>8)%260,1.4,1.4);}
  // nhà ống 2 bên (phần lộ ra quanh bảng)
  const HS=[[0,120,'#b98a3c'],[120,120,'#5f7d63'],[480,120,'#b5707a'],[600,120,'#c7b48a']];
  HS.forEach(([hx,w,cl],i)=>{const top=150+(i%2)*40;
    x.fillStyle=lg(0,top,0,760,[[0,cl],[1,'#2a1a14']]);x.fillRect(hx,top,w,760-top);
    x.fillStyle='rgba(0,0,0,.25)';x.fillRect(hx,top,w,10);
    for(let f=0;f<3;f++){const wy=top+40+f*120;x.fillStyle=f%2?'rgba(255,200,110,.75)':'rgba(255,220,150,.45)';rr(hx+24,wy,w-48,60,4);x.fill();
      x.strokeStyle='rgba(30,15,8,.7)';x.lineWidth=2;for(let k=1;k<4;k++){x.beginPath();x.moveTo(hx+24+k*(w-48)/4,wy);x.lineTo(hx+24+k*(w-48)/4,wy+60);x.stroke();}
      x.fillStyle='#2b1d16';x.fillRect(hx+16,wy+60,w-32,5);}
    // mặt tiền tầng trệt sáng đèn
    x.fillStyle=lg(0,640,0,760,[[0,'rgba(255,190,90,.85)'],[1,'rgba(160,90,30,.9)']]);x.fillRect(hx+8,640,w-16,120);
  });
  // quán bia giữa
  x.fillStyle=lg(0,250,0,760,[[0,'#d7b45a'],[.6,'#9c6a2a'],[1,'#3a2210']]);x.fillRect(236,250,248,510);
  x.fillStyle='#5b2a12';x.beginPath();x.moveTo(226,256);x.lineTo(360,214);x.lineTo(494,256);x.closePath();x.fill();
  // ban công tầng 2
  x.fillStyle='rgba(255,215,140,.7)';rr(268,300,184,92,6);x.fill();x.strokeStyle='#3a2210';x.lineWidth=3;[314,360,406].forEach(v=>{x.beginPath();x.moveTo(v,300);x.lineTo(v,392);x.stroke();});
  x.fillStyle='#2b1a10';x.fillRect(256,392,208,7);for(let k=0;k<14;k++)x.fillRect(260+k*15,399,3,22);x.fillRect(256,419,208,4);
  [[272,388],[444,388]].forEach(([px,py])=>{x.fillStyle='#3f7a3a';x.beginPath();x.arc(px,py-10,12,0,7);x.fill();});
  // biển hiệu
  x.save();x.shadowColor='rgba(255,60,40,.8)';x.shadowBlur=18;x.fillStyle=lg(0,440,0,500,[[0,'#c8261a'],[1,'#8a120a']]);rr(250,440,220,58,6);x.fill();x.restore();
  x.strokeStyle='#ffd84a';x.lineWidth=2.5;rr(254,444,212,50,5);x.stroke();
  txt('BIA HƠI · ĐỒ NƯỚNG',360,468,`800 18px ${SANS}`,'#ffe27a','center',null,{sp:2});txt('Mở cửa đến khuya',360,488,`italic 600 12px ${SANS}`,'#ffd9a8');
  // cửa quán: quầy + thùng inox (trang trí)
  x.fillStyle=lg(0,520,0,760,[[0,'#ffcf7a'],[1,'#c07a2a']]);x.fillRect(252,520,216,240);
  x.fillStyle='#6b3a16';x.fillRect(252,660,216,24);x.fillStyle='#4a260c';x.fillRect(252,684,216,76);
  [[288,610],[324,610]].forEach(([kx,ky])=>{x.fillStyle=lg(kx-15,0,kx+15,0,[[0,'#8a96a3'],[.5,'#eef3f7'],[1,'#7a8693']]);rr(kx-15,ky,30,50,7);x.fill();x.fillStyle='#5a6672';x.fillRect(kx-15,ky+14,30,3);x.fillRect(kx-15,ky+34,30,3);});
  x.fillStyle='#e8eef3';for(let k=0;k<5;k++){x.fillRect(392+k*13,628,9,14);}
  // vỉa hè
  x.fillStyle=lg(0,760,0,H,[[0,'#5a3a30'],[1,'#2a1a16']]);x.fillRect(0,760,W,H-760);
  x.strokeStyle='rgba(255,210,170,.08)';x.lineWidth=1;for(let y=770;y<H;y+=22+(y-760)*.05){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();}
  for(let i=-10;i<=10;i++){x.beginPath();x.moveTo(CX+i*40,760);x.lineTo(CX+i*110,H);x.stroke();}
  x.fillStyle='rgba(255,200,120,.12)';x.fillRect(0,756,W,6);
  // đèn dây
  [[600,48],[640,38]].forEach(([y0,sag],L)=>{x.strokeStyle='rgba(40,25,15,.9)';x.lineWidth=1.5;x.beginPath();x.moveTo(0,y0);x.quadraticCurveTo(CX,y0+sag*2,W,y0);x.stroke();
    for(let k=0;k<=18;k++){const t=k/18,bx=t*W,by=(1-t)*(1-t)*y0+2*(1-t)*t*(y0+sag*2)+t*t*y0+6;glow(bx,by,13,'rgba(255,210,120,.55)','rgba(255,180,80,0)');x.fillStyle=k%3===L?'#ffe9a8':'#ffd27a';x.beginPath();x.arc(bx,by,3.2,0,7);x.fill();}});
  // tối mép cho chữ
  x.fillStyle=lg(0,0,0,300,[[0,'rgba(5,3,10,.6)'],[1,'rgba(5,3,10,0)']]);x.fillRect(0,0,W,300);
}

// ---------- bàn inox, ghế nhựa, khách (ảnh đại diện) ----------
const NAMES=['Lan Anh','Minh Tuấn','Hoa Mai','Bảo Ngọc','Thu Hà','Quốc Huy','Ngọc Trâm','Đức Anh','Phương','Khánh Linh','Tùng','Hải Yến','Long','Vy','Nam','Trang','Hiếu','Thảo','Duy','My','Sơn','Hằng','Quân','Nhi','Bình','Kiên','Mai Chi','Phát'];
const ROWS=[{y:812,s:.74,xs:[178,360,542]},{y:958,s:.88,xs:[132,360,588]},{y:1122,s:1.02,xs:[112,360,608]}];
const TBL=[];ROWS.forEach(r=>r.xs.forEach(tx=>TBL.push({x:tx,y:r.y,s:r.s})));
function stool(X,Y,s,cl){x.fillStyle=cl;x.beginPath();x.moveTo(X-11*s,Y-20*s);x.lineTo(X+11*s,Y-20*s);x.lineTo(X+14*s,Y);x.lineTo(X+9*s,Y);x.lineTo(X+7*s,Y-12*s);x.lineTo(X-7*s,Y-12*s);x.lineTo(X-9*s,Y);x.lineTo(X-14*s,Y);x.closePath();x.fill();
  x.fillStyle='rgba(255,255,255,.25)';x.fillRect(X-11*s,Y-21*s,22*s,3*s);}
function guest(X,Y,s,name,o={}){
  const h=hash(name),shirt=AV[(h>>3)%AV.length];stool(X,Y,s,h%2?'#d8322a':'#2f6fd0');
  const up=o.cheer?14*s:0;
  x.fillStyle=shirt;rr(X-15*s,Y-50*s,30*s,30*s,10*s);x.fill();          // áo
  x.fillStyle='rgba(0,0,0,.15)';x.fillRect(X-15*s,Y-26*s,30*s,6*s);
  // tay cầm cốc (khi Dzô thì giơ cao)
  if(o.cheer){x.strokeStyle=shirt;x.lineWidth=7*s;x.lineCap='round';x.beginPath();x.moveTo(X+12*s,Y-44*s);x.lineTo(X+22*s,Y-66*s);x.stroke();mug(X+24*s,Y-72*s,s*.8);}
  const r=15*s,ay=Y-64*s;
  x.fillStyle=AV[h%AV.length];x.beginPath();x.arc(X,ay,r,0,7);x.fill();
  txt([...name][0].toUpperCase(),X,ay+r*.38,`800 ${Math.round(r*1.05)}px ${SANS}`,'#fff');
  x.lineWidth=Math.max(1.5,2.2*s);x.strokeStyle=o.vip?'#ffd84a':'#fff3d6';x.beginPath();x.arc(X,ay,r,0,7);x.stroke();
  if(o.label!==false){const nm=[...name].length>9?[...name].slice(0,8).join('')+'…':name,f=`800 ${Math.round(10.5*Math.min(1.1,s+.15))}px ${SANS}`;x.font=f;const w=x.measureText(nm).width+10;
    x.fillStyle=o.vip?'rgba(150,20,10,.92)':'rgba(15,8,20,.78)';rr(X-w/2,ay-r-17*s-4,w,15,7.5);x.fill();txt(nm,X,ay-r-17*s+7,f,o.vip?'#ffe27a':'#fff');}
}
function mug(X,Y,s){x.fillStyle='rgba(255,200,80,.85)';rr(X-6*s,Y-9*s,12*s,16*s,2*s);x.fill();x.fillStyle='#fffbe8';rr(X-6.5*s,Y-12*s,13*s,5*s,2.5*s);x.fill();
  x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=1.6*s;x.beginPath();x.arc(X+7*s,Y-1*s,4*s,-1.2,1.2);x.stroke();}
function dish(X,Y,s,k){x.fillStyle='#f4f1ea';x.beginPath();x.ellipse(X,Y,11*s,4.5*s,0,0,7);x.fill();
  if(k==='lac'){x.fillStyle='#c98a4a';for(let i=0;i<7;i++){x.beginPath();x.ellipse(X-6*s+(i%4)*4*s,Y-1.5*s-(i>3?2*s:0),2*s,1.4*s,0,0,7);x.fill();}}
  else if(k==='muc'){x.strokeStyle='#e8a868';x.lineWidth=3*s;x.lineCap='round';for(let i=0;i<3;i++){x.beginPath();x.moveTo(X-7*s+i*5*s,Y-1*s);x.quadraticCurveTo(X-4*s+i*5*s,Y-6*s,X-2*s+i*5*s,Y-1*s);x.stroke();}}
  else {x.fillStyle='#e0703a';for(let i=0;i<4;i++){rr(X-8*s+i*4.2*s,Y-4*s,3*s,6*s,1.4*s);x.fill();}}}
function table(t,i,o={}){
  const {x:X,y:Y,s}=t,seats=[[-30,-46],[30,-46],[-64,-6],[64,-6]];
  const names=NAMES.slice(i*3%NAMES.length).concat(NAMES).slice(0,4);
  const n=o.n??(i===8?2:i%4===3?3:4);
  seats.slice(0,2).forEach(([dx,dy],k)=>{if(k<n)guest(X+dx*s,Y+dy*s,s*.9,names[k],{cheer:o.cheer,vip:o.vip&&k===0,label:o.label});});
  // bàn inox
  x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(X,Y+2*s,54*s,10*s,0,0,7);x.fill();
  x.fillStyle='#8f9aa5';x.fillRect(X-3*s,Y-30*s,6*s,30*s);x.fillRect(X-22*s,Y-3*s,44*s,4*s);
  x.fillStyle=lg(X-48*s,0,X+48*s,0,[[0,'#9aa6b2'],[.45,'#f2f6f9'],[1,'#8a96a2']]);x.beginPath();x.ellipse(X,Y-32*s,48*s,15*s,0,0,7);x.fill();
  x.strokeStyle='#6c7884';x.lineWidth=1.5;x.stroke();
  dish(X-14*s,Y-33*s,s,['lac','muc','nem'][i%3]);if(!o.cheer){mug(X+14*s,Y-33*s,s);mug(X+26*s,Y-30*s,s*.9);}
  // số bàn
  x.fillStyle='rgba(20,10,8,.8)';rr(X-13*s,Y-14*s,26*s,13*s,6*s);x.fill();txt('B'+(i+1),X,Y-4.5*s,`800 ${Math.round(9.5*s)}px ${SANS}`,'#ffd84a');
  seats.slice(2).forEach(([dx,dy],k)=>{if(k+2<n)guest(X+dx*s,Y+dy*s,s,names[k+2],{cheer:o.cheer,label:o.label});});
}

// ---------- 3 nhân vật phục vụ (vẽ kiểu chibi: dễ thương, kín đáo) ----------
function staff(X,Y,s,who,o={}){
  x.save();x.translate(X,Y);x.scale(s,s);
  const P={hang:{hair:'#2a1810',shirt:'#c8261a',style:'bun'},thu:{hair:'#3a2216',shirt:'#c8261a',style:'tail'},mai:{hair:'#1c120c',shirt:'#c8261a',style:'long'}}[who];
  const dance=o.dance?Math.sin(performance.now()/180)*.5:0;
  x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(0,0,24,6,0,0,7);x.fill();
  // chân + giày
  x.fillStyle='#2a2a34';x.fillRect(-10,-34,8,30);x.fillRect(2,-34,8,30);x.fillStyle='#f4f4f4';rr(-13,-6,13,7,3);x.fill();rr(0,-6,13,7,3);x.fill();
  // quần + tạp dề dài qua gối
  x.fillStyle='#1d1d26';rr(-15,-62,30,32,6);x.fill();
  x.fillStyle='#2c1a10';rr(-14,-74,28,48,5);x.fill();x.fillStyle='#ffd84a';x.font=`800 7px ${SANS}`;x.textAlign='center';x.fillText('BHPC',0,-44);
  // áo phông quán
  x.fillStyle=P.shirt;rr(-17,-96,34,30,9);x.fill();
  // tay
  x.strokeStyle=P.shirt;x.lineWidth=8;x.lineCap='round';
  if(o.dance){[-1,1].forEach(k=>{x.beginPath();x.moveTo(k*14,-90);x.lineTo(k*26,-112+k*dance*8);x.stroke();x.fillStyle='#f2c6a0';x.beginPath();x.arc(k*27,-116+k*dance*8,4.5,0,7);x.fill();});}
  else if(o.wave){x.beginPath();x.moveTo(-14,-90);x.lineTo(-22,-70);x.stroke();x.beginPath();x.moveTo(14,-90);x.lineTo(26,-114);x.stroke();x.fillStyle='#f2c6a0';x.beginPath();x.arc(27,-118,5,0,7);x.fill();}
  else {x.beginPath();x.moveTo(-14,-90);x.lineTo(-20,-72);x.stroke();x.beginPath();x.moveTo(14,-90);x.lineTo(26,-80);x.stroke();
    // khay
    x.fillStyle='#c9d1d8';x.beginPath();x.ellipse(32,-84,20,5,0,0,7);x.fill();dish(30,-88,1,o.dish||'muc');}
  // đầu
  x.fillStyle=P.hair;if(P.style==='long'){rr(-18,-124,9,40,4);x.fill();rr(9,-124,9,40,4);x.fill();}
  x.fillStyle='#f2c6a0';x.beginPath();x.arc(0,-118,15,0,7);x.fill();
  x.fillStyle=P.hair;x.beginPath();x.arc(0,-122,15.5,Math.PI*1.02,Math.PI*1.98);x.fill();x.fillRect(-15.5,-124,31,5);
  if(P.style==='bun'){x.beginPath();x.arc(0,-139,8,0,7);x.fill();}
  if(P.style==='tail'){x.beginPath();x.ellipse(17,-112,6,15,.35,0,7);x.fill();x.fillStyle='#ffd84a';x.fillRect(12,-126,6,4);}
  if(P.style==='long'){x.fillStyle='#ffd84a';x.fillRect(-14,-131,28,3);}
  // mặt cười
  x.strokeStyle='#3a2216';x.lineWidth=1.8;x.lineCap='round';[-6,6].forEach(k=>{x.beginPath();x.arc(k,-117,2.6,Math.PI*1.1,Math.PI*1.9);x.stroke();});
  x.beginPath();x.arc(0,-112,4,.2,Math.PI-.2);x.stroke();x.fillStyle='rgba(255,120,120,.45)';[-9,9].forEach(k=>{x.beginPath();x.ellipse(k,-111,3.2,2,0,0,7);x.fill();});
  x.restore();
  const nm={hang:'Chị Hằng',thu:'Em Thu',mai:'Em Mai'}[who],f=`800 ${Math.round(11*s+1)}px ${SANS}`;x.font=f;const w=x.measureText(nm).width+14,ty=Y-150*s-6;
  x.fillStyle='rgba(200,38,26,.95)';rr(X-w/2,ty-9,w,18,9);x.fill();x.strokeStyle='#ffd84a';x.lineWidth=1.3;x.stroke();txt(nm,X,ty+4,f,'#fff4c8');
}

// ---------- bảng + chữ ----------
function panel(X,Y,w,h,title,chalk){
  x.save();x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=16;x.fillStyle=chalk?lg(0,Y,0,Y+h,[[0,'rgba(22,40,30,.94)'],[1,'rgba(10,22,16,.95)']]):lg(0,Y,0,Y+h,[[0,'rgba(60,14,10,.92)'],[1,'rgba(24,6,6,.94)']]);rr(X,Y,w,h,10);x.fill();x.restore();
  x.strokeStyle=chalk?'#a8743a':'#ffd84a';x.lineWidth=chalk?5:2;rr(X,Y,w,h,10);x.stroke();
  x.fillStyle=chalk?'rgba(255,255,255,.06)':'#c8261a';rr(X+6,Y+6,w-12,26,6);x.fill();
  txt(title,X+w/2,Y+24,fit(title,w-24,14,SANS),chalk?'#fff3c8':'#ffe27a','center',null,{sp:1});
}
function ico(k,X,Y,s=1){x.save();x.translate(X,Y);x.scale(s,s);
  if(k==='lac')dish(0,3,1.1,'lac');else if(k==='nem')dish(0,3,1.1,'nem');else if(k==='muc')dish(0,3,1.1,'muc');
  else if(k==='dzo'){mug(-5,4,1);mug(6,2,1);x.strokeStyle='#ffe9a8';x.lineWidth=1.5;[[-2,-14],[3,-15],[8,-12]].forEach(([a,b])=>{x.beginPath();x.moveTo(a*.6,b*.6);x.lineTo(a,b);x.stroke();});}
  else if(k==='ban'){x.fillStyle='#c9d1d8';x.beginPath();x.ellipse(0,4,13,5,0,0,7);x.fill();dish(-4,2,.6,'muc');dish(5,3,.6,'lac');x.fillStyle='#ffd84a';x.beginPath();x.arc(0,-9,3,0,7);x.fill();}
  else if(k==='quan'){['#ff5a4a','#ffd84a','#6fd0ff','#9dff7a'].forEach((cl,i)=>{const a=i*1.6;x.strokeStyle=cl;x.lineWidth=2;for(let r=0;r<6;r++){const b=a+r*1.05;x.beginPath();x.moveTo(Math.cos(b)*3,Math.sin(b)*3-2);x.lineTo(Math.cos(b)*(9+i),Math.sin(b)*(9+i)-2);x.stroke();}});}
