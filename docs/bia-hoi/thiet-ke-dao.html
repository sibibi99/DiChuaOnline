<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Be+Vietnam+Pro:ital,wght@0,500;0,700;0,800;1,600&display=swap&subset=vietnamese" rel="stylesheet">

</head><body><canvas id="c" width="720" height="1280"></canvas>
<script>
'use strict';
// BẢN THIẾT KẾ v2 (chưa phải game): Bia Hơi Đảo Thần Tiên — kiểu bar đảo đêm · ?f=1 thường · ?f=2 Bao cả đảo · ?f=3 minigame
const W=720,H=1280,CX=360,Q=new URLSearchParams(location.search),F=+(Q.get('f')||1),STILL=Q.has('still');
const c=document.getElementById('c');let x=c.getContext('2d');
const SC=Math.min(2,Math.max(1,Math.ceil(Math.min(innerWidth/720,innerHeight/1280)*(devicePixelRatio||1)*4)/4));c.width=720*SC;c.height=1280*SC;
const SANS='"Be Vietnam Pro",Arial,sans-serif',SIGN='"Lobster","Be Vietnam Pro",serif';
const PINK='#ff3fa4',CYAN='#2fe6ff',VIO='#9b5cff',LIME='#7dff8a';
function rr(a,b,w,h,q){x.beginPath();x.moveTo(a+q,b);x.arcTo(a+w,b,a+w,b+h,q);x.arcTo(a+w,b+h,a,b+h,q);x.arcTo(a,b+h,a,b,q);x.arcTo(a,b,a+w,b,q);x.closePath();}
function lg(x0,y0,x1,y1,st){const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function rg(cx,cy,r0,r1,st){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function glow(cx,cy,r,a,b){x.fillStyle=rg(cx,cy,0,r,[[0,a],[1,b]]);x.beginPath();x.arc(cx,cy,r,0,7);x.fill();}
function txt(t,X,Y,font,fill,align='center',stroke,o={}){x.save();x.font=font;x.textAlign=align;if(o.sp&&'letterSpacing' in x)x.letterSpacing=o.sp+'px';if(o.sh){x.shadowColor=o.sh[0];x.shadowBlur=o.sh[1];}
  if(stroke){x.lineJoin='round';x.lineWidth=stroke[1];x.strokeStyle=stroke[0];x.strokeText(t,X,Y);}x.fillStyle=fill;x.fillText(t,X,Y);x.restore();}
function fit(t,max,size,fam,wt='800'){let s=size;do{x.font=`${wt} ${s}px ${fam}`;}while(x.measureText(t).width>max&&--s>8);return x.font;}
const hash=s=>{let h=7;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))|0;return h>>>0;};
const AV=['#e57373','#64b5f6','#81c784','#ffb74d','#ba68c8','#4db6ac','#f06292','#a1887f'];
const YEL=(y0,y1)=>lg(0,y0,0,y1,[[0,'#fff7c2'],[.5,'#ffd84a'],[1,'#ffb21e']]);

// ---------- đảo đêm: trời tím, trăng, biển, dừa, quầy bar mái lá, sàn nhảy ----------
function palm(bx,by,h,lean,s=1){
  x.strokeStyle='#120a24';x.lineWidth=14*s;x.lineCap='round';x.beginPath();x.moveTo(bx,by);x.quadraticCurveTo(bx+lean*.2,by-h*.6,bx+lean,by-h);x.stroke();
  x.strokeStyle='rgba(255,63,164,.35)';x.lineWidth=2;x.beginPath();x.moveTo(bx+6*s,by);x.quadraticCurveTo(bx+lean*.2+6*s,by-h*.6,bx+lean+5*s,by-h);x.stroke();
  const tx=bx+lean,ty=by-h;x.fillStyle='#0e1a2c';
  [-2.7,-2.2,-1.6,-1.0,-.45,.1].forEach((a,i)=>{const L=(70+(i%2)*18)*s,ex=tx+Math.cos(a)*L,ey=ty+Math.sin(a)*L*.55+L*.35;
    x.beginPath();x.moveTo(tx,ty);x.quadraticCurveTo(tx+Math.cos(a)*L*.5,ty-20*s,ex,ey);x.quadraticCurveTo(tx+Math.cos(a)*L*.45,ty-4*s,tx,ty);x.fill();});
  x.fillStyle='#3a2a1a';[[-5,6],[5,7],[0,12]].forEach(([dx,dy])=>{x.beginPath();x.arc(tx+dx*s,ty+dy*s,5*s,0,7);x.fill();});
}
function island(){
  x.fillStyle=lg(0,0,0,600,[[0,'#0b0420'],[.45,'#2a0a4a'],[.85,'#6a1a66'],[1,'#a43a6a']]);x.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){const h=hash('s'+i);x.fillStyle=`rgba(255,240,255,${.15+(h%50)/100})`;x.fillRect(h%W,(h>>8)%420,1.5,1.5);}
  // trăng
  glow(360,372,150,'rgba(255,230,180,.35)','rgba(255,200,160,0)');
  x.fillStyle=rg(345,360,8,62,[[0,'#fffbe6'],[1,'#ffe0a0']]);x.beginPath();x.arc(360,372,60,0,7);x.fill();
  x.fillStyle='rgba(220,180,120,.25)';[[340,352,9],[378,390,12],[372,350,6]].forEach(([a,b,r])=>{x.beginPath();x.arc(a,b,r,0,7);x.fill();});
  // đảo xa + biển
  x.fillStyle='#1a0a30';x.beginPath();x.moveTo(0,575);x.quadraticCurveTo(120,520,240,568);x.quadraticCurveTo(300,555,330,575);x.lineTo(0,575);x.fill();
  x.beginPath();x.moveTo(470,575);x.quadraticCurveTo(600,530,720,560);x.lineTo(720,575);x.fill();
  x.fillStyle=lg(0,572,0,660,[[0,'#2a0f4a'],[1,'#0f0a2a']]);x.fillRect(0,572,W,88);
  for(let k=0;k<9;k++){const w=90-k*7;x.fillStyle=`rgba(255,230,170,${.55-k*.05})`;x.fillRect(360-w/2+(k%2)*6,578+k*9,w,2.5);}
  // bãi cát
  x.fillStyle=lg(0,650,0,770,[[0,'#3a1f3a'],[1,'#2a1430']]);x.fillRect(0,650,W,120);
  palm(214,770,300,-60,1.05);palm(506,770,320,70,1.1);palm(150,770,240,-90,.8);palm(580,770,250,95,.8);
  // quầy bar mái lá
  x.fillStyle=lg(0,600,0,760,[[0,'#2a1530'],[1,'#160a1e']]);x.fillRect(250,600,220,160);
  [[256,'#5a3a1e'],[458,'#5a3a1e']].forEach(([px,cl])=>{x.fillStyle=cl;x.fillRect(px,596,8,164);});
  x.fillStyle='#7a5a2a';x.beginPath();x.moveTo(226,608);x.lineTo(360,552);x.lineTo(494,608);x.closePath();x.fill();
  x.fillStyle='#5e4420';for(let k=0;k<22;k++){const fx=228+k*12;x.beginPath();x.moveTo(fx,606);x.lineTo(fx+6,622+(k%3)*4);x.lineTo(fx+12,606);x.fill();}
  x.strokeStyle='rgba(255,220,140,.25)';x.lineWidth=1;for(let k=0;k<8;k++){x.beginPath();x.moveTo(360,556);x.lineTo(236+k*35,604);x.stroke();}
  // biển neon trong quầy
  txt('Đảo Thần Tiên',350,662,`27px ${SIGN}`,'#fff','center',null,{sh:[PINK,18]});txt('Đảo Thần Tiên',350,662,`27px ${SIGN}`,'#ffd0ea','center',null,{sh:[PINK,6]});
  // quầy trước
  x.fillStyle=lg(0,690,0,760,[[0,'#1c0c26'],[1,'#0e0614']]);x.fillRect(244,690,232,70);
  x.save();x.shadowColor=PINK;x.shadowBlur=14;x.fillStyle=PINK;x.fillRect(244,688,232,4);x.shadowColor=CYAN;x.fillStyle=CYAN;x.fillRect(244,756,232,3);x.restore();
  for(let k=0;k<7;k++){x.fillStyle=[PINK,CYAN,VIO,LIME][k%4];x.globalAlpha=.55;x.beginPath();x.arc(262+k*33,724,5,0,7);x.fill();x.globalAlpha=1;}
  // loa 2 bên
  [[226,700],[494,700]].forEach(([sx,sy])=>{x.fillStyle='#0b0710';rr(sx-16,sy,32,58,4);x.fill();x.strokeStyle=CYAN;x.lineWidth=1.5;x.stroke();
    [[sy+18,9],[sy+42,11]].forEach(([cy,r])=>{x.strokeStyle='rgba(47,230,255,.6)';x.beginPath();x.arc(sx,cy,r,0,7);x.stroke();});});
  // sàn nhảy LED
  const Y0=770,xi=(i,y)=>CX+i*(40+70*(y-Y0)/(H-Y0)),ys=[];for(let y=Y0;y<H;y+=22+(y-Y0)*.05)ys.push(y);ys.push(H);
  x.fillStyle='#120818';x.fillRect(0,Y0,W,H-Y0);
  for(let r=0;r<ys.length-1;r++)for(let i=-11;i<=10;i++){const h=hash(`t${r}_${i}`);if(h%3)continue;const a=ys[r],b=ys[r+1];
    x.fillStyle=[PINK,CYAN,VIO,LIME][h%4];x.globalAlpha=.12+((h>>5)%10)/60;x.beginPath();x.moveTo(xi(i,a),a);x.lineTo(xi(i+1,a),a);x.lineTo(xi(i+1,b),b);x.lineTo(xi(i,b),b);x.closePath();x.fill();}
  x.globalAlpha=1;x.strokeStyle='rgba(155,92,255,.22)';x.lineWidth=1;ys.forEach(y=>{x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();});
  for(let i=-11;i<=11;i++){x.beginPath();x.moveTo(xi(i,Y0),Y0);x.lineTo(xi(i,H),H);x.stroke();}
  x.save();x.shadowColor=CYAN;x.shadowBlur=12;x.fillStyle=CYAN;x.fillRect(0,Y0-2,W,3);x.restore();
  // đèn dây nhiều màu
  [[620,46],[650,38]].forEach(([y0,sag],L)=>{x.strokeStyle='rgba(20,10,30,.9)';x.lineWidth=1.5;x.beginPath();x.moveTo(0,y0);x.quadraticCurveTo(CX,y0+sag*2,W,y0);x.stroke();
    for(let k=0;k<=18;k++){const t=k/18,bx=t*W,by=(1-t)*(1-t)*y0+2*(1-t)*t*(y0+sag*2)+t*t*y0+6,cl=[PINK,CYAN,'#ffd84a',LIME,VIO][(k+L)%5];glow(bx,by,12,cl+'88',cl+'00');x.fillStyle=cl;x.beginPath();x.arc(bx,by,3.2,0,7);x.fill();}});
  x.fillStyle=lg(0,0,0,300,[[0,'rgba(5,2,14,.65)'],[1,'rgba(5,2,14,0)']]);x.fillRect(0,0,W,300);
}
function lasers(n=1){x.save();x.globalCompositeOperation='lighter';
  const src=[[30,250,PINK],[690,250,CYAN],[360,240,VIO]];
  src.forEach(([sx,sy,cl],j)=>{for(let k=0;k<5*n;k++){const tx=(hash(`L${j}${k}`)%W),ty=800+(hash(`M${j}${k}`)%440);
    x.strokeStyle=cl;x.globalAlpha=.10;x.lineWidth=7;x.beginPath();x.moveTo(sx,sy);x.lineTo(tx,ty);x.stroke();x.globalAlpha=.35;x.lineWidth=1.2;x.stroke();}});
  x.restore();x.globalAlpha=1;}

// ---------- bàn neon, ghế, khách ----------
const NAMES=['Lan Anh','Minh Tuấn','Hoa Mai','Bảo Ngọc','Thu Hà','Quốc Huy','Ngọc Trâm','Đức Anh','Phương','Khánh Linh','Tùng','Hải Yến','Long','Vy','Nam','Trang','Hiếu','Thảo','Duy','My','Sơn','Hằng','Quân','Nhi','Bình','Kiên','Mai Chi','Phát'];
const ROWS=[{y:822,s:.74,xs:[140,580]},{y:968,s:.88,xs:[132,360,588]},{y:1122,s:1.02,xs:[112,360,608]}];
const TBL=[];ROWS.forEach(r=>r.xs.forEach(tx=>TBL.push({x:tx,y:r.y,s:r.s})));
function stool(X,Y,s,cl){x.fillStyle='#1a1222';x.fillRect(X-1.5*s,Y-18*s,3*s,18*s);x.fillRect(X-8*s,Y-2*s,16*s,2*s);
  x.save();x.shadowColor=cl;x.shadowBlur=8;x.fillStyle=cl;rr(X-12*s,Y-22*s,24*s,6*s,3*s);x.fill();x.restore();}
function guest(X,Y,s,name,o={}){
  const h=hash(name),shirt=AV[(h>>3)%AV.length];stool(X,Y,s,h%2?PINK:CYAN);
  x.fillStyle=shirt;rr(X-15*s,Y-50*s,30*s,30*s,10*s);x.fill();
  x.fillStyle='rgba(0,0,0,.18)';x.fillRect(X-15*s,Y-26*s,30*s,6*s);
  if(o.cheer){x.strokeStyle=shirt;x.lineWidth=7*s;x.lineCap='round';x.beginPath();x.moveTo(X+12*s,Y-44*s);x.lineTo(X+22*s,Y-66*s);x.stroke();mug(X+24*s,Y-72*s,s*.8);}
  const r=15*s,ay=Y-64*s;
  x.fillStyle=AV[h%AV.length];x.beginPath();x.arc(X,ay,r,0,7);x.fill();
  txt([...name][0].toUpperCase(),X,ay+r*.38,`800 ${Math.round(r*1.05)}px ${SANS}`,'#fff');
  x.lineWidth=Math.max(1.5,2.2*s);x.strokeStyle=o.vip?'#ffd84a':'#fff3d6';x.beginPath();x.arc(X,ay,r,0,7);x.stroke();
  if(o.label!==false){const nm=[...name].length>9?[...name].slice(0,8).join('')+'…':name,f=`800 ${Math.round(10.5*Math.min(1.1,s+.15))}px ${SANS}`;x.font=f;const w=x.measureText(nm).width+10;
    x.fillStyle=o.vip?'rgba(150,20,90,.92)':'rgba(15,6,26,.8)';rr(X-w/2,ay-r-17*s-4,w,15,7.5);x.fill();txt(nm,X,ay-r-17*s+7,f,o.vip?'#ffe27a':'#fff');}
}
function mug(X,Y,s){x.fillStyle='rgba(255,200,80,.85)';rr(X-6*s,Y-9*s,12*s,16*s,2*s);x.fill();x.fillStyle='#fffbe8';rr(X-6.5*s,Y-12*s,13*s,5*s,2.5*s);x.fill();
  x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=1.6*s;x.beginPath();x.arc(X+7*s,Y-1*s,4*s,-1.2,1.2);x.stroke();}
function dish(X,Y,s,k){x.fillStyle='#f4f1ea';x.beginPath();x.ellipse(X,Y,11*s,4.5*s,0,0,7);x.fill();
  if(k==='lac'){x.fillStyle='#c98a4a';for(let i=0;i<7;i++){x.beginPath();x.ellipse(X-6*s+(i%4)*4*s,Y-1.5*s-(i>3?2*s:0),2*s,1.4*s,0,0,7);x.fill();}}
  else if(k==='muc'){x.strokeStyle='#e8a868';x.lineWidth=3*s;x.lineCap='round';for(let i=0;i<3;i++){x.beginPath();x.moveTo(X-7*s+i*5*s,Y-1*s);x.quadraticCurveTo(X-4*s+i*5*s,Y-6*s,X-2*s+i*5*s,Y-1*s);x.stroke();}}
  else {x.fillStyle='#e0703a';for(let i=0;i<4;i++){rr(X-8*s+i*4.2*s,Y-4*s,3*s,6*s,1.4*s);x.fill();}}}
function table(t,i,o={}){
  const {x:X,y:Y,s}=t,seats=[[-30,-46],[30,-46],[-64,-6],[64,-6]],rim=[CYAN,PINK,VIO][i%3];
  const names=NAMES.slice(i*3%NAMES.length).concat(NAMES).slice(0,4);
  const n=o.n??(i===7?2:i%4===2?3:4);
  seats.slice(0,2).forEach(([dx,dy],k)=>{if(k<n)guest(X+dx*s,Y+dy*s,s*.9,names[k],{cheer:o.cheer,vip:o.vip&&k===0,label:o.label});});
  glow(X,Y,60*s,rim+'40',rim+'00');
  x.fillStyle='#2a2236';x.fillRect(X-3*s,Y-30*s,6*s,30*s);x.fillRect(X-22*s,Y-3*s,44*s,4*s);
  x.fillStyle=lg(0,Y-47*s,0,Y-17*s,[[0,'rgba(60,40,90,.95)'],[1,'rgba(20,10,35,.95)']]);x.beginPath();x.ellipse(X,Y-32*s,48*s,15*s,0,0,7);x.fill();
  x.save();x.shadowColor=rim;x.shadowBlur=12;x.strokeStyle=rim;x.lineWidth=2.5;x.stroke();x.restore();
  dish(X-14*s,Y-33*s,s,['lac','muc','nem'][i%3]);if(!o.cheer){mug(X+14*s,Y-33*s,s);mug(X+26*s,Y-30*s,s*.9);}
  x.fillStyle='rgba(10,4,18,.85)';rr(X-13*s,Y-14*s,26*s,13*s,6*s);x.fill();txt('B'+(i+1),X,Y-4.5*s,`800 ${Math.round(9.5*s)}px ${SANS}`,rim);
  seats.slice(2).forEach(([dx,dy],k)=>{if(k+2<n)guest(X+dx*s,Y+dy*s,s,names[k+2],{cheer:o.cheer,label:o.label});});
}

// ---------- 3 nữ phục vụ: dáng người lớn, sành điệu (đầm trễ vai, bốt), không hở hang ----------
const CAST={hang:{nm:'Chị Hằng',dress:['#f4f6ff','#9aa4d6'],trim:CYAN,hair:'#1a1430',hl:'#c9d2ff',style:'long'},
            thu:{nm:'Thu',dress:['#ff5fb0','#b0186a'],trim:'#ffe36b',hair:'#2a1020',hl:'#ff8ccc',style:'pony'},
            ngan:{nm:'Vũ công Ngân',dress:['#fff1a0','#d49a1a'],trim:PINK,hair:'#2a1418',hl:'#ffb0d0',style:'pony'},
            mai:{nm:'Mai',dress:['#9a5cff','#4a1aa8'],trim:LIME,hair:'#1c0f2e',hl:'#c39bff',style:'wave'}};
function lady(X,Y,s,who,o={}){
  const P=CAST[who],SK='#f6cfb0',sw=o.dance?Math.sin(performance.now()/160)*5:0;
  x.save();x.translate(X,Y);x.scale(s,s);
  x.fillStyle='rgba(0,0,0,.4)';x.beginPath();x.ellipse(0,0,26,6,0,0,7);x.fill();
  glow(0,-90,70,P.trim+'22',P.trim+'00');
  // chân + bốt
  x.fillStyle=SK;rr(-9,-92,7,64,3);x.fill();rr(2,-92,7,64,3);x.fill();
  x.fillStyle='#16121e';rr(-10,-42,9,42,3);x.fill();rr(1,-42,9,42,3);x.fill();
  x.save();x.shadowColor=P.trim;x.shadowBlur=6;x.fillStyle=P.trim;x.fillRect(-10,-42,9,2.5);x.fillRect(1,-42,9,2.5);x.restore();
  // tóc sau
  x.fillStyle=P.hair;
  if(P.style==='long'){rr(-16,-186,32,70,12);x.fill();}
  if(P.style==='wave'){for(let k=0;k<6;k++){[-1,1].forEach(d=>{x.beginPath();x.arc(d*(12+(k%2)*2),-176+k*10,8,0,7);x.fill();});}}
  if(P.style==='pony'){x.beginPath();x.ellipse(17,-166,7,24,.35,0,7);x.fill();x.strokeStyle=P.hl;x.lineWidth=2;x.beginPath();x.ellipse(17,-166,4,18,.35,-1,1);x.stroke();}
  // vai trần + cổ
  x.fillStyle=SK;rr(-17,-158,34,10,5);x.fill();x.fillRect(-3.5,-168,7,12);
  // đầm ôm, trễ vai, dài giữa đùi
  x.fillStyle=lg(0,-152,0,-86,[[0,P.dress[0]],[1,P.dress[1]]]);
  x.beginPath();x.moveTo(-15,-152);x.lineTo(15,-152);x.quadraticCurveTo(10,-130,11,-124);x.quadraticCurveTo(20,-104,19,-86);x.lineTo(-19,-86);x.quadraticCurveTo(-20,-104,-11,-124);x.quadraticCurveTo(-10,-130,-15,-152);x.closePath();x.fill();
  x.save();x.shadowColor=P.trim;x.shadowBlur=8;x.strokeStyle=P.trim;x.lineWidth=2;x.beginPath();x.moveTo(-15,-152);x.lineTo(15,-152);x.moveTo(-19,-86);x.lineTo(19,-86);x.stroke();x.fillStyle=P.trim;x.fillRect(-11,-126,22,3);x.restore();
  x.fillStyle='rgba(255,255,255,.8)';for(let k=0;k<6;k++){const h=hash(who+k);x.fillRect(-12+h%24,-148+(h>>4)%56,1.6,1.6);}
  // tay
  x.strokeStyle=SK;x.lineWidth=5.5;x.lineCap='round';x.lineJoin='round';
  const arm=(pts)=>{x.beginPath();x.moveTo(...pts[0]);pts.slice(1).forEach(p=>x.lineTo(...p));x.stroke();x.fillStyle=SK;const e=pts[pts.length-1];x.beginPath();x.arc(e[0],e[1],3.6,0,7);x.fill();};
  if(o.dance){arm([[-15,-150],[-25,-168+sw],[-18,-192+sw]]);arm([[15,-150],[25,-168-sw],[18,-192-sw]]);}
  else if(o.wave){arm([[-15,-150],[-25,-132],[-13,-120]]);arm([[15,-150],[27,-168],[31,-190]]);}
  else if(o.mic){arm([[-15,-150],[-25,-132],[-13,-120]]);arm([[15,-150],[20,-140],[8,-166]]);x.fillStyle='#222';rr(4,-178,6,16,3);x.fill();x.fillStyle='#bbb';x.beginPath();x.arc(7,-180,5,0,7);x.fill();}
  else {arm([[-15,-150],[-25,-132],[-13,-120]]);arm([[15,-150],[26,-140],[34,-152]]);
    x.save();x.shadowColor=P.trim;x.shadowBlur=8;x.fillStyle='#d9e2ea';x.beginPath();x.ellipse(37,-156,20,5,0,0,7);x.fill();x.restore();dish(36,-160,1,o.dish||'muc');}
