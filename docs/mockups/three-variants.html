<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="720" height="1280"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=720,H=1280;
const SERIF='"DejaVu Serif",serif',SANS='"DejaVu Sans",sans-serif';
let seed=11;const r=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
function rr(a,b,w,h,q){x.beginPath();x.moveTo(a+q,b);x.arcTo(a+w,b,a+w,b+h,q);x.arcTo(a+w,b+h,a,b+h,q);x.arcTo(a,b+h,a,b,q);x.arcTo(a,b,a+w,b,q);x.closePath();}
function lg(x0,y0,x1,y1,st){const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,cl])=>g.addColorStop(o,cl));return g;}
function glow(cx,cy,rad,inner,outer){const g=x.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,inner);g.addColorStop(1,outer);x.fillStyle=g;x.beginPath();x.arc(cx,cy,rad,0,7);x.fill();}
const GOLD=(y0,y1)=>lg(0,y0,0,y1,[[0,'#fff0b0'],[.45,'#e2ab3c'],[1,'#8a5414']]);
function txt(t,X,Y,font,fill,align='center',stroke){x.font=font;x.textAlign=align;if(stroke){x.lineWidth=stroke[1];x.strokeStyle=stroke[0];x.strokeText(t,X,Y);}x.fillStyle=fill;x.fillText(t,X,Y);}
const NAMES=['Minh Anh','Thu Hà','Quốc Bảo','Ngọc Diệp','Hoàng Nam','Lan Chi','Đức Huy','Mai Phương','Tuấn Kiệt','Bảo Ngọc','Văn Lợi','Thanh Tâm','Kim Ngân','Gia Hân','Phúc An','Hải Đăng','Tú Anh','Minh Khôi','Ánh Dương','Trâm Anh','Khánh Linh','Nhật Minh','Thảo My','Công Danh','Hồng Nhung','Quang Vinh','Yến Nhi','Bích Ngọc','Tiến Đạt','Diễm My','Anh Thư','Gia Bảo','Như Ý','Trọng Nghĩa','Cẩm Tú','Hữu Phước'];
const AV=['#e57373','#64b5f6','#81c784','#ffb74d','#ba68c8','#4db6ac','#f06292','#a1887f'];
function chip(X,Y,name,s=1,rank=0){
  const fs=Math.round(10*s+1);x.font='bold '+fs+'px '+SANS;const nm=name.length>9?name.slice(0,8)+'…':name;
  const w=x.measureText(nm).width+fs*1.7+10,h=fs+8;
  x.fillStyle='rgba(15,8,4,.72)';rr(X-w/2,Y,w,h,h/2);x.fill();
  if(rank){x.strokeStyle=rank==1?'#ffd257':'rgba(255,210,120,.7)';x.lineWidth=1.5;x.stroke();}
  x.fillStyle=AV[name.length%AV.length];x.beginPath();x.arc(X-w/2+h/2,Y+h/2,h/2-2,0,7);x.fill();
  txt(rank?String(rank):name[0],X-w/2+h/2,Y+h/2+fs*.36,'bold '+(fs-1)+'px '+SANS,'#fff');
  txt(nm,X-w/2+h+3,Y+h/2+fs*.36,'bold '+fs+'px '+SANS,rank==1?'#ffd257':'#fff','left');
}
function card(X,Y,w,h,title,line1,line2,accent='#ffd257'){
  x.fillStyle='rgba(50,14,8,.9)';rr(X,Y,w,h,12);x.fill();x.strokeStyle=accent;x.lineWidth=2;x.stroke();
  txt(title,X+14,Y+22,'bold 12px '+SANS,accent,'left');
  txt(line1,X+14,Y+44,'bold 15px '+SANS,'#fff','left');
  if(line2)txt(line2,X+14,Y+66,'italic 14px '+SERIF,'#f3dfc0','left');
}
function float(t,X,Y,size=26){txt(t,X,Y,'bold '+size+'px '+SERIF,'#ffe27a','center',['rgba(90,30,0,.85)',5]);}
function tag(t,X,Y,side){x.font='bold 14px '+SANS;const w=x.measureText(t).width+22;const X0=side<0?X:X-w;
  x.fillStyle='rgba(20,10,5,.78)';rr(X0,Y,w,30,15);x.fill();x.strokeStyle='#d9a441';x.lineWidth=1.5;x.stroke();txt(t,X0+11,Y+20,'bold 14px '+SANS,'#ffe7b0','left');}
function petals(n,cols){for(let i=0;i<n;i++){x.save();x.translate(r()*W,60+r()*1180);x.rotate(r()*6);x.fillStyle=cols[i%cols.length];x.beginPath();x.ellipse(0,0,7,3.5,0,0,7);x.fill();x.restore();}}

// kneeling devotee seen from behind
function devotee(X,Y,s,robe=['#7d8796','#b9c2cf','#6d7685'],bow=false,hl=false){
  x.save();x.translate(X,Y);x.scale(s,s);
  x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(0,26,26,7,0,0,7);x.fill();
  x.fillStyle=lg(-24,0,24,0,[[0,robe[0]],[.5,robe[1]],[1,robe[2]]]);
  const t=bow?-2:-12;
  x.beginPath();x.moveTo(-11,t);x.quadraticCurveTo(-20,t+8,-22,14);x.quadraticCurveTo(-28,26,-18,28);x.lineTo(18,28);x.quadraticCurveTo(28,26,22,14);x.quadraticCurveTo(20,t+8,11,t);x.closePath();x.fill();
  x.strokeStyle='rgba(40,45,55,.45)';x.lineWidth=1;x.beginPath();x.moveTo(0,t+3);x.lineTo(0,27);x.stroke();
  const hy=bow?-6:-22;
  x.fillStyle='#2a1d16';x.beginPath();x.arc(0,hy,10,0,7);x.fill();x.beginPath();x.arc(0,hy-10,5,0,7);x.fill();
  x.fillStyle='#d9ae86';x.fillRect(-4,hy+8,8,5);
  if(hl){x.strokeStyle='#ffd257';x.lineWidth=2.5;x.beginPath();x.arc(0,hy-2,15,0,7);x.stroke();}
  x.restore();
}

/* =========================== MẪU A =========================== */
function sceneA(){
  // wall
  x.fillStyle=lg(0,0,0,H,[[0,'#3a120a'],[.6,'#5a1c0e'],[1,'#2a0c06']]);x.fillRect(0,0,W,H);
  // carved wall panels
  for(const px of [0,W-150]){x.fillStyle='rgba(20,6,2,.35)';x.fillRect(px+14,250,136,520);x.strokeStyle='#b8862e';x.lineWidth=2;x.strokeRect(px+22,258,120,504);
    x.strokeStyle='rgba(230,180,80,.75)';x.lineWidth=2.2;for(let k=0;k<7;k++){const cx=px+82,cy=300+k*68;x.beginPath();x.arc(cx-16,cy,14,0.3,5.2);x.stroke();x.beginPath();x.arc(cx+16,cy+20,12,3.4,8.5);x.stroke();x.beginPath();x.moveTo(cx-16,cy+14);x.bezierCurveTo(cx,cy+30,cx,cy-10,cx+16,cy+8);x.stroke();}}
  // signboard
  x.fillStyle=lg(0,70,0,220,[[0,'#8e1e14'],[1,'#5c0f09']]);rr(40,72,640,150,10);x.fill();
  x.strokeStyle=GOLD(70,220);x.lineWidth=7;x.stroke();x.strokeStyle='#f3cf73';x.lineWidth=1.5;rr(54,84,612,126,6);x.stroke();
  for(const sx of [70,650]){x.strokeStyle='#e8b950';x.lineWidth=2;x.beginPath();x.arc(sx,147,16,0,7);x.stroke();x.beginPath();x.arc(sx,147,6,0,7);x.stroke();}
  txt('CHÙA AN LẠC',W/2,148,'bold 50px '+SERIF,'#ffd97a','center',['#5a1206',4]);
  txt('Cầu Bình An – Cầu Tài Lộc – Cầu May Mắn',W/2,192,'italic 23px '+SERIF,'#ffe7a8');
  // mandorla
  const qx=W/2,qy=360;
  glow(qx,qy,260,'rgba(255,190,80,.55)','rgba(255,120,30,0)');
  x.save();x.strokeStyle='rgba(255,215,130,.28)';x.lineWidth=2;for(let a=0;a<80;a++){const t=a/80*Math.PI*2;x.beginPath();x.moveTo(qx+Math.cos(t)*110,qy+Math.sin(t)*110);x.lineTo(qx+Math.cos(t)*240,qy+Math.sin(t)*240);x.stroke();}x.restore();
  glow(qx,qy,108,'rgba(255,250,215,1)','rgba(255,170,40,.9)');
  x.strokeStyle='#fff3c8';x.lineWidth=3;x.beginPath();x.arc(qx,qy,108,0,7);x.stroke();
  // flower bushes + vases
  function bush(bx,by){
    x.fillStyle='#24482a';x.beginPath();x.ellipse(bx,by+10,82,40,0,0,7);x.fill();
    for(let i=0;i<120;i++){const a=r()*Math.PI*2,d=Math.sqrt(r());const fx=bx+Math.cos(a)*84*d,fy=by-14+Math.sin(a)*52*d;
      x.fillStyle=['#ffd21f','#ffbf00','#ffe36a'][i%3];x.beginPath();x.arc(fx,fy,7.5,0,7);x.fill();x.fillStyle='rgba(180,110,0,.6)';x.beginPath();x.arc(fx,fy,2.2,0,7);x.fill();}
    // vase blue-white
    x.fillStyle=lg(bx-36,0,bx+36,0,[[0,'#cfd8e8'],[.5,'#ffffff'],[1,'#b8c4d8']]);
    x.beginPath();x.moveTo(bx-22,by+44);x.quadraticCurveTo(bx-46,by+90,bx-28,by+136);x.lineTo(bx+28,by+136);x.quadraticCurveTo(bx+46,by+90,bx+22,by+44);x.closePath();x.fill();
    x.strokeStyle='#2e5aa8';x.lineWidth=2;for(let k=0;k<4;k++){x.beginPath();x.arc(bx-12+k*8,by+90,9,0,Math.PI);x.stroke();}
    x.fillStyle='#2e5aa8';x.fillRect(bx-24,by+50,48,4);x.fillRect(bx-28,by+122,56,4);
  }
  bush(108,560);bush(W-108,560);
  // Quan Am statue
  const ivory=(x0,x1)=>lg(x0,0,x1,0,[[0,'#d9cdb8'],[.45,'#fffaf0'],[.7,'#f4ecdc'],[1,'#c9bba3']]);
  // pedestal clouds & lotus
  x.fillStyle='#e9e3d8';for(let i=0;i<7;i++){x.beginPath();x.arc(qx-120+i*40,672,26,0,7);x.fill();}
  x.strokeStyle='#bdb3a2';x.lineWidth=1.5;for(let i=0;i<7;i++){x.beginPath();x.arc(qx-120+i*40,672,14,3.4,6.0);x.stroke();}
  for(let i=0;i<9;i++){const px=qx-130+i*29;x.fillStyle=ivory(px,px+30);x.beginPath();x.moveTo(px,650);x.quadraticCurveTo(px+15,598,px+30,650);x.closePath();x.fill();x.strokeStyle='#c8bda9';x.stroke();}
  // robe body
  x.fillStyle=ivory(qx-80,qx+80);
  x.beginPath();x.moveTo(qx-30,300);x.quadraticCurveTo(qx-62,320,qx-66,400);x.quadraticCurveTo(qx-74,520,qx-92,632);x.lineTo(qx+92,632);x.quadraticCurveTo(qx+74,520,qx+66,400);x.quadraticCurveTo(qx+62,320,qx+30,300);x.closePath();x.fill();
  x.strokeStyle='rgba(150,135,110,.55)';x.lineWidth=1.6;
  [[-40,330,-56,620],[-14,360,-24,630],[14,360,22,630],[40,330,56,620]].forEach(([a,b,cc,d])=>{x.beginPath();x.moveTo(qx+a,b);x.quadraticCurveTo(qx+a*1.2,(b+d)/2,qx+cc,d);x.stroke();});
  // hood/veil
  x.fillStyle=ivory(qx-50,qx+50);x.beginPath();x.moveTo(qx,212);x.quadraticCurveTo(qx-52,226,qx-48,300);x.quadraticCurveTo(qx-40,330,qx-26,340);x.lineTo(qx+26,340);x.quadraticCurveTo(qx+40,330,qx+48,300);x.quadraticCurveTo(qx+52,226,qx,212);x.fill();
  // face
  x.fillStyle='#fff8ee';x.beginPath();x.ellipse(qx,268,24,30,0,0,7);x.fill();
  x.strokeStyle='#9c8a70';x.lineWidth=1.6;x.beginPath();x.arc(qx-9,266,5,0.2,2.9);x.stroke();x.beginPath();x.arc(qx+9,266,5,0.2,2.9);x.stroke();x.beginPath();x.arc(qx,282,5,0.3,2.8);x.stroke();
  x.fillStyle='#d9a441';x.beginPath();x.arc(qx,253,2,0,7);x.fill();
  // crown
  x.fillStyle=GOLD(220,246);x.beginPath();x.moveTo(qx-26,246);for(let i=0;i<=6;i++){x.lineTo(qx-26+i*8.6,i%2?226:240);}x.lineTo(qx+26,246);x.closePath();x.fill();
  // raised hand + vase
  x.fillStyle='#fff6ea';x.beginPath();x.ellipse(qx+30,392,9,16,-.2,0,7);x.fill();
  x.fillStyle=ivory(qx-50,qx-20);x.beginPath();x.ellipse(qx-34,430,10,18,0,0,7);x.fill();
  x.strokeStyle='#5d8c4a';x.lineWidth=2;x.beginPath();x.moveTo(qx-34,414);x.quadraticCurveTo(qx-40,396,qx-30,388);x.stroke();
  // altar
  const ay=700;
  x.fillStyle=lg(0,ay,0,ay+170,[[0,'#5a160b'],[1,'#36090a']]);x.fillRect(70,ay,580,170);
  x.fillStyle=GOLD(ay-10,ay+6);x.fillRect(60,ay-10,600,16);
  x.strokeStyle='#d9a441';x.lineWidth=2;x.strokeRect(96,ay+60,528,90);
  // dragons (stylized)
  for(const d of [-1,1]){x.strokeStyle='#e7b84f';x.lineWidth=4;x.beginPath();const cx=W/2+d*150;x.moveTo(cx-d*90,ay+120);x.bezierCurveTo(cx-d*40,ay+70,cx+d*10,ay+150,cx+d*70,ay+92);x.stroke();
    x.fillStyle='#e7b84f';x.beginPath();x.arc(cx+d*74,ay+90,9,0,7);x.fill();}
  x.fillStyle='#ffd257';x.beginPath();x.arc(W/2,ay+105,16,0,7);x.fill();
  // lamps, oranges, censer
  function lamp(lx){x.fillStyle=GOLD(ay-110,ay);x.fillRect(lx-4,ay-70,8,62);x.fillRect(lx-14,ay-12,28,6);
    glow(lx,ay-88,40,'rgba(255,235,170,.95)','rgba(255,170,60,0)');x.fillStyle='#fff3cf';rr(lx-11,ay-104,22,30,4);x.fill();x.strokeStyle='#c8902a';x.stroke();}
  [150,230,W-230,W-150].forEach(lamp);
  function oranges(ox){x.fillStyle=GOLD(ay-14,ay);x.beginPath();x.ellipse(ox,ay-4,30,7,0,0,7);x.fill();
    [[0,-38],[-11,-26],[11,-26],[-20,-14],[0,-14],[20,-14]].forEach(([dx,dy])=>{x.fillStyle='#ffa31a';x.beginPath();x.arc(ox+dx,ay+dy,10,0,7);x.fill();x.fillStyle='rgba(255,230,160,.6)';x.beginPath();x.arc(ox+dx-3,ay+dy-3,3,0,7);x.fill();});}
  oranges(W/2-92);oranges(W/2+92);
  x.fillStyle=GOLD(ay-50,ay);x.beginPath();x.ellipse(W/2,ay-24,44,20,0,0,7);x.fill();x.fillRect(W/2-36,ay-26,72,20);
  x.strokeStyle='#b0261c';x.lineWidth=2.5;for(let k=-6;k<=6;k++){x.beginPath();x.moveTo(W/2+k*4,ay-40);x.lineTo(W/2+k*7,ay-120);x.stroke();}
  x.fillStyle='#ff9a3c';for(let k=-6;k<=6;k++){x.beginPath();x.arc(W/2+k*7,ay-121,2.2,0,7);x.fill();}
  x.strokeStyle='rgba(235,225,215,.3)';x.lineWidth=3;for(let k=-1;k<=1;k++){x.beginPath();x.moveTo(W/2+k*30,ay-125);x.bezierCurveTo(W/2+k*30+20,ay-170,W/2+k*30-20,ay-200,W/2+k*30+10,ay-240);x.stroke();}
  // ticker on altar
  x.fillStyle='rgba(15,6,3,.82)';rr(150,ay+16,420,32,16);x.fill();x.strokeStyle='#d9a441';x.lineWidth=1.5;x.stroke();
  txt('“Hữu duyên tương ngộ nơi cửa Phật, cầu cho…',W/2,ay+38,'italic 15px '+SERIF,'#ffeccc');
  // floor + carpet
  const fy=870;x.fillStyle=lg(0,fy,0,H,[[0,'#4a2410'],[1,'#2a1206']]);x.fillRect(0,fy,W,H-fy);
  x.beginPath();x.moveTo(W/2-120,fy);x.lineTo(W/2+120,fy);x.lineTo(W/2+250,H);x.lineTo(W/2-250,H);x.closePath();x.fillStyle=lg(0,fy,0,H,[[0,'#9a1612'],[1,'#c42a1e']]);x.fill();
  x.strokeStyle='#e9b44a';x.lineWidth=6;x.stroke();x.lineWidth=2;
  x.beginPath();x.moveTo(W/2-108,fy);x.lineTo(W/2-226,H);x.moveTo(W/2+108,fy);x.lineTo(W/2+226,H);x.stroke();
  [[960,.55],[1070,.8],[1200,1.05]].forEach(([yy,s])=>{x.save();x.translate(W/2,yy);x.scale(s,s*.5);
    x.strokeStyle='#f0c25a';x.lineWidth=3;x.beginPath();x.arc(0,0,70,0,7);x.stroke();x.beginPath();x.arc(0,0,52,0,7);x.stroke();
    for(let p=0;p<8;p++){x.save();x.rotate(p*Math.PI/4);x.fillStyle='#f0c25a';x.beginPath();x.moveTo(0,-8);x.quadraticCurveTo(16,-30,0,-46);x.quadraticCurveTo(-16,-30,0,-8);x.fill();x.restore();}
    x.restore();});
  // devotees: front ranked row + rows on sides
  const front=[90,190,290,430,530,630];
  front.forEach((fx,i)=>{devotee(fx,900,.95,undefined,false,i==0);chip(fx,936,NAMES[i],.95,i+1);});
  const rows=[[990,.9],[1075,1.0],[1165,1.12]];let ni=6;
  rows.forEach(([yy,s],ri)=>{const half=120+130*(yy-fy)/(H-fy);
    for(const side of[-1,1]){const n=2;for(let k=0;k<n;k++){const xx=W/2+side*(half+48+k*(W/2-half-60)/n);
      devotee(xx,yy,s,undefined,(ni%7==3));chip(xx,yy+34*s,NAMES[ni%NAMES.length],.85);ni++;}}});
  // overlays
  card(qx-120,410,250,78,'📜 SỚ CẦU AN','🙏 @nguyenquynhanh','“Nam mô A Di Đà Phật”');
  tag('🔔 Thỉnh Chuông',8,820,-1);tag('Gõ Mõ 🪵',W-8,820,1);
  float('+20 Công Đức',530,1010,24);
  // gift toast
  x.fillStyle='rgba(120,20,10,.93)';rr(110,1110,500,58,29);x.fill();x.strokeStyle='#ffd257';x.lineWidth=2.5;x.stroke();
  txt('🌹',146,1150,'30px '+SANS,'#fff');
  txt('Thành tâm dâng Hoa hồng kính lễ Đức Phật',184,1133,'bold 15px '+SANS,'#ffe7a8','left');
  txt('— @duc.viet × 1  ·  Nam mô A Di Đà Phật',184,1155,'14px '+SANS,'#fff','left');
  petals(18,['rgba(255,214,80,.85)','rgba(255,240,170,.8)']);
}

/* =========================== MẪU B =========================== */
function sceneB(){
  x.fillStyle=lg(0,0,0,H,[[0,'#060b24'],[.45,'#14204a'],[.62,'#1d2a55'],[1,'#070d22']]);x.fillRect(0,0,W,H);
  for(let i=0;i<140;i++){x.fillStyle='rgba(255,255,255,'+(.3+r()*.7)+')';x.beginPath();x.arc(r()*W,r()*560,r()*1.4+.3,0,7);x.fill();}
  // moon
  glow(W/2,300,300,'rgba(255,236,190,.35)','rgba(255,236,190,0)');
  glow(W/2,300,150,'rgba(255,246,220,1)','rgba(255,214,150,.95)');
  x.fillStyle='rgba(220,190,140,.25)';[[-40,-30,22],[30,20,16],[-10,50,12],[55,-45,10]].forEach(([dx,dy,rad])=>{x.beginPath();x.arc(W/2+dx,300+dy,rad,0,7);x.fill();});
  // mountains
  x.fillStyle='#0f1a3a';x.beginPath();x.moveTo(0,620);x.lineTo(90,520);x.lineTo(170,580);x.lineTo(260,500);x.lineTo(340,590);x.lineTo(430,520);x.lineTo(540,600);x.lineTo(640,510);x.lineTo(W,560);x.lineTo(W,680);x.lineTo(0,680);x.fill();
  x.fillStyle='#0a1330';x.beginPath();x.moveTo(0,650);x.lineTo(120,600);x.lineTo(240,640);x.lineTo(380,590);x.lineTo(520,650);x.lineTo(W,600);x.lineTo(W,700);x.lineTo(0,700);x.fill();
  // stone platform
  x.fillStyle=lg(0,640,0,720,[[0,'#3b3f5c'],[1,'#20233a']]);x.beginPath();x.moveTo(170,690);x.lineTo(550,690);x.lineTo(600,730);x.lineTo(120,730);x.closePath();x.fill();
  // Buddha silhouette-gold seated (in front of moon)
  const bx=W/2,by=560;
  glow(bx,by-120,95,'rgba(255,215,120,.55)','rgba(255,200,100,0)');
  const g2=lg(0,by-200,0,by+130,[[0,'#f8d47a'],[.5,'#c48a2a'],[1,'#6e4510']]);x.fillStyle=g2;
